<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady Hands · Study 2 Session Runner v10.2</title>
<style>
:root{
  --bg:#f6f7f4; --card:#ffffff; --card2:#f0f2ed; --card3:#e6e9e0; --ink:#1c211d; --ink2:#5c665c; --ink3:#94a091;
  --accent:#2c6e68; --accent-tint:#e3f0ed; --warn:#b1503e; --warn-tint:#fbe8e3; --good:#2c6e68;
  --c-block:#2c6e68; --c-block-tint:#e3f0ed;
  --c-probe:#6d4f8a; --c-probe-tint:#efe7f5;
  --c-assess:#a06a20; --c-assess-tint:#f6ead4;
  --c-break:#3c7a4d; --c-break-tint:#e6f2e8;
  --c-flow:#5c665c; --c-flow-tint:#eef0eb;
  --shadow:0 1px 2px rgba(28,33,29,.04), 0 6px 16px rgba(28,33,29,.05);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#f6f7f4; --card:#ffffff; --card2:#f0f2ed; --card3:#e6e9e0; --ink:#1c211d; --ink2:#5c665c; --ink3:#94a091;
    --accent:#2c6e68; --accent-tint:#e3f0ed; --warn:#b1503e; --warn-tint:#fbe8e3;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;}
.wrap{max-width:560px; margin:0 auto; padding:0 16px 40px;}

header{position:sticky; top:0; z-index:20; background:var(--bg); padding-top:calc(env(safe-area-inset-top,0px) + 14px);}
.hd-row{display:flex; align-items:center; gap:8px; padding:0 16px 14px; max-width:560px; margin:0 auto;}
.hd-title{flex:1; min-width:0;}
.hd-title h1{margin:0; font-size:18px; font-weight:700; line-height:1.2;}
.hd-code{font-size:12px; color:var(--ink3); padding:2px 0; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hd-clock{text-align:right; font-family:var(--mono);}
.hd-clock .n{font-size:20px; font-weight:600;}
.hd-clock .l{font-size:9px; color:var(--ink3); letter-spacing:.06em;}
.iconbtn{width:36px; height:36px; border-radius:50%; border:none; background:var(--card2);
  color:var(--ink2); font-size:16px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer;}

.modebar{font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; padding:6px 16px; margin:0 -16px 8px;
  max-width:560px; text-align:center;}
.modebar.study{background:var(--c-block-tint); color:var(--c-block);}
.modebar.pilot{background:var(--c-assess-tint); color:var(--c-assess);}
.modebar.test{background:var(--warn-tint); color:var(--warn);}

.strip{display:flex; gap:6px; overflow-x:auto; padding:2px 16px 16px; margin:0 -16px; scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11px; font-weight:600; background:var(--card2); color:var(--ink3); border:none;}
.chip.done{background:var(--accent); color:#fff;}
.chip.now{background:var(--card); color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset;}

.now{background:var(--card); border-radius:20px; padding:20px; box-shadow:var(--shadow); margin-top:2px;}
.now .tag{font-family:var(--mono); font-size:10px; letter-spacing:.04em; padding:3px 9px; border-radius:20px; display:inline-block;}
.now .tag.steady{background:var(--c-block-tint); color:var(--c-block);}
.now .tag.bumpy{background:var(--c-probe-tint); color:var(--c-probe);}
.now .tag.split{background:var(--c-assess-tint); color:var(--c-assess);}
.now .tag.watch{background:var(--c-break-tint); color:var(--c-break);}
.now .tag.check{background:var(--c-flow-tint); color:var(--c-flow);}
.now .tag.flow{background:var(--c-flow-tint); color:var(--c-flow);}
.now h2{font-size:23px; margin:10px 0 2px; font-weight:700;}
.now .sub{font-size:13.5px; color:var(--ink2); margin-bottom:14px;}

.trackwrap{background:var(--card2); border-radius:16px; overflow:hidden; margin-bottom:10px;}
canvas#track-canvas, canvas#demo-canvas, canvas#fig-canvas, canvas#trace-canvas{width:100%; display:block;}
.zonebar{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--ink3); margin:-2px 2px 10px;}
.holdrow{margin-bottom:12px; display:flex; gap:8px;}
button.hold{font-size:24px; padding:18px; background:var(--card2); transition:transform .06s, background .06s; flex:1;}
button.hold:active,button.hold.fired{background:var(--accent-tint); transform:scale(0.94);}
button.nbk{font-size:15px; background:var(--c-assess-tint); color:var(--c-assess); flex:1.1;}
button.nbk:active,button.nbk.fired{transform:scale(0.94);}
.nbrow{display:flex; align-items:center; gap:10px; margin-bottom:12px; background:var(--card2); border-radius:14px; padding:10px 14px;}
.nb-cue{font-family:var(--mono); font-size:13px; color:var(--ink3); flex:1;}
.nb-score{font-family:var(--mono); font-size:12px; color:var(--ink3);}
.nbrow.flash-ok{animation:flashOk .4s ease;}
.nbrow.flash-bad{animation:flashBad .4s ease;}
@keyframes flashOk{0%{background:var(--c-block-tint);} 100%{background:var(--card2);}}
@keyframes flashBad{0%{background:var(--warn-tint);} 100%{background:var(--card2);}}

.timerbig{font-family:var(--mono); font-size:42px; font-weight:600; text-align:center; margin:6px 0 2px; letter-spacing:.01em;}
.timertarget{text-align:center; font-size:11.5px; color:var(--ink3); margin-bottom:6px;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap;}
button{font-family:var(--sans); font-size:15px; font-weight:600; border-radius:13px; border:none;
  background:var(--card2); color:var(--ink); padding:14px 16px; cursor:pointer; flex:1; min-height:50px;}
button.primary{background:var(--accent); color:#fff;}
button.warn{background:var(--warn-tint); color:var(--warn);}
button.ghost{background:transparent; color:var(--ink2);}
button:disabled{opacity:.35;}
button.small{flex:0 0 auto; padding:11px 14px; min-height:44px; font-size:14px;}

.kssdisplay{text-align:center; margin:14px 0 2px;}
.kssnum{font-family:var(--mono); font-size:46px; font-weight:700; color:var(--c-assess);}
.kssdesc{text-align:center; font-size:13px; color:var(--ink3); min-height:36px; margin:2px 0 14px; padding:0 10px;}
.kssrange{-webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:4px; background:var(--card2); accent-color:var(--c-assess); margin:8px 0 4px;}
.kssrange::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:30px; height:30px; border-radius:50%; background:var(--c-assess); cursor:pointer; border:3px solid var(--bg,#fff);}
.kssrange::-moz-range-thumb{width:30px; height:30px; border-radius:50%; background:var(--c-assess); cursor:pointer; border:3px solid var(--bg,#fff);}
.scalehint{display:flex; justify-content:space-between; font-size:11px; color:var(--ink3); margin-bottom:14px;}

.checklist label{display:flex; gap:10px; align-items:flex-start; padding:9px 0; font-size:14px; line-height:1.35;}
.checklist input{width:20px; height:20px; flex:0 0 auto; margin-top:1px;}

.flash{height:120px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; font-size:16px; margin-bottom:14px; background:var(--card2); color:var(--ink3); transition:transform .15s;}
.flash.go{background:var(--good); color:#fff; font-size:22px; animation:breathe 1s ease-in-out infinite;}
.flash.early{background:var(--warn); color:#fff;}
@keyframes breathe{0%,100%{opacity:.85; transform:scale(1);} 50%{opacity:1; transform:scale(1.03);}}
.pvtstats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; font-family:var(--mono); font-size:11.5px;}
.pvtstats div{background:var(--card2); border-radius:11px; padding:9px 11px; color:var(--ink3);}
.pvtstats b{display:block; font-size:17px; margin-top:2px; color:var(--ink); font-family:var(--sans);}

.sumrow{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:8px 4px; border-radius:10px;}
.sumrow:nth-child(odd){background:var(--card2);}
.sumrow span:last-child{font-family:var(--mono); color:var(--ink2); text-align:right; flex:0 0 auto;}

.donelist{margin-top:18px;}
.dlrow{display:flex; align-items:center; gap:10px; padding:11px 10px; font-size:14px; border-radius:12px;}
.dlrow:nth-child(odd){background:var(--card2);}
.dlrow .ck{width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.dlrow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dlrow .du{font-family:var(--mono); font-size:11.5px; color:var(--ink3); text-align:right; flex:0 0 auto;}

.logsec{margin-top:22px;}
.logsec summary{font-size:12px; color:var(--ink3); letter-spacing:.03em; cursor:pointer; padding:4px 0;}
.logline{font-family:var(--mono); font-size:11px; color:var(--ink2); padding:6px 10px; display:flex; gap:8px; border-radius:10px;}
.logline:nth-child(odd){background:var(--card2);}
.logline .t{color:var(--ink3); flex:0 0 auto;}
.logline.dev{color:var(--warn);}
.empty{font-size:12.5px; color:var(--ink3); padding:8px 0;}

.screenhead{display:flex; align-items:center; gap:10px; margin:4px 0 14px;}
.screenhead h2{font-size:20px; margin:0; flex:1;}
.blurb{font-size:13.5px; color:var(--ink2); margin-bottom:16px; line-height:1.45;}
.note{font-size:12.5px; color:var(--ink3); line-height:1.45; margin:10px 0 0;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--ink3); margin-bottom:5px; letter-spacing:.02em;}
.field input, .field select{width:100%; padding:12px 13px; border-radius:12px; border:1px solid var(--card3);
  background:var(--card2); font-size:16px; color:var(--ink); font-family:var(--sans);}
.f2{display:flex; gap:8px;} .f2 .field{flex:1;}

.barcard{background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
.barcard h3{font-size:14px; margin:0 0 12px;}
.barrow{margin-bottom:10px;}
.barrow .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--ink2); margin-bottom:4px;}
.bartrack{background:var(--card2); border-radius:8px; height:14px; overflow:hidden;}
.barfill{height:100%; border-radius:8px;}
.tablewrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{text-align:left; padding:7px 8px;}
tbody tr:nth-child(odd){background:var(--card2);}
th{color:var(--ink3); font-weight:600; font-size:11px;}
td.mono,th.mono{font-family:var(--mono);}

.gate{display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:12px; font-size:13px; margin-bottom:6px;}
.gate:nth-child(odd){background:var(--card2);}
.gate .st{font-family:var(--mono); font-size:10px; padding:3px 7px; border-radius:20px; flex:0 0 auto;}
.st.ok{background:var(--c-block-tint); color:var(--c-block);}
.st.no{background:var(--warn-tint); color:var(--warn);}
.st.na{background:var(--card3); color:var(--ink3);}
.gate .gb{flex:1; min-width:0;}
.gate .gb b{display:block; font-size:13px; margin-bottom:2px;}
.gate .gb span{font-size:12px; color:var(--ink2);}

.sheetlist button{display:flex; width:100%; text-align:left; margin-bottom:8px; background:var(--card2);}
.sheetlist button:last-child{margin-bottom:0;}
.figlegend{display:flex; gap:14px; font-size:12px; color:var(--ink2); margin:10px 0 4px; flex-wrap:wrap;}
.figlegend span{display:flex; align-items:center; gap:6px;}
.figlegend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
.caption{font-size:13px; color:var(--ink2); margin-top:6px;}

.modal-bg{position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:flex-end; z-index:50; overflow-y:auto;}
.modal-card{background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:22px; padding-bottom:calc(22px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow-y:auto;}
.modal-card h3{margin:0 0 8px; font-size:17px;}
.modal-card p{font-size:14px; color:var(--ink2); line-height:1.5; margin:0 0 16px;}
[hidden]{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <div class="hd-title">
      <h1 id="hd-name">Steady Hands</h1>
      <div class="hd-code" id="hd-code">no participant yet</div>
    </div>
    <div class="hd-clock"><div class="n" id="hd-elapsed">00:00</div><div class="l">ELAPSED</div></div>
    <button class="iconbtn" id="menu-btn" aria-label="Menu" title="Menu">⋯</button>
  </div>
  <div class="modebar" id="modebar"></div>
  <div class="strip" id="strip"></div>
</header>

<div class="wrap">
  <div id="mainview">
    <div id="nowcard"></div>
    <div class="donelist" id="donelist"></div>
    <div class="logsec"><details><summary>Session log</summary><div id="log" style="margin-top:8px"></div></details></div>
  </div>
  <div id="otherview" hidden></div>
</div>

<input type="file" id="import-file" accept="application/json" hidden>
<input type="file" id="dist-file" accept="application/json,.json,.csv,text/csv" hidden>
<input type="file" id="analyze-file" accept="application/json,.json" multiple hidden>
<input type="file" id="rescore-file" accept="application/json,.json" multiple hidden>
<input type="file" id="config-file" accept="application/json,.json" hidden>
<div class="modal-bg" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

   lists, and a study session stays locked until each is recorded. Pilot

      dist_NH_G1-01_543s_r4.json, checked against its FNV-1a on every
      install. It is installed automatically when no trace is present or

   10.1c. Every session records its trace. The session's copy of the trace

   10.1g. The study gate requires P0. Protocol Part 3 puts P0 before any

   ── CHANGED IN v10, AND WHY ───────────────────────────────────────
   10a. The resampler folded vibration into the playback band. v9 went
      100.4 -> 60 Hz by linear interpolation with no anti-alias filter.
      Linear interpolation leaves spectral images at 100.4 +/- f, and
      sampling at 60 Hz folds them to |40.4 - f| and |f - 19.6|: road and
      engine vibration at 35-45 Hz and 15-25 Hz landed in 0-5 Hz. On the
      NH G1-01 trace 23.6% of the delivered 0.2-5 Hz variance was folded
      content, and a planted 42 Hz tone appeared at 1.6 Hz with 7.9x the
      power of a real 1 Hz component. It also biased the gated tau: 0.3041
      s through v9, 0.3266 s through a band-limited resampler, which is
      exactly the native-rate value the r3 trace file reported and could
      not explain. The resampler is now Blackman-windowed-sinc band-limited
      interpolation (cutoff 0.4 x the lower rate), install measures the
      spectrum at the source rate as well, and a disagreement is a
      deviation. P0 carries the tone test.
   10b. Identical schedule in every block. Protocol §1.2 and Proposal
      Appendix A both say so; v9 seeded each block from its step index,
      so the five blocks got five different schedules. Onset times and
      group order now come from one per-session seed shared by all five
      300 s blocks. Direction is still drawn per perturbation, per block
      (§1.2 "direction randomised per perturbation"; S2.14 lists it as an
      anti-anticipation defence), and recovery traces are sign-normalised,
      so direction does not enter a fitted constant. Every block records a
      schedule signature and the session end checks they match. Reading
      "schedule" as timing and order, with direction drawn per
      perturbation, is an interpretation and is recorded as one.
   10c. Practice no longer replays the data stretch. v6 change L said
      practice "draws a different stretch, so the participant does not
      meet the data stretch in familiarisation"; the code drew an
      independent offset, which on the 543 s NH trace overlapped the 300 s
      data stretch in 85% of 3,000 session seeds. Practice now draws only from trace
      positions disjoint from the data stretch, and says so if none exist.
   10d. SDLP-premise excludes every fit window the runner fits. §8.2a-ii:
      "neither inside a fit window nor within 2 s of one ending". The
      catch singletons are fitted over 6.0 s (S2.14 censoring), but v9
      masked only 3 + 2 s after them, so recovery tails sat in the
      "perturbation-free" sample. One rule, exclSpanS(), now drives the
      premise, the fit-window share, the velocity distribution, the
      induction windows and the schedule's prediction, so they cannot
      drift apart. Block premise: 226 s -> 220 s.
   10e. The S2.14 exclusion audit no longer scores practice. Practice
      delivers seven recent-history onsets, so every session raised a
      spurious "below eight per history" deviation on familiarisation.
   10f. PVT scoring. A stimulus still showing when the three minutes end
      was dropped; it is now an omission, and a lapse once it has waited
      past the lapse threshold. Responses under 100 ms are anticipations
      and are scored as false starts, not reaction times (standard PVT
      scoring; Basner & Dinges, 2011). Onset is timestamped at the frame
      the stimulus is drawn in and the response at its event timestamp.
   10g. P0 is complete for what this runner computes. Check 3 band-limited
      the OU OUTPUT, which is not the protocol's test; it now drives a
      fixed-lambda system with coloured FORCING. Added, as Protocol Part 3
      requires: the first-passage cancellation, sigma-insensitivity of the
      gap estimator, shape-classifier sensitivity, the power re-derivation
      at the common 3.0 s window, the pre-onset velocity exclusion run
      through this runner's own functions, the S2.18 proxy check and the
      resampler test. p0 now uses the specified 1,000-fold block
      permutation. A coverage row names the P0 items that live in the
      analysis code, so nobody reads this screen as covering them.
      The new sensitivity check FAILS, and that is a finding about the
      protocol rather than the runner: the G7 classifier as S2.15 specifies
      it flags the shape §6.5b predicts (a rise, then partial recovery) in
      about 5% of planted series, and less often as the rise gets larger.
      P0's row says why and what a fix would look like.
   10h. Conformance rows are computed, not asserted. Seven rows were
      hardcoded true — the thing this screen's own comment calls "a claim,
      not a check". They now run the real engine tick, input logging,
      meters, anticipation, censoring, clamp and premise code on a
      synthetic block and report what came back.
   10i. The arithmetic is stated at every level (Standing Rule 20).
      §8.2a's own sum is 9 x 17 + 8 x 3.0 + 6 = 183 s, lead-out 67 s,
      while its table and Standing Rule 20 say 184 and 66; and Appendix A
      expects 190-215 s of premise, which its own definition does not
      reproduce (220 s). The runner reports both and changes neither: the
      documents are the authority and need the correction.
   10j. KSS anchors restored to the validated wording ("keep awake"; level
      9 "very sleepy, great effort to keep awake, fighting sleep").
   10k. Save status is reported, not assumed. The finish screen said
      "saving automatically — no action needed" and the done modal said
      "the file has been saved" before any save had resolved — the claim
      v8 change S withdrew for reset. Both now report the actual outcome.
      The page title still said v4, one line above the provenance field
      changes O and X repaired.
   10l. Build is carried with every calibration row, and G1/G5 do not pass
      on cells recorded under different builds, because 10a and 10d
      change the quantities those gates compare. A session resumed under a
      different build is logged as a deviation.
   10m. Trace loader: the ten-second minimum is checked in seconds (v9
      counted 600 samples, six seconds at 100.4 Hz), and a CSV's sample

   ── CHANGED IN v9, AND WHY ────────────────────────────────────────
   T. G5 is scored. Protocol Part 2: "G5 is the one most often skipped.
      It looks like housekeeping and is not: simulation shows Study 3's
      power collapses from 1.00 to 0.52 as relative error on tau-hat
      rises from 0.35 to 0.60, while changing the sample size from 20 to
      60 does nothing at all." Through v8 the runner held every ingredient
      — the error series, the onsets, a bounded censored fitTau — and
      computed nothing. Each block now fits the quiet-history and
      recent-history decay constants and jackknifes their relative
      standard error; the session reports the worst cell; the calibration
      record carries it per participant; and the study gate reads it the
      way it reads G1. Failure is not a runner decision: the protocol's
      remedy is "increase perturbations per block until it passes", which
      changes §8.2a's arithmetic and belongs in the protocol first.
   U. The anticipation check is computed, not deferred. S2.14 requires the
      history gap from the first four pairs of a block against the last
      four, and Part 4 lists "history gap grows within a block as much as
      across the session → anticipation, not fatigue. Report the
      within-block check BEFORE the interaction." A check reported after
      the interaction has already been read is not the check.
   V. Censoring is measured within participant. S2.14: the two catch
      singletons are the only quiet-history observations with a clean 6 s
      window, so each block now reports the singleton constant at 3.0 s
      and at 6.0 s alongside the paired quiet-history constant at 3.0 s.
      Part 4: "that difference is the censoring, measured. Report it; it
      bounds every gap in that participant's data."
   W. Clamping is located, not just counted. v8 counted samples at the
      display bound and raised a deviation; it could not say whether they
      fell inside a fit window. A clamped sample inside a 3.0 s fit window
      censors the recovery being fitted, and censoring that differs
      between conditions or between histories is exactly what Standing
      Rule 19 forbids. Clamp indices are now retained, every onset carries
      clampedInFitWindow, and the per-block audit breaks the count down by
      history. On the 2026-09-24 pilot every clamped sample sat in the two
      road cells.
   X. The export said 'session-runner v4.0'. Change O bumped
      PROTOCOL.runner to v8.0 and left the literal in buildExport
      untouched, so every v7 and v8 file still carried v4.0 in the one
      field whose only job is provenance — the same failure O was written
      to fix, one line further down. The conformance string is now built
      from PROTOCOL.runner and cannot drift from it.
   Y. The disturbance loader keeps the trace file's provenance. It read
      four fields and discarded the rest, so revision, the superseded
      file, the event inventory, the axis verification, the recorded
      speed, the selection rationale and the amplitude record never
      reached the session record. Standing Rule 27 answers a documentary
      question from the document; the trace file is that document and the
      export is where it has to survive.

   ── CHANGED IN v8, AND WHY ────────────────────────────────────────
   P. G1 now gates a study session. The calibration screen already
      computed the pairwise match correctly; nothing consulted it. The
      2026-09-24 pilot collected a full hour at road +612%, load +137%
      and fatigue +6.3% — every pair failing G1 by one to two orders of
      magnitude — and the runner let it. An hour of a participant's time
      spent on cells that cannot be compared is not a pilot result. A
      study session now requires a calibration record that passes: n >= 6,

   R. The S2.14 exclusion is evaluated at the end of the session, not

      block, so it exists the moment the last block ends: the runner
      reports the rate per condition and per history and raises a
      deviation where a cell drops under the eight-per-history power

      off-by-one, road loses 56% and late road 61%.
   S. A session cannot be cleared until its file is saved AND the

   ── CHANGED IN v7, AND WHY ────────────────────────────────────────
   M. The pre-onset velocity window ended ON the onset sample instead of
      before it. err[nIdx] is written AFTER the impulse is added, so the
      window straddled the displacement and measured the perturbation
      rather than the state preceding it. The 2026-09-24 pilot settles
      it: pertAmp 0.900 over a 0.100 s window predicts 9.000 units/s if
      the window spans the onset, and the observed median across 128
      onsets was 9.081. Applying S2.14's rule to that excluded 100% of
      perturbations in every condition — the primary behavioural
      analysis, reduced to nothing, silently. The window now ends at
      nIdx-1, the last sample before the impulse lands.
   N. Silent half-rate operation is now caught, before the session and
      during it. That same pilot ran nine blocks at a median frame
      interval of 33 ms — 30.3 Hz against the 60 Hz §1.2 specifies. The
      fixed-step accumulator kept the plant honest, so nothing looked
      wrong, but input is sampled per frame: corrections were timestamped
      at half resolution, 523 intervals took only 76 distinct values, and
      some taps collapsed into a single frame. That lands on S2.12's
      inter-correction CV and on every fit window. The study gate now
      refuses a display below the floor, and each block raises a
      deviation if the realised frame interval drifts past it.
   O. The runner string tracks the build. v5 and v6 both reported
      'session-runner v4.0' in every export because only schemaVersion
      was bumped — provenance stated wrongly, in a file whose purpose is

   ── CHANGED IN v6, AND WHY ────────────────────────────────────────
   I. The disturbance correlation time is measured from the spectrum,
      not from lag-1. correlationTimeRangeS holds S1.2's [0.121, 0.443],
      which S1.2 derived from the 0.2-2 Hz spectrum of each class. v5
      compared that range against -dt/ln(AC1) at 60 Hz on a one-pole
      band-limited series, which is a different quantity: at 60 Hz the
      lag-1 coefficient is set by the 5 Hz low-pass corner, not by the
      road. Run on the real Study 1 recordings it returned 0.041 (NH),
      0.028 (UA), 0.079 (PB), 0.161 (SB), 0.170 (UP) — collapsing five
      classes into a range that barely discriminates, and rejecting
      three of the five as out-of-family. The spectral estimator returns
      0.304 / 0.169 / — / — / 0.122 against S1.2's 0.443 / 0.297 / 0.377
      / 0.140 / 0.121: right ordering, right family, and UP reproduces
      to three decimals. lag-1 is retained as a labelled diagnostic.
      This is the same class of error as the S3.7 dimensional slip and
      Standing Rule 25 — the estimator was not the quantity.
   J. The gate carries a tolerance, because the published range is the
      span of five pooled class means and a single segment is a draw
      around its own class mean. Pilot-fixed and dated like everything
      else, not hardcoded.
   K. Playback no longer wraps. v5 chose an offset anywhere in the trace
      and read modulo its length, so a 300 s block starting late in a
      1500 s trace wrapped — a step discontinuity in d(t), mid-block,
      at an offset nobody recorded. The offset is now drawn so the block
      fits, and a trace too short for the block raises a deviation.
   L. The early and late road blocks play the SAME stretch of road. The
      comparison they support is fatigue at equal disturbance, and v5
      gave them independent random offsets, which put road variance
      inside it. This is the same reasoning §8.2a-i applies to the
      perturbation pair — hold the stimulus identical, let only the
      state differ. Practice draws a different stretch, so the
      participant does not meet the data stretch in familiarisation.
      THIS IS A PROTOCOL CHANGE AND MUST BE CARRIED IN THE
      PRE-REGISTRATION BEFORE IT IS RUN.

   ── CHANGED IN v5, AND WHY ────────────────────────────────────────
   A. The break offered at the induction boundary is now taken on its
      own panel AFTER the KSS rating is confirmed, and it is timed.
      v4 put the offer beside the slider with no enforced order, so a
      participant could rest before rating — and the induction-end KSS
      is the input to G2's "KSS rises >= 2 points". The file already
      applied this reasoning to the PVT and not to the KSS.
   B. That break's realised length is recorded. v4 stored taken:true
      with no duration. It is the break that sits between the 22-min
      induction and the late phase, so its length is a covariate on the
      comparison the study turns on, not housekeeping.
   C. The single load+removal KSS rating is now registered where it
      belongs: a deviation is raised at session start and the S8.3
      prediction it makes untestable ("Load, 60 s after removal:
      KSS/PVT recovers") is entered as an abandoned analysis under
      Standing Rule 7. In v4 the reasoning lived only in a comment.
   D. Pre-onset error velocity is measured and emitted per onset, with
      the perturbation-free velocity distribution per block. S2.14
      calls this exclusion "required, not optional" and fixes its
      threshold in pilot; v4 carried neither the parameter nor the
      channel. The exclusion itself is applied in analysis, against the
      BASELINE block's percentile, never the fatigued cell's.
   E. The history-gap window delivers ~7.5 pairs, not the 9 that S8.6
      sized it on. A power re-derivation reference is now a required
      setup field and blocks a study session, rather than a note.
   F. Induction windows slide at a 30 s stride. S8.6 says "sliding
      one-minute windows"; v4 used a 60 s stride, which is consecutive
      rather than sliding, and left the S8.6 baseline resting on two
      windows and one degree of freedom. Baseline is now selected by
      time range (windows wholly inside minutes two and three), which
      is three windows. They overlap, so the SD is still optimistic and
      the record says so rather than implying independence.
      THIS IS A PROTOCOL CHANGE AND MUST BE CARRIED IN THE
      PRE-REGISTRATION BEFORE IT IS RUN.
   G. Practice now confirms the participant against the pilot-fixed
      SDLP target instead of only recording numbers, per S8.2's
      "confirmed against the participant's own baseline". Outside the
      band is logged as a deviation. Nothing is tuned, ever.
   H. noPreamble is load-bearing: the conformance row for the removal
      probe now asserts it, so the flag cannot silently stop meaning
      anything.

   ── CHANGED IN v4, AND WHY ────────────────────────────────────────
   1. The removal probe now follows the load block with nothing between
      it and the load block. v3 interposed a KSS rating, which is both a
      delay of unknown length and a cognitive task, inside the one
      measurement whose logic is "capacity returns the moment load is
      removed" (§1.2 "fixed immediately after the load block"; §8.2 p.40).
      The load-block and removal-probe KSS are taken together after the
      probe, carrying both boundary labels. THIS IS A PROTOCOL CHANGE
      AND MUST BE CARRIED IN THE PRE-REGISTRATION BEFORE IT IS RUN.
   2. No identifiable data is collected. The participant code is derived
      from the participant number, not from a name. Appendix C: "No
      identifiable data." Standing Rule 10's principle — a file that
      never contained it cannot leak it.
   3. The load condition no longer changes the tracking task. ◀ and ▶
      keep identical size and position in every condition; the n-back
      response key sits on its own row; per-response feedback and the
      running score are confined to practice. §1.2 "tracking parameters
      unchanged."
   4. S2.18's channels are emitted under their protocol names — error
      signal, tracked variable, control output, known injected input —
      rather than collapsed into one. The degeneracy of the first two
      under a centred compensatory display is logged, not assumed away.
   5. Perturbation onsets carry no haptic cue. navigator.vibrate is
      absent on iOS Safari, so v3's cue made the stimulus differ by
      device.

  ['sdlpTargetIncreasePct', 0,  '%',     'The SDLP-premise increase the three manipulations are matched to. Set from the G1 pilot result. Practice confirms against it; nothing is ever tuned in a session'],

/* ── seeded RNG, so every schedule is reproducible from the file ── */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15, 1|a); t=t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function gaussFrom(rnd){ let u=0,v=0; while(u===0)u=rnd(); while(v===0)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cssvar(n){ try{ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }catch(e){ return '#888'; } }

/* ══ SESSION STRUCTURE ══════════════════════════════════════════════
   Proposal v16 §8.2. Built from the order index so the early phase is
   counterbalanced and the removal probe follows the load block wherever
   it falls. Fatigue conditions are positionally fixed, because a state
   defined by elapsed time cannot be otherwise. ═══════════════════════ */
function buildSteps(orderIndex){
  const order=ORDERS[orderIndex%6];
  const st=[];
  const kss=(label,boundary,offerBreak)=>st.push({k:'kss',title:'KSS · '+label,tag:'check',dur:0,boundary,offerBreak:!!offerBreak});
  st.push({k:'setup',    title:'Study setup',        tag:'flow', dur:0});
  st.push({k:'consent',  title:'Consent',            tag:'flow', dur:0});
  kss('start','session-start',false);
  st.push({k:'practice', title:'Practice & familiarisation', tag:'flow', dur:PROTOCOL.practiceS,
           segments:[{cond:'base',dur:60},{cond:'road',dur:60},{cond:'load',dur:60}]});
  order.forEach((c,i)=>{
    st.push({k:'track', cond:c, phase:'early', dur:PROTOCOL.blockS, title:CONDITIONS[c].title, tag:CONDITIONS[c].tag, posInPhase:i+1});
    if(c==='load'){
      /* §1.2 "fixed immediately after the load block"; §8.2 p.40 "60 s of
         unloaded baseline immediately after the load block". Nothing goes
         between them — not a rating, not a prompt. The probe tests whether
         capacity returns the moment load is removed, so any interposed task
         is both a delay of unknown length and a cognitive load of its own.
         The two boundary ratings are therefore taken together, once, after
         the probe, and the record carries both labels. */
      st.push({k:'track', cond:'removal', phase:'probe', dur:PROTOCOL.probeS, title:CONDITIONS.removal.title,
               tag:'check', fixedTo:'load block', noPreamble:true});
      kss('after load block and removal probe','early-'+(i+1)+'+removal-probe', false);
    } else {
      kss('after '+CONDITIONS[c].title.toLowerCase(),'early-'+(i+1), false);
    }
  });
  st.push({k:'pvt', title:'PVT · end of early phase', tag:'check', dur:PROTOCOL.pvtS,
           point:'early-phase-end', offerBreakAfter:'early-phase-end'});
  st.push({k:'track', cond:'induct', phase:'induction', dur:PROTOCOL.inductionS, title:CONDITIONS.induct.title, tag:'watch'});
  kss('after induction','induction-end', true);
  st.push({k:'track', cond:'fatBase', phase:'late', dur:PROTOCOL.blockS, title:CONDITIONS.fatBase.title, tag:'steady', posInPhase:1});
  kss('after late baseline','late-1', false);
  st.push({k:'track', cond:'fatRoad', phase:'late', dur:PROTOCOL.blockS, title:CONDITIONS.fatRoad.title, tag:'bumpy', posInPhase:2});
  kss('after late road','late-2', false);
  /* No break is offered after the session-end PVT: the 2-minute break below
     is part of the design and the persistence probe is only interpretable
     against a known break length. */
  st.push({k:'pvt', title:'PVT · session end', tag:'check', dur:PROTOCOL.pvtS, point:'session-end'});
  st.push({k:'break', title:'Break', tag:'flow', dur:PROTOCOL.breakS});
  st.push({k:'track', cond:'persist', phase:'probe', dur:PROTOCOL.probeS, title:CONDITIONS.persist.title, tag:'check'});
  kss('after persistence probe','persistence-probe', false);
  st.push({k:'finish', title:'Finish session', tag:'flow', dur:0});
  return st;
}
/* Standing Rules 12 and 20: check the arithmetic before running anyone,
   at every level. KSS is self-paced inside the §8.2 assessment allowance
   and carries a nominal zero. */
function sessionArithmetic(steps){
  const nominal=steps.reduce((a,s)=>a+(s.dur||0),0);
  return {nominalS:nominal, requiredS:PROTOCOL.sessionTotalS, closes:nominal===PROTOCOL.sessionTotalS};
}

/* ══ PERTURBATION SCHEDULE ═════════════════════════════════════════
   Proposal v16 §8.2a. Generated before the block starts, stored whole,
   never regenerated mid-block. ════════════════════════════════════ */
function buildSchedule(durS, seed, opts){
  opts=opts||{};
  const fs=PROTOCOL.fs, rnd=mulberry32(seed);
  /* Timing and direction come from separate streams, so a block can share
     its onset times with every other block (§1.2 "identical schedule in
     every block") while each perturbation still draws its own direction
     (§1.2 "direction randomised per perturbation"). */
  const drnd = opts.dirSeed!=null ? mulberry32(opts.dirSeed>>>0) : rnd;
  const mk=(jitterFixed)=>{
    const groups=[], onsets=[];
    const leadIn = opts.leadInS!=null ? opts.leadInS : PROTOCOL.leadInS;
    let t=leadIn, gi=0;
    const cycle=()=>{
      const types=[]; for(let i=0;i<PROTOCOL.pairsPerBlock;i++) types.push('pair');
      for(let i=0;i<PROTOCOL.singletonsPerBlock;i++) types.push('single');
      for(let i=types.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const x=types[i]; types[i]=types[j]; types[j]=x; }
      return types;
    };
    let pool=cycle();
    const tail = opts.tailS!=null ? opts.tailS : PROTOCOL.postLastOnsetS;
    while(true){
      if(!pool.length) pool=cycle();
      const type=pool[0];
      const lastOn = onsets.length ? onsets[onsets.length-1].tS : null;
      const start = lastOn==null ? leadIn
        : lastOn + (jitterFixed ? PROTOCOL.jitterMinS
                   : PROTOCOL.jitterMinS + rnd()*(PROTOCOL.jitterMaxS-PROTOCOL.jitterMinS));
      const end = type==='pair' ? start+PROTOCOL.pairIntervalS : start;
      if(end + tail > durS) break;
      if(opts.maxGroups && groups.length>=opts.maxGroups) break;
      pool.shift();
      const g={index:gi++, type, tS:start};
      groups.push(g);
      onsets.push({tS:+start.toFixed(3), nIdx:Math.round(start*fs), history:'quiet', group:g.index, gtype:type,
                   dir: drnd()<0.5?-1:1});
      if(type==='pair') onsets.push({tS:+(start+PROTOCOL.pairIntervalS).toFixed(3), nIdx:Math.round((start+PROTOCOL.pairIntervalS)*fs),
                   history:'recent', group:g.index, gtype:type, dir: drnd()<0.5?-1:1});
    }
    return {groups, onsets, lastOnsetS:onsets.length?onsets[onsets.length-1].tS:null, jitterFixed};
  };
  let sch=mk(false);
  let free=premiseFreeSeconds(sch.onsets, durS);
  let refixed=false;
  /* §8.2a: if the perturbation-free sample falls below 150 s the jitter is
     fixed at 15 s rather than a pair being dropped. Applies to full blocks. */
  if(durS>=PROTOCOL.blockS && free<PROTOCOL.premiseFloorS){
    sch=mk(true); free=premiseFreeSeconds(sch.onsets, durS); refixed=true;
  }
  sch.durS=durS; sch.predictedFreeS=+free.toFixed(2); sch.jitterRefixed=refixed;
  sch.pairs=sch.groups.filter(g=>g.type==='pair').length;
  sch.singletons=sch.groups.filter(g=>g.type==='single').length;
  sch.quietHistoryN=sch.onsets.filter(o=>o.history==='quiet').length;
  sch.recentHistoryN=sch.onsets.filter(o=>o.history==='recent').length;
  sch.leadInS=(opts.leadInS!=null?opts.leadInS:PROTOCOL.leadInS);
  sch.leadOutS=sch.lastOnsetS!=null ? +(durS-sch.lastOnsetS-PROTOCOL.postLastOnsetS).toFixed(2) : null;
  sch.groupsPerMin=+(sch.groups.length/(durS/60)).toFixed(3);
  /* Density inside the sequence, which is the quantity that must match
     between a block and the induction (§8.6 "at constant density").
     The overall rate is diluted by the lead-in and lead-out. */
  const spanS=sch.lastOnsetS!=null ? (sch.lastOnsetS+PROTOCOL.postLastOnsetS-sch.leadInS) : null;
  sch.sequenceSpanS = spanS!=null ? +spanS.toFixed(2) : null;
  sch.sequenceGroupsPerMin = spanS>0 ? +(sch.groups.length/(spanS/60)).toFixed(3) : null;
  sch.sequencePairsPerMin = spanS>0 ? +(sch.pairs/(spanS/60)).toFixed(3) : null;
  /* §8.6 sizes the history-gap window at 3 minutes because "one minute
     supplies roughly three pairs". Report what the realised schedule
     actually delivers per 3-minute window, so the power re-derivation uses
     the achieved count rather than the document's rounding. */
  sch.pairsPerGapWindow = spanS>0 ? +(sch.pairs/(spanS/60)*(PROTOCOL.gapWindowS/60)).toFixed(2) : null;
  sch.seed=seed; sch.dirSeed=(opts.dirSeed!=null?opts.dirSeed>>>0:null);
  sch.signature=scheduleSignature(sch);
  return sch;
}
/* Timing and order only. Direction is excluded by design (see 10b). */
function scheduleSignature(sch){ return sch.groups.map(g=>g.type[0]+g.tS.toFixed(3)).join(','); }
function stepSeed(i, step){ return (S.seed ^ hashStr('step'+i+':'+(step.cond||step.k)))>>>0; }
function isFullBlock(step){ return step.k==='track' && (step.phase==='early'||step.phase==='late') && step.dur===PROTOCOL.blockS; }
function blockScheduleSeed(){ return (S.seed ^ hashStr('block-schedule'))>>>0; }
/* The one place a step's schedule is decided, used by the engine and by the
   conformance screen, so the screen checks the schedule that actually runs.
   §8.2a: a 300 s block carries exactly 10 groups; the induction runs the
   same rules continuously; practice gets a short lead-in so the participant
   meets perturbations in each of its three minutes; probes are
   pre-specified. */
function scheduleFor(i, step){
  const seed=stepSeed(i, step), durS=step.dur;
  if(step.k==='practice') return Object.assign(buildSchedule(durS, seed, {leadInS:10}), {familiarisation:true});
  if(durS<=PROTOCOL.probeS) return buildProbeSchedule(durS, seed);
  if(step.phase==='induction') return buildSchedule(durS, seed, {});
  return Object.assign(buildSchedule(durS, blockScheduleSeed(), {maxGroups:PROTOCOL.groupsPerBlock, dirSeed:seed}),
    {identicalAcrossBlocks:true, sharedTimingSeed:blockScheduleSeed()});
}
/* Probe schedule, pre-specified rather than jittered: 60 s cannot hold the
   block schedule. Fixed here, before any participant, and logged.
   Standing Rule 19 applies downstream and is carried in the record: a gap
   estimated from 2 pairs is not comparable to one estimated from 8 unless
   the block estimate is subsampled to the same count and censoring. */
function buildProbeSchedule(durS, seed){
  const fs=PROTOCOL.fs, rnd=mulberry32(seed);
  const onsets=[], groups=[];
  [[15.0,0],[35.0,1]].forEach(([t,gi])=>{
    groups.push({index:gi, type:'pair', tS:t});
    onsets.push({tS:t, nIdx:Math.round(t*fs), history:'quiet', group:gi, gtype:'pair', dir:rnd()<0.5?-1:1});
    onsets.push({tS:t+3, nIdx:Math.round((t+3)*fs), history:'recent', group:gi, gtype:'pair', dir:rnd()<0.5?-1:1});
  });
  const free=premiseFreeSeconds(onsets, durS);
  const probe={groups, onsets, durS, predictedFreeS:+free.toFixed(2), jitterFixed:true, jitterRefixed:false,
    pairs:2, singletons:0, quietHistoryN:2, recentHistoryN:2, preSpecified:true, seed,
    leadInS:15, lastOnsetS:38, groupsPerMin:+(2/(durS/60)).toFixed(3),
    ruleNineteen:'2 quiet-history and 2 recent-history observations. Comparable only against equal-count, equally censored subsamples of block data (Standing Rule 19).'};
  probe.signature=scheduleSignature(probe);
  return probe;
}
/* §8.2a-ii, once. Every mask in this file — premise, fit-window share,
   velocity distribution, induction windows, per-segment practice values and
   the schedule's own prediction — calls this, so they cannot disagree. */
function fitSpanS(o){ return o.gtype==='single' ? PROTOCOL.singletonWindowS : PROTOCOL.fitWindowS; }
function exclSpanS(o){ return fitSpanS(o)+PROTOCOL.premiseTailS; }
function premiseFreeSeconds(onsets, durS){
  const iv=onsets.map(o=>[o.tS,o.tS+exclSpanS(o)]).sort((a,b)=>a[0]-b[0]);
  const m=[];
  iv.forEach(([a,b])=>{ if(m.length && a<=m[m.length-1][1]) m[m.length-1][1]=Math.max(m[m.length-1][1],b); else m.push([a,b]); });
  const ex=m.reduce((s,[a,b])=>s+Math.min(b,durS)-Math.min(a,durS),0);
  return durS-ex;
}

/* ══ DISTURBANCE ══════════════════════════════════════════════════
   §1.2: Study 1's measured lateral-acceleration trace, resampled
   100 → 60 Hz, band-limited, amplitude scaled in pilot, RETAINED AS A
   FILE so it enters the ARMAX fit as a known exogenous input, sample by
   sample. The runner therefore stores the exact injected d(t).
   ═════════════════════════════════════════════════════════════════ */
let DIST=null;   // {meta:{...}, samples60:Float32Array}
function loadDistFromStore(){
  try{
    const raw=localStorage.getItem(DKEY); if(!raw) return;
    const rec=JSON.parse(raw);
    DIST={meta:rec.meta, samples60:Float32Array.from(rec.samples60)};
  }catch(e){ DIST=null; }
}
function storeDist(){
  if(!DIST) return;
  try{ localStorage.setItem(DKEY, JSON.stringify({meta:DIST.meta, samples60:Array.from(DIST.samples60, v=>+v.toFixed(6))})); }
  catch(e){ deviation('storage','Disturbance trace too large for local storage — reload it before each session'); }
}
/* 10a. Band-limited resampling. Linear interpolation leaves images at
   srcHz +/- f that a 60 Hz grid folds into the playback band; this is a
   Blackman-windowed sinc evaluated at each output instant, zero phase,
   cutoff 0.4 x the lower of the two rates, half-width set so the
   transition is no wider than 0.1 x 60 Hz. Weights are normalised per
   output sample, so DC gain is exactly 1 and the edges renormalise rather
   than taper. */
const RESAMPLER={method:'Blackman-windowed-sinc band-limited interpolation, zero phase, per-sample normalised',
  cutoffFrac:0.4, transitionFracOfOutput:0.1};
function resamplerDesign(srcHz){
  const fc=RESAMPLER.cutoffFrac*Math.min(srcHz, PROTOCOL.fs);
  const H=Math.max(8, Math.ceil(5.5*srcHz/(RESAMPLER.transitionFracOfOutput*PROTOCOL.fs)/2));
  return {cutoffHz:+fc.toFixed(3), halfWidthSamples:H};
}
function resampleTo60(src, srcHz){
  if(srcHz===PROTOCOL.fs) return Float32Array.from(src);
  const n=Math.floor((src.length-1)*(PROTOCOL.fs/srcHz))+1, out=new Float32Array(n);
  const ratio=srcHz/PROTOCOL.fs, dsg=resamplerDesign(srcHz), fcN=dsg.cutoffHz/srcHz, H=dsg.halfWidthSamples;
  for(let i=0;i<n;i++){
    const t=i*ratio, k0=Math.floor(t);
    let acc=0, wsum=0;
    for(let k=k0-H+1;k<=k0+H;k++){
      if(k<0||k>=src.length) continue;
      const u=t-k; if(Math.abs(u)>=H) continue;
      const x=2*fcN*u, s=(x===0)?1:Math.sin(Math.PI*x)/(Math.PI*x);
      const w=s*(0.42+0.5*Math.cos(Math.PI*u/H)+0.08*Math.cos(2*Math.PI*u/H));
      acc+=w*src[k]; wsum+=w;
    }
    out[i]=wsum!==0?acc/wsum:0;
  }
  return out;
}
/* One-pole high-pass then one-pole low-pass, forward only. Phase is not
   corrected and does not need to be: d(t) is stored exactly as injected,
   so the analysis sees the signal the participant actually received. */
function bandLimit(x, loHz, hiHz){
  const dt=PROTOCOL.dt, out=new Float32Array(x.length);
  const rcH=1/(2*Math.PI*loHz), aH=rcH/(rcH+dt);
  const rcL=1/(2*Math.PI*hiHz), aL=dt/(rcL+dt);
  let yPrev=0, xPrev=x[0]||0, z=0;
  for(let i=0;i<x.length;i++){
    const y=aH*(yPrev + x[i] - xPrev); yPrev=y; xPrev=x[i];
    z=z + aL*(y-z);
    out[i]=z;
  }
  return out;
}
function rms(a){ let s=0; for(let i=0;i<a.length;i++) s+=a[i]*a[i]; return Math.sqrt(s/Math.max(1,a.length)); }
function lag1(a){
  let m=0; for(let i=0;i<a.length;i++) m+=a[i]; m/=a.length;
  let n0=0,n1=0;
  for(let i=0;i<a.length;i++){ const d=a[i]-m; n0+=d*d; if(i) n1+=d*(a[i-1]-m); }
  return n0>0 ? n1/n0 : 0;
}
/* Welch PSD by Goertzel, evaluated only on the bins that matter. A full
   FFT is not needed: the descriptors are a centroid over 0.2-2 Hz and a
   power share over 0.2-5 Hz, so a few hundred bins suffice. About 0.1 s
   for a 25-minute trace, once, at install. */
function psdBand(x, fs, segS, loHz, hiHz, stepHz){
  let nseg=Math.round(segS*fs);
  if(x.length<nseg) nseg=Math.floor(x.length/2);
  if(nseg<Math.round(fs*10)) return null;          // under 10 s resolves nothing at 0.2 Hz
  const hop=Math.max(1,Math.floor(nseg/2));
  const w=new Float64Array(nseg);
  for(let i=0;i<nseg;i++) w[i]=0.5-0.5*Math.cos(2*Math.PI*i/nseg);
  const f=[]; for(let v=loHz; v<=hiHz+1e-9; v+=stepHz) f.push(+v.toFixed(6));
  const P=new Float64Array(f.length); let nS=0;
  for(let a=0; a+nseg<=x.length; a+=hop){
    let m=0; for(let i=0;i<nseg;i++) m+=x[a+i]; m/=nseg;
    for(let k=0;k<f.length;k++){
      const om=2*Math.PI*f[k]/fs, c=2*Math.cos(om);
      let s1=0,s2=0;
      for(let i=0;i<nseg;i++){ const s0=(x[a+i]-m)*w[i]+c*s1-s2; s2=s1; s1=s0; }
      const re=s1-s2*Math.cos(om), im=s2*Math.sin(om);
      P[k]+=re*re+im*im;
    }
    nS++;
  }
  if(!nS) return null;
  for(let k=0;k<P.length;k++) P[k]/=nS;
  return {f, P, segments:nS, segmentS:+(nseg/fs).toFixed(1)};
}
/* The quantity §1.2 means by "measured correlation time", and the two
   descriptors S1.2 reports alongside it. Computed on the resampled series
   before band-limiting, which is the closest thing the runner holds to the
   signal S1.2 measured. */
function spectralDescriptors(x, fsIn){
  const r=psdBand(x, fsIn||PROTOCOL.fs, PROTOCOL.psdSegmentS,
                  PROTOCOL.psdBandHz[0], PROTOCOL.psdBandHz[1], PROTOCOL.psdStepHz);
  if(!r) return null;
  const [tlo,thi]=PROTOCOL.tauBandHz;
  let num=0,den=0,above=0,all=0;
  for(let k=0;k<r.f.length;k++){
    const f=r.f[k], p=r.P[k];
    if(f>=tlo && f<=thi){ num+=f*p; den+=p; }
    all+=p; if(f>0.5) above+=p;
  }
  if(!(den>0)||!(all>0)) return null;
  const cen=num/den;
  return {centroidHz:+cen.toFixed(4), correlationTimeS:+(1/(2*Math.PI*cen)).toFixed(4),
    shareAbove05Hz:+(above/all).toFixed(4), tauBandHz:PROTOCOL.tauBandHz,
    psdSegmentS:r.segmentS, psdSegments:r.segments,
    method:'Welch PSD (Hann, 50% overlap) by Goertzel on '+PROTOCOL.psdBandHz[0]+'-'+PROTOCOL.psdBandHz[1]+
      ' Hz; centroid over '+tlo+'-'+thi+' Hz; tau = 1/(2*pi*centroid). This is the quantity S1.2 reports. '+
      'Lag-1 is carried separately as a diagnostic and is NOT comparable to it.'};
}
function installDisturbance(rawSamples, srcHz, meta){
  const res=resampleTo60(rawSamples, srcHz);
  const band=bandLimit(res, P('distBandLowHz'), P('distBandHighHz'));
  const r=rms(band) || 1;
  const scale=P('distRms')/r;
  const out=new Float32Array(band.length);
  for(let i=0;i<band.length;i++) out[i]=band[i]*scale;
  const ac=lag1(out);
  const lagTau = ac>0 && ac<1 ? -PROTOCOL.dt/Math.log(ac) : null;
  const sp=spectralDescriptors(res);              // pre-band-limit, per §1.2
  /* The same descriptors at the source rate. A resampler that preserves the
     playback band returns the same numbers; one that folds vibration into it
     does not (10a). */
  const spSource=spectralDescriptors(rawSamples, srcHz);
  const spDelivered=spectralDescriptors(out);     // what the participant actually gets
  const tau = sp ? sp.correlationTimeS : null;
  const tol=P('s12ToleranceFrac');
  const lo=PROTOCOL.correlationTimeRangeS[0]*(1-tol), hi=PROTOCOL.correlationTimeRangeS[1]*(1+tol);
  DIST={meta:Object.assign({}, meta, {
    sourceHz:srcHz, resampledToHz:PROTOCOL.fs, resample:RESAMPLER.method,
    resampler: srcHz===PROTOCOL.fs ? {identity:true} : resamplerDesign(srcHz),
    spectralSourceRate: spSource,
    resampleFidelity: (sp&&spSource) ? {tauRelDiff:+(Math.abs(sp.correlationTimeS-spSource.correlationTimeS)/spSource.correlationTimeS).toFixed(5),
      centroidRelDiff:+(Math.abs(sp.centroidHz-spSource.centroidHz)/spSource.centroidHz).toFixed(5),
      shareAbsDiff:+Math.abs(sp.shareAbove05Hz-spSource.shareAbove05Hz).toFixed(5)} : null,
    bandLimitHz:[P('distBandLowHz'),P('distBandHighHz')],
    amplitudeScale:+scale.toExponential(4), targetRms:P('distRms'),
    achievedRms:+rms(out).toFixed(6),
    correlationTimeS: tau,
    spectral: sp, spectralDelivered: spDelivered,
    acceptedRangeS:[+lo.toFixed(4),+hi.toFixed(4)], toleranceFrac:tol,
    inS12Range: tau!=null && tau>=lo && tau<=hi,
    centroidInS12Range: sp ? (sp.centroidHz>=PROTOCOL.s12CentroidRangeHz[0]*(1-tol) &&
                              sp.centroidHz<=PROTOCOL.s12CentroidRangeHz[1]*(1+tol)) : null,
    /* Kept, labelled, and explicitly not the gate. Through v5 this WAS the
       gate and it rejected three of the five classes S1.2 measured. */
    lag1:+ac.toFixed(4),
    lag1CorrelationTimeS: lagTau!=null ? +lagTau.toFixed(4) : null,
    lag1Note:'Diagnostic only. At 60 Hz this is set by the '+P('distBandHighHz')+
      ' Hz low-pass corner rather than by the road, and it is not the quantity S1.2 reports.',
    durationS:+(out.length/PROTOCOL.fs).toFixed(1), installedAt:nowISO(), surrogate:!!meta.surrogate
  }), samples60:out};
  storeDist();
  S.dist=DIST.meta; save();
  log('Disturbance trace installed — '+(DIST.meta.name||'unnamed')+', tau='+(tau!=null?tau:'?')+
      ' s (spectral), centroid '+(sp?sp.centroidHz:'?')+' Hz, '+DIST.meta.durationS+' s');
  /* Two numbers for the same quantity, side by side, with nothing to
     explain them was the complaint the r2 trace file raised against its
     predecessor. If the file states its own correlation time and the runner
     measures a different one, that is either a different estimator or a
     different pipeline and it is logged at install rather than left for a
     reader of the export to notice. */
  if(meta.providedCorrelationTimeS!=null && tau!=null){
    const d=Math.abs(meta.providedCorrelationTimeS-tau)/Math.max(1e-9,meta.providedCorrelationTimeS);
    if(d>0.10)
      deviation('disturbance','Trace file states tau='+meta.providedCorrelationTimeS+
        ' s; the runner measures '+tau.toFixed(4)+' s from the '+PROTOCOL.tauBandHz.join('–')+
        ' Hz spectrum — a '+(d*100).toFixed(0)+'% difference. Same quantity, two estimators: reconcile before collecting');
    else
      log('Trace file states tau='+meta.providedCorrelationTimeS+' s; runner measures '+tau.toFixed(4)+
          ' s — agreement within '+(d*100).toFixed(1)+'%');
  }
  const fid=DIST.meta.resampleFidelity;
  if(fid && (fid.tauRelDiff>0.02 || fid.shareAbsDiff>0.02))
    deviation('disturbance','The 60 Hz series departs from the source-rate spectrum (tau '+(fid.tauRelDiff*100).toFixed(1)+
      '%, share above 0.5 Hz '+(fid.shareAbsDiff*100).toFixed(1)+' points). Resampling has altered the playback band');
  else if(fid) log('Resampling preserved the playback band — tau within '+(fid.tauRelDiff*100).toFixed(2)+'% of the source-rate value');
  if(tau==null)
    deviation('disturbance','Trace too short to measure a spectrum at '+PROTOCOL.tauBandHz[0]+' Hz — correlation time unknown');
  else if(!DIST.meta.inS12Range)
    deviation('disturbance','Correlation time '+tau.toFixed(3)+' s is outside the S1.2 range '+
      PROTOCOL.correlationTimeRangeS.join('–')+' s widened by '+(tol*100).toFixed(0)+'% to '+
      lo.toFixed(3)+'–'+hi.toFixed(3)+' s');
  else if(DIST.meta.centroidInS12Range===false)
    /* Reported, not raised as a deviation, because S1.2's two published
       ranges are not mutually consistent. tau = 1/(2*pi*centroid) maps its
       centroid span 0.63-1.30 Hz onto 0.122-0.253 s, not onto the 0.121-0.443 s
       it publishes for tau. The two agree at the rough end (1.30 Hz -> 0.122 s
       against a published 0.121) and diverge at the smooth end. So S1.2's tau
       is not 1/(2*pi*centroid) for smooth classes, the centroid cannot be a
       second gate on the same quantity, and a smooth-end trace would be
       flagged by an inconsistency in the reference rather than by anything
       wrong with the trace. Gate on tau; carry the centroid as a descriptor
       and say that the smooth end is approximate. */
    log('Spectral centroid '+sp.centroidHz.toFixed(2)+' Hz sits outside S1.2\u2019s published '+
        PROTOCOL.s12CentroidRangeHz.join('–')+' Hz. Reported, not a deviation: S1.2\u2019s centroid and tau '+
        'ranges are not mutually consistent under tau = 1/(2*pi*f), agreeing at the rough end and diverging '+
        'at the smooth one, so this trace sits at the smooth edge of its class rather than outside it.');
}
/* Standing Rule 27 answers a documentary question from the document. The
   trace file IS that document — which revision, cut from which journey, at
   what speed, with what event content, on an axis verified how — and the
   session export is the only place that record survives. Everything the file
   carries about itself is carried through; nothing here is recomputed or
   interpreted. Shared by the file loader and the bundled trace (10.1a). */
function traceFromRecord(rec, name){
  const samples=rec.samples||rec.data||rec.lateral||rec.values;
  const hz=rec.hz||rec.sampleRate||rec.fs||100;
  const meta={name,
    schema:rec.schema||null, revision:rec.revision||null, supersedes:rec.supersedes||null,
    class:rec.class||rec.surfaceClass||null, surfaceClass:rec.surfaceClass||null,
    journey:rec.journey||rec.source||null, note:rec.note||null,
    providedCorrelationTimeS:rec.correlationTimeS||null, requiresRunner:rec.requiresRunner||null,
    s12Reference:rec.s12Reference||null,
    /* S1.10: event-driven variance is not continuous roughness. The inventory
       travels with the trace so the analysis separates them rather than
       rediscovering the need to. */
    events:rec.events||null,
    knownHighEnergyPositions:rec.knownHighEnergyPositions||null,
    provenance:rec.provenance||null,
    /* The file's own record of what this trace did at a given distRms. */
    amplitude:rec.amplitude||null,
    fileMeasured:rec.measured||null,
    sourceFileSamples:Array.isArray(rec.samples)?rec.samples.length:null};
  return {samples, hz, meta};
}
/* 10.1a. The trace this build ships with, and the check that it is the file
   that was deposited: FNV-1a (hashStr) over the embedded JSON text. */
const BUNDLED_TRACE={file:'dist_NH_G1-01_543s_r4.json', fnv1a:'40e45a0d'};
function bundledTraceRecord(){
  const el=document.getElementById('bundled-trace');
  if(!el) return {error:'This file carries no bundled trace'};
  const text=String(el.textContent||'').trim(), h=hashStr(text).toString(16);
  if(h!==BUNDLED_TRACE.fnv1a) return {error:'The bundled trace failed its integrity check (FNV-1a '+h+', expected '+BUNDLED_TRACE.fnv1a+') — this copy of the file has been altered'};
  try{ return {rec:JSON.parse(text), hash:h}; }catch(e){ return {error:'The bundled trace does not parse'}; }
}
function installBundledTrace(reason){
  const b=bundledTraceRecord();
  if(b.error){ deviation('disturbance', b.error); return false; }
  const t=traceFromRecord(b.rec, BUNDLED_TRACE.file);
  t.meta.bundled=true; t.meta.bundledIntegrity='FNV-1a '+b.hash+' over the embedded JSON text';
  installDisturbance(Float32Array.from(t.samples), t.hz, t.meta);
  if(S.startedAt && !S.finalized)
    deviation('disturbance','The disturbance trace was replaced during this session ('+reason+'). Blocks before and after this point did not play the same signal');
  else log('Bundled trace installed — '+BUNDLED_TRACE.file+' ('+reason+')');
  return true;
}
/* 10.1b. installDisturbance bakes distRms and the band edges into the
   stored series. These keep it in step with the parameters: an amplitude
   change is applied exactly, because the scaling is linear and the achieved
   RMS equals the target by construction; a band change re-derives the
   bundled trace from its source, and a file-loaded trace, whose source is
   not retained, has to be reinstalled. */
function traceParamState(){
  if(!DIST||!DIST.meta) return {installed:false, bandOK:false, rmsOK:false, matches:false};
  const bl=DIST.meta.bandLimitHz||[];
  const bandOK = bl[0]===P('distBandLowHz') && bl[1]===P('distBandHighHz'), rmsOK = DIST.meta.targetRms===P('distRms');
  return {installed:true, bandOK, rmsOK, matches: bandOK && rmsOK};
}
function ensureTraceMatchesParams(){
  const st=traceParamState();
  if(!st.installed || st.matches) return st;
  if(DIST.meta.bundled){ installBundledTrace('the disturbance parameters changed since it was installed'); return traceParamState(); }
  if(st.bandOK && !st.rmsOK && DIST.meta.targetRms>0){
    const from=DIST.meta.targetRms, k=P('distRms')/from;
    for(let i=0;i<DIST.samples60.length;i++) DIST.samples60[i]*=k;
    DIST.meta.amplitudeScale=+(DIST.meta.amplitudeScale*k).toExponential(4);
    DIST.meta.targetRms=P('distRms'); DIST.meta.achievedRms=+rms(DIST.samples60).toFixed(6);
    DIST.meta.rescaled=(DIST.meta.rescaled||[]).concat([{at:nowISO(), fromRms:from, toRms:P('distRms')}]);
    storeDist(); S.dist=DIST.meta; save();
    log('Disturbance trace rescaled to distRms '+P('distRms')+' (was '+from+') — the stored series follows the parameter');
    return traceParamState();
  }
  return st;
}
/* 10c. Where each disturbance segment reads from the trace. The data
   stretch is drawn once per session from the session seed (the same draw
   v6-v9 made), so every data block plays it. Practice draws uniformly over
   the start positions whose whole segment lies outside it. */
function dataStretch(L){
  const NB=Math.round(PROTOCOL.blockS*PROTOCOL.fs);
  const r=mulberry32((S.seed ^ hashStr('roadplayback'))>>>0);
  const start = L>NB ? Math.floor(r()*(L-NB)) : Math.floor(r()*L);
  return {start, end:Math.min(L, start+NB), fits:L>NB};
}
function playbackPlan(step, segs, L){
  const data=dataStretch(L), dsegs=segs.filter(sg=>CONDITIONS[sg.cond].dist);
  if(step.k!=='practice')
    return {data, reads:dsegs.map(sg=>({n0:sg.n0, n1:sg.n1, traceStart:data.start+sg.n0})), overlapsData:false, wrapped:!data.fits};
  const r=mulberry32((S.seed ^ hashStr('roadplayback-practice'))>>>0);
  let overlaps=false;
  const reads=dsegs.map(sg=>{
    const len=sg.n1-sg.n0;
    const before=Math.max(0, data.start-len+1), after=Math.max(0, L-len-data.end+1);
    let start;
    if(before+after>0){ const u=Math.floor(r()*(before+after)); start = u<before ? u : data.end+(u-before); }
    else { overlaps=true; start=Math.floor(r()*Math.max(1, L-len+1)); }
    return {n0:sg.n0, n1:sg.n1, traceStart:start};
  });
  return {data, reads, overlapsData:overlaps, wrapped:false};
}
/* Pilot-only stand-in so the instrument can be exercised before the Study 1
   trace is loaded. Never permitted in a study session. */
function installSurrogate(){
  /* 1/f rather than white. A white surrogate is the wrong CLASS: it would
     band-limit to a correlation time an order of magnitude below the S1.2
     measured range, so it could not exercise the correlation-time check the
     real trace has to pass. Voss-McCartney, seeded, so it is reproducible. */
  const rnd=mulberry32(20260924);
  const n=PROTOCOL.fs*600, raw=new Float32Array(n), rows=new Array(16).fill(0);
  let run=0;
  for(let i=0;i<n;i++){
    let k=0, c=i;
    while(k<16 && (c&1)===0){ c>>=1; k++; }
    if(k<16){ run-=rows[k]; rows[k]=gaussFrom(rnd); run+=rows[k]; }
    raw[i]=(run+gaussFrom(rnd))/Math.sqrt(17);
  }
  installDisturbance(raw, PROTOCOL.fs, {name:'SURROGATE (not Study 1 data)', surrogate:true,
    class:'seeded 1/f, correct class only', journey:'n/a'});
  deviation('disturbance','Seeded surrogate disturbance installed in place of the Study 1 trace. Pilot use only.');
}

/* ══ BLOCK PAYLOAD STORAGE ════════════════════════════════════════
   Sample-level series are large. They are written once per block as
   base64 Int16 (scale 1000, little-endian) under their own key, so the
   session record stays small and a crash cannot cost a completed block.
   ═════════════════════════════════════════════════════════════════ */
function encodeI16(f32, scale){
  const a=new Int16Array(f32.length);
  for(let i=0;i<f32.length;i++){ let v=Math.round(f32[i]*scale); a[i]=v>32767?32767:(v<-32768?-32768:v); }
  const bytes=new Uint8Array(a.buffer);
  let s=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}
function putBlock(i, payload){
  try{ localStorage.setItem(BPREFIX+i, JSON.stringify(payload)); return true; }
  catch(e){ deviation('storage','Block '+i+' series could not be written to local storage — save the session file now'); return false; }
}
function getBlock(i){ try{ const r=localStorage.getItem(BPREFIX+i); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearBlocks(){ try{ for(let i=0;i<200;i++) localStorage.removeItem(BPREFIX+i); }catch(e){} }

/* ══ MEASURES ═════════════════════════════════════════════════════ */
function sdOf(arr, mask){
  let n=0,m=0;
  for(let i=0;i<arr.length;i++){ if(mask&&!mask[i]) continue; m+=arr[i]; n++; }
  if(n<2) return {sd:null,n:0};
  m/=n; let ss=0;
  for(let i=0;i<arr.length;i++){ if(mask&&!mask[i]) continue; const d=arr[i]-m; ss+=d*d; }
  return {sd:Math.sqrt(ss/(n-1)), n, mean:m};
}
/* §8.2a-ii SDLP-premise: every sample that is neither inside a fit window
   nor within 2 s of one ending. Realised duration and segment count are
   reported with the value, always. */
function sdlpPremise(err, onsets){
  const fs=PROTOCOL.fs;
  const mask=new Uint8Array(err.length).fill(1);
  onsets.forEach(o=>{ const a=Math.max(0,o.nIdx), b=Math.min(err.length, o.nIdx+Math.round(exclSpanS(o)*fs)); for(let i=a;i<b;i++) mask[i]=0; });
  let segs=0, prev=0;
  for(let i=0;i<mask.length;i++){ if(mask[i]&&!prev) segs++; prev=mask[i]; }
  const r=sdOf(err, mask);
  return {sdlp: r.sd!=null?+r.sd.toFixed(4):null, samples:r.n, durationS:+(r.n/fs).toFixed(1), segments:segs,
          meetsG1DurationFloor: (r.n/fs) >= PROTOCOL.premiseFloorS};
}
/* S2.1b — "Report, per condition: the variance of fit-window samples, its
   share of total block variance". The complement of the premise mask, so the
   two partition the block and the share is exact. Fixed before the data. */
function fitWindowStats(err, onsets){
  const fs=PROTOCOL.fs;
  const inWin=new Uint8Array(err.length);
  onsets.forEach(o=>{ const a=Math.max(0,o.nIdx), b=Math.min(err.length, o.nIdx+Math.round(exclSpanS(o)*fs)); for(let i=a;i<b;i++) inWin[i]=1; });
  const w=sdOf(err, inWin), all=sdOf(err, null);
  const vw = w.sd!=null ? w.sd*w.sd : null;
  const va = all.sd!=null ? all.sd*all.sd : null;
  return {variance: vw!=null?+vw.toExponential(5):null,
          samples:w.n, durationS:+(w.n/fs).toFixed(1),
          blockVariance: va!=null?+va.toExponential(5):null,
          shareOfBlockVariance: (vw!=null&&va>0)? +((vw*w.n)/(va*all.n)).toFixed(4) : null,
          note:'S2.1b. Share is the fit-window contribution to total block sum-of-squares. Expected higher in the fatigued cell; report it, do not assume it.'};
}
/* §8.2a-ii SDLP-deployment: SD over rolling 60 s windows on the full
   series, perturbations included. Window and stride stated. */
function sdlpDeployment(err){
  const fs=PROTOCOL.fs, w=Math.round(PROTOCOL.deployWindowS*fs), st=Math.round(PROTOCOL.deployStrideS*fs);
  if(err.length<w){
    const r=sdOf(err,null);
    return {mean:r.sd!=null?+r.sd.toFixed(4):null, windows:1, windowS:+(err.length/fs).toFixed(1),
            strideS:PROTOCOL.deployStrideS, shortWindow:true, series:[r.sd!=null?+r.sd.toFixed(4):null]};
  }
  const c1=new Float64Array(err.length+1), c2=new Float64Array(err.length+1);
  for(let i=0;i<err.length;i++){ c1[i+1]=c1[i]+err[i]; c2[i+1]=c2[i]+err[i]*err[i]; }
  const out=[];
  for(let a=0;a+w<=err.length;a+=st){
    const s1=c1[a+w]-c1[a], s2=c2[a+w]-c2[a];
    const v=(s2-s1*s1/w)/(w-1);
    out.push(+Math.sqrt(Math.max(0,v)).toFixed(4));
  }
  const mean=out.reduce((a,b)=>a+b,0)/out.length;
  return {mean:+mean.toFixed(4), windows:out.length, windowS:PROTOCOL.deployWindowS, strideS:PROTOCOL.deployStrideS,
          shortWindow:false, series:out};
}
/* §8.5 / S2.12: corrective events taken from the input stream, upstream of
   the plant. CV of inter-correction interval is the primary statistic and
   is never reported without the rate. */
function intercorrection(inputs, durS){
  const t=inputs.map(e=>e.tS).sort((a,b)=>a-b);
  if(t.length<3) return {n:t.length, ratePerS:+(t.length/durS).toFixed(3), meanIntervalS:null, cv:null, longGaps:null, intervals:[]};
  const iv=[]; for(let i=1;i<t.length;i++) iv.push(t[i]-t[i-1]);
  const m=iv.reduce((a,b)=>a+b,0)/iv.length;
  const sd=Math.sqrt(iv.reduce((a,b)=>a+(b-m)*(b-m),0)/(iv.length-1));
  const sorted=iv.slice().sort((a,b)=>a-b), med=sorted[Math.floor(sorted.length/2)];
  return {n:t.length, ratePerS:+(t.length/durS).toFixed(3), meanIntervalS:+m.toFixed(4),
          sdIntervalS:+sd.toFixed(4), cv:+(sd/m).toFixed(4), medianIntervalS:+med.toFixed(4),
          longGaps:iv.filter(x=>x>3*med).length, intervals:iv.map(x=>+x.toFixed(3))};
}
/* Running band-limited variance, computed online, band edges from PARAMS. */
function makeBandMeter(){
  const dt=PROTOCOL.dt;
  const rcH=1/(2*Math.PI*P('proxyBandLowHz')), aH=rcH/(rcH+dt);
  const rcL=1/(2*Math.PI*P('proxyBandHighHz')), aL=dt/(rcL+dt);
  return {aH,aL,yPrev:0,xPrev:0,z:0,n:0,s1:0,s2:0,
    push(x){ const y=this.aH*(this.yPrev+x-this.xPrev); this.yPrev=y; this.xPrev=x;
             this.z=this.z+this.aL*(y-this.z); this.n++; this.s1+=this.z; this.s2+=this.z*this.z; },
    variance(){ return this.n>1 ? (this.s2-this.s1*this.s1/this.n)/(this.n-1) : null; }};
}
/* §8.6 — 1-minute windows for SDLP and inter-correction CV. Both SDLP
   definitions are carried per window: premise is the quantity §8.3 predicts
   on, deployment is what a detector would compute. v3 reported a single raw
   SD, which was neither. */
function windowSeries(err, inputs, onsets, durS, winS, strideS){
  const fs=PROTOCOL.fs, w=Math.round(winS*fs), st=Math.round(strideS*fs), out=[];
  for(let a=0;a+w<=err.length;a+=st){
    const seg=err.subarray(a,a+w);
    const t0=a/fs, t1=(a+w)/fs;
    const ons=onsets.filter(o=>o.tS<t1 && o.tS+exclSpanS(o)>t0).map(o=>({nIdx:o.nIdx-a, gtype:o.gtype}));
    const pr=sdlpPremise(seg, ons);
    const dep=sdOf(seg,null);
    const ins=inputs.filter(e=>e.tS>=t0 && e.tS<t1);
    const ic=intercorrection(ins, winS);
    out.push({tStartS:+t0.toFixed(1), minuteIndex:+(t0/60).toFixed(3),
      sdlpPremise:pr.sdlp, premiseDurationS:pr.durationS,
      sdlpDeployment:dep.sd!=null?+dep.sd.toFixed(4):null,
      correctionRate:ic.ratePerS, cv:ic.cv,
      pairsInWindow:onsets.filter(o=>o.history==='recent'&&o.tS>=t0&&o.tS<t1).length});
  }
  return out;
}
/* §8.6 — "Each series is expressed as a standard score against that
   participant's windows in minutes two and three." Computed here so the
   baseline is fixed by the protocol rather than chosen by an analyst. */
function standardScore(series, key){
  const [b0,b1]=PROTOCOL.gapBaselineRangeS, winS=PROTOCOL.inductionWindowS;
  /* Baseline windows are those lying WHOLLY inside minutes two and three.
     A window that starts at 150 s runs to 210 s and is partly minute four;
     including it would quietly widen the baseline §8.6 named. */
  const inBase=w=>w.tStartS>=b0 && w.tStartS+winS<=b1;
  const baseW=series.filter(inBase);
  const base=baseW.map(w=>w[key]).filter(v=>v!=null);
  const frame={baselineRangeS:PROTOCOL.gapBaselineRangeS, baselineLabel:'minutes two and three (§8.6)',
    baselineWindowsUsed:base.length, baselineWindowStartsS:baseW.map(w=>w.tStartS),
    /* Said plainly rather than left for a reader to work out: these windows
       overlap at a 30 s stride, so they are not independent observations and
       the SD below is optimistic. A 2-SD crossing on a baseline of three
       dependent windows is a weak criterion and is reported as one. */
    independence:'Baseline windows overlap at a '+PROTOCOL.inductionStrideS+' s stride and are not independent. The SD is optimistic and the 2-SD departure is a screening criterion, not a test.'};
  if(base.length<2) return Object.assign({}, frame, {mean:null, sd:null, z:null,
    note:'Insufficient baseline windows to standard-score.'});
  const m=base.reduce((a,b)=>a+b,0)/base.length;
  const sd=Math.sqrt(base.reduce((a,b)=>a+(b-m)*(b-m),0)/(base.length-1));
  const crossings=(sd>0)?series.filter(w=>w[key]!=null && w.tStartS>=b1 && Math.abs((w[key]-m)/sd)>=2):[];
  return Object.assign({}, frame, {
    mean:+m.toFixed(5), sd:+sd.toFixed(5),
    z: series.map(w=>({tStartS:w.tStartS, z: (w[key]!=null && sd>0) ? +((w[key]-m)/sd).toFixed(3) : null})),
    firstDeparture2SD: crossings.length?crossings[0].tStartS:null,
    /* One crossing on overlapping windows is cheap. The first run of two
       consecutive crossing windows is reported alongside it so the analyst
       can see which one the shape claim is resting on. */
    firstDeparture2SDSustained: (()=>{ for(let i=0;i+1<crossings.length;i++){
        if(Math.abs(crossings[i+1].tStartS-crossings[i].tStartS-PROTOCOL.inductionStrideS)<1e-6) return crossings[i].tStartS; }
      return null; })(),
    crossingsN:crossings.length});
}
/* §8.6 — the history gap is fitted in analysis, not here. What the runner
   owes it is the realised observation count per 3-minute window, because
   the window length was chosen on an assumed "≈9 pairs per window" and
   Standing Rule 19 turns on that count being equal across comparisons. */
function gapWindowCensus(onsets, durS){
  const out=[];
  for(let t0=0; t0+PROTOCOL.gapWindowS<=durS; t0+=PROTOCOL.gapStrideS){
    const t1=t0+PROTOCOL.gapWindowS;
    out.push({tStartS:t0,
      pairs:onsets.filter(o=>o.history==='recent'&&o.tS>=t0&&o.tS<t1).length,
      quietHistory:onsets.filter(o=>o.history==='quiet'&&o.tS>=t0&&o.tS<t1).length});
  }
  const p=out.map(w=>w.pairs);
  return {windowS:PROTOCOL.gapWindowS, strideS:PROTOCOL.gapStrideS, windows:out.length,
    pairsPerWindow:{min:p.length?Math.min.apply(null,p):null, max:p.length?Math.max.apply(null,p):null,
      mean:p.length?+(p.reduce((a,b)=>a+b,0)/p.length).toFixed(2):null},
    assumedInProtocol:PROTOCOL.gapPairsAssumed,
    note:'§8.6 sizes this window on "≈9 pairs per window". Re-derive power at the realised count before collection (Standing Rule 19).',
    series:out};
}

/* ══ PRE-ONSET VELOCITY (S2.14) ═══════════════════════════════════
   "Exclude any perturbation whose pre-onset error velocity exceeds the
   90th percentile of that participant's baseline-block velocity
   distribution. Required, not optional."

   The runner does not apply the exclusion — the threshold is a property
   of the participant's BASELINE block and is not known while a later
   block is running, and applying it live would drop data inside the
   session on a number computed from the session. What the runner owes
   the analysis is the two channels it cannot reconstruct afterwards
   without re-deriving them from a decoded series: the pre-onset velocity
   at every onset, and the perturbation-free velocity distribution the
   percentile is read off. Both are emitted per block, under one fixed
   window, so the analyst cannot choose the window after seeing the
   effect. ══════════════════════════════════════════════════════════ */
function velWindowSamples(){ return Math.max(1, Math.round(P('preOnsetVelWindowS')*PROTOCOL.fs)); }
function preOnsetVelocities(err, onsets){
  const w=velWindowSamples(), dtW=w/PROTOCOL.fs;
  return onsets.map(o=>{
    /* err[nIdx] is written AFTER the impulse is added to e, so it is the
       first POST-onset sample. The last sample that knows nothing about the
       perturbation is nIdx-1, and the window must end there. Ending it on
       nIdx measures the displacement itself: pertAmp/window, every time,
       in every condition, which is what v5 and v6 did. */
    const j=o.nIdx-1;
    const ok = j-w>=0 && j<err.length;
    return {tS:o.tS, history:o.history, group:o.group, gtype:o.gtype, dir:o.dir,
      velocity: ok ? +((err[j]-err[j-w])/dtW).toFixed(4) : null,
      absVelocity: ok ? +(Math.abs(err[j]-err[j-w])/dtW).toFixed(4) : null,
      windowEndsAtSample: ok ? j : null, truncated: !ok};
  });
}
function premiseVelocityDistribution(err, onsets){
  const fs=PROTOCOL.fs, w=velWindowSamples(), dtW=w/fs;
  const mask=new Uint8Array(err.length).fill(1);
  onsets.forEach(o=>{ const a=Math.max(0,o.nIdx), b=Math.min(err.length,o.nIdx+Math.round(exclSpanS(o)*fs)); for(let i=a;i<b;i++) mask[i]=0; });
  const v=[];
  for(let i=w;i<err.length;i++){ if(mask[i]&&mask[i-w]) v.push(Math.abs((err[i]-err[i-w])/dtW)); }
  if(v.length<10) return null;
  v.sort((a,b)=>a-b);
  const q=pc=>+v[Math.min(v.length-1, Math.floor(pc/100*v.length))].toFixed(4);
  return {n:v.length, windowS:+dtW.toFixed(4),
    p50:q(50), p75:q(75), p90:q(90), p95:q(95), max:+v[v.length-1].toFixed(4),
    atConfiguredPctile:q(P('preOnsetVelPctile')), pctile:P('preOnsetVelPctile'),
    note:'|Δerror| over a '+dtW.toFixed(3)+' s window, on perturbation-free samples only. S2.14 takes the participant\'s BASELINE-block value at this percentile as the exclusion threshold and applies it to every condition. Report the exclusion rate by condition AND by history: differential exclusion is itself a bias.'};
}


/* ══ RECOVERY, PRECISION (G5), ANTICIPATION AND CENSORING (S2.14) ══
   Everything below is fitted from series the runner already holds. None
   of it replaces the analysis: the analysis applies the pre-onset
   velocity exclusion, pools across participants and fits per condition.
   What is computed here is the part that has to be known WHILE the
   participant is still reachable —

     G5   the achieved relative standard error of tau-hat. Protocol Part 2
          names it the gate most often skipped, and Part 4's entry reads
          "decay constant separates conditions in pilot but not in the
          main sample → check achieved relative standard error against G5.
          Precision, not effect size, is the usual culprit." A pilot that
          does not measure precision cannot fix the perturbation count,
          which is the one thing G5 exists to fix.

     the anticipation check, which S2.14 requires to be read BEFORE the
          interaction it qualifies, and

     the censoring, which the two catch singletons measure within
          participant because they are the only quiet-history onsets with
          a clean 6 s window.

   Fits use the same bounded, censored fitTau as P0, so a number here and
   a number there are the same estimator. Amplitude is profiled out and
   the trace is sign-normalised by the delivered direction, so pushes in
   both directions average constructively rather than cancelling.
   ═════════════════════════════════════════════════════════════════ */
function onsetSample(o){ return (o.realisedSample!=null) ? o.realisedSample : o.nIdx; }
function recoveryTrace(err, o, winS){
  const n=Math.round(winS*PROTOCOL.fs), a=onsetSample(o);
  if(a<1 || a+n>err.length) return null;
  const base=err[a-1];                    // S2.14: corrected to the position immediately before onset
  const sgn=(o.dir<0)?-1:1;
