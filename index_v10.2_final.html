  const out=new Float64Array(n);
  for(let i=0;i<n;i++) out[i]=sgn*(err[a+i]-base);
  return out;
}
function meanTrace(list){
  if(!list.length) return null;
  const n=list[0].length, m=new Float64Array(n);
  list.forEach(t=>{ for(let i=0;i<n;i++) m[i]+=t[i]; });
  for(let i=0;i<n;i++) m[i]/=list.length;
  return m;
}
/* tau on the mean trace, with a leave-one-out standard error. Jackknife
   rather than bootstrap because the sets are small (8 and 10 per cell) and
   a jackknife on a smooth estimator is stable there and deterministic —
   a resampled SE that changes between two runs of the same file is not a
   number a gate can be scored on. */
function tauWithRSE(traces, winS){
  const n=traces.length;
  if(!n) return {n:0, tau:null, rse:null, censored:null, note:'No usable onsets'};
  const full=fitTau(meanTrace(traces), PROTOCOL.dt, winS);
  /* A constant is still the quantity the protocol asks for when there are
     only two onsets — the two catch singletons are exactly that case, and
     S2.14 asks them for the censoring, not for a precision estimate. What
     cannot be formed below three is the jackknife, so tau is returned and
     the relative standard error is left null rather than the whole cell
     being dropped. v9's first draft dropped it and lost the censoring
     measurement entirely. */
  if(n<3) return {n, tau:+full.tau.toFixed(4), lambda:+full.lambda.toFixed(4),
    se:null, rse:null, censored:full.censored,
    note:'Fewer than three onsets — tau is fitted on their mean, no jackknife'};
  const loo=[];
  for(let k=0;k<n;k++){
    const sub=traces.slice(0,k).concat(traces.slice(k+1));
    loo.push(fitTau(meanTrace(sub), PROTOCOL.dt, winS).tau);
  }
  const mu=loo.reduce((a,b)=>a+b,0)/n;
  let ss=0; for(const t of loo) ss+=(t-mu)*(t-mu);
  const se=Math.sqrt((n-1)/n*ss);
  return {n, tau:+full.tau.toFixed(4), lambda:+full.lambda.toFixed(4),
    se:+se.toFixed(4), rse: full.tau>0 ? +(se/full.tau).toFixed(4) : null,
    censored:full.censored};
}
function gapOf(q,r){ return (q&&r&&q.tau!=null&&r.tau!=null) ? +(r.tau-q.tau).toFixed(4) : null; }
function recoveryStats(err, onsets){
  const W=PROTOCOL.fitWindowS, W6=2*PROTOCOL.pairIntervalS;   // 6.0 s — what a singleton has
  const usable=[];
  onsets.forEach(o=>{ const t=recoveryTrace(err,o,W); if(t) usable.push({o,t}); });
  const by=f=>usable.filter(x=>f(x.o)).map(x=>x.t);
  const quietPaired = by(o=>o.history==='quiet' && o.gtype==='pair');
  const quietSingle = by(o=>o.history==='quiet' && o.gtype==='single');
  const recent      = by(o=>o.history==='recent');
  const quietAll    = by(o=>o.history==='quiet');

  const tQ=tauWithRSE(quietAll,W), tR=tauWithRSE(recent,W);
  const worst=[tQ.rse,tR.rse].filter(v=>v!=null);
  /* Part 4: "decay-constant fits returning implausible values — unbounded
     exponential fitting diverges on slow decays. Constrain and censor; report
     the censoring rate." fitTau is constrained and censored at the window, so
     a constant returned AT the window is not an estimate of anything, and a
     cell built from censored fits cannot carry a gap. Reported, never
     silently averaged in. */
  const censoredCells=[tQ,tR].filter(x=>x.censored===true).length;
  const g5={criterion:0.45, quietRse:tQ.rse, recentRse:tR.rse,
    worstRse: worst.length?Math.max.apply(null,worst):null,
    censoredFits:censoredCells, fitCeilingS:W,
    passes: worst.length ? (Math.max.apply(null,worst)<=0.45 && censoredCells===0) : null,
    note:'Gate G5, within-participant relative standard error of tau-hat, jackknifed across the onsets of this block. Protocol Part 2: below this threshold Study 3 is underpowered regardless of sample size, and the remedy is more perturbations per block, not more participants. A fit censored at the '+W+' s ceiling fails the cell outright — a constant returned at the window bound is not an estimate of a decay.'};

  /* S2.14 anticipation check. "A gap that grows within a block is learning.
     A gap that grows across the session is fatigue." Four pairs each end,
     the count S2.14 names. Equal counts on both halves and on both
     histories, so Standing Rule 19 holds inside the check itself. */
  const pairGroups=[...new Set(usable.filter(x=>x.o.gtype==='pair').map(x=>x.o.group))].sort((a,b)=>a-b);
  const half=(groups)=>{
    const q=[],r=[];
    usable.forEach(x=>{ if(x.o.gtype!=='pair'||!groups.includes(x.o.group)) return;
      (x.o.history==='quiet'?q:r).push(x.t); });
    return {q:tauWithRSE(q,W), r:tauWithRSE(r,W)};
  };
  let anticipation=null;
  if(pairGroups.length>=8){
    const a=half(pairGroups.slice(0,4)), b=half(pairGroups.slice(-4));
    anticipation={pairsPerHalf:4,
      firstFour:{quietTau:a.q.tau, recentTau:a.r.tau, gap:gapOf(a.q,a.r)},
      lastFour:{quietTau:b.q.tau, recentTau:b.r.tau, gap:gapOf(b.q,b.r)},
      withinBlockGrowth: (gapOf(a.q,a.r)!=null && gapOf(b.q,b.r)!=null)
        ? +(gapOf(b.q,b.r)-gapOf(a.q,a.r)).toFixed(4) : null,
      note:'S2.14. Read this before the interaction, not after it. Within-block growth comparable to across-session growth means the interaction cannot be attributed to state and is reported as such (Part 4).'};
  } else {
    anticipation={pairsPerHalf:4, insufficientPairs:pairGroups.length,
      note:'Fewer than eight usable pairs in this block, so the first-four/last-four check is not defined here. Probes are pre-specified at two pairs and are not expected to carry it.'};
  }

  /* S2.14's third consequence of the common window: the singletons are the
     only quiet-history onsets with six clean seconds, so the same
     participant's quiet-history constant at 3 s against 6 s IS the
     censoring. Both are reported; neither is corrected for. */
  const sTraces6=[];
  onsets.forEach(o=>{ if(o.history==='quiet' && o.gtype==='single'){
    const t=recoveryTrace(err,o,W6); if(t) sTraces6.push(t); } });
  const s3=tauWithRSE(quietSingle,W), s6=tauWithRSE(sTraces6,W6);
  const censoring={windowS:W, singletonWindowS:W6,
    pairedQuietTau3s: tauWithRSE(quietPaired,W).tau,
    singletonQuietTau3s: s3.tau, singletonQuietTau6s: s6.tau,
    shrinkage: (s3.tau!=null&&s6.tau!=null&&s6.tau>0) ? +(s3.tau/s6.tau).toFixed(4) : null,
    note:'S2.14. The two catch singletons are the only quiet-history observations with a clean 6 s window, so their 3 s against 6 s difference is this participant\u2019s censoring, measured rather than assumed. Compare against the P0 shrinkage factor. It bounds every gap in this participant\u2019s data (Part 4).'};

  return {fitWindowS:W, usableOnsets:usable.length, scheduledOnsets:onsets.length,
    quiet:tQ, recent:tR, historyGap:gapOf(tQ,tR), g5, anticipation, censoring,
    note:'Fitted on the raw block with no exclusion applied. S2.14\u2019s pre-onset velocity exclusion is applied in analysis against the BASELINE block distribution; these constants are the unexcluded ones and are labelled so they are never mistaken for the analysed values.'};
}
/* Where the display bound landed, relative to the windows that matter. A
   clamped sample inside a fit window censors the recovery being fitted,
   and censoring that differs by condition or by history is what Standing
   Rule 19 exists to catch. Counting clamps without locating them cannot
   tell the difference between a bound touched during a lead-in and one
   touched three samples after a perturbation. */
function clampAudit(err, onsets, clampIdx){
  const n=clampIdx.length;
  const fitN=Math.round(PROTOCOL.fitWindowS*PROTOCOL.fs);
  const out={clampedSamples:n, clampedFraction:+(n/Math.max(1,err.length)).toFixed(5),
    limit:P('clampAbs'), inFitWindow:0, onsetsAffected:0, byHistory:{quiet:0, recent:0}, onsets:[],
    singletonCalibrationWindow:{windowS:PROTOCOL.singletonWindowS, onsetsAffected:0, samples:0}};
  if(!n) return out;
  const marks=new Uint8Array(err.length);
  clampIdx.forEach(i=>{ if(i>=0&&i<err.length) marks[i]=1; });
  onsets.forEach(o=>{
    const a=onsetSample(o), b=Math.min(err.length,a+fitN);
    let hit=0; for(let i=Math.max(0,a);i<b;i++) if(marks[i]){ hit++; }
    o.clampedInFitWindow = hit>0;
    o.clampedSamplesInFitWindow = hit;
    if(hit){ out.onsetsAffected++; out.byHistory[o.history]=(out.byHistory[o.history]||0)+1;
      out.inFitWindow+=hit;
      out.onsets.push({tS:o.tS, history:o.history, gtype:o.gtype, samples:hit}); }
  });
  /* The singletons' 6.0 s calibration fits (S2.14) are censored by a clamp
     anywhere in their six seconds, not only the first three. */
  const n6=Math.round(PROTOCOL.singletonWindowS*PROTOCOL.fs);
  onsets.forEach(o=>{ if(o.gtype!=='single') return; const a=onsetSample(o); let hit=0;
    for(let i=Math.max(0,a);i<Math.min(err.length,a+n6);i++) if(marks[i]) hit++;
    o.clampedInCalibrationWindow = hit>0;
    if(hit){ out.singletonCalibrationWindow.onsetsAffected++; out.singletonCalibrationWindow.samples+=hit; } });
  out.note='Samples held at the display half-range. Those inside a 3.0 s fit window censor the recovery fitted from that onset; the onset carries clampedInFitWindow so it can be dropped or reported. A count that differs between histories breaks Standing Rule 19 for every gap computed from this block.';
  return out;
}
/* G5 across the session, and then across the pilot. Within-participant is
   the level the protocol states, so the session reports its own worst cell
   and the calibration record carries one number per participant. */
function g5Audit(){
  const rows=[];
  S.steps.forEach(st=>{ const v=st.value;
    if(!v||!v.recovery||!v.cond||v.cond==='practice') return;
    rows.push({cond:v.cond, quietRse:v.recovery.g5.quietRse, recentRse:v.recovery.g5.recentRse,
      worstRse:v.recovery.g5.worstRse, quietTau:v.recovery.quiet.tau, recentTau:v.recovery.recent.tau,
      historyGap:v.recovery.historyGap, quietN:v.recovery.quiet.n, recentN:v.recovery.recent.n,
      probe:(v.cond==='removal'||v.cond==='persist')}); });
  /* Probes carry two observations per history by pre-specification, so a
     precision estimate from them is not comparable to a block's and is
     excluded from the verdict rather than allowed to fail it. */
  const scored=rows.filter(r=>!r.probe && r.worstRse!=null);
  const worst=scored.length?Math.max.apply(null,scored.map(r=>r.worstRse)):null;
  return {gate:'G5', criterion:0.45, rows, scoredCells:scored.length,
    worstRse:worst, passes: worst==null?null:worst<=0.45,
    note:'Within-participant relative standard error of tau-hat, jackknifed per cell over the block\u2019s own onsets, probes excluded (Standing Rule 19). Protocol Part 2: the remedy for a failure is more perturbations per block, which changes \u00a78.2a\u2019s arithmetic and belongs in the protocol before it belongs here.'};
}
/* The pilot-level reading the study gate consults, from the same store G1
   uses, so the two gates cannot disagree about who was piloted. */
function g5Status(){
  const all=calibStore().filter(r=>typeof r.tauRseWorst==='number');
  const rows=all.filter(r=>rowEligibility(r).ok);
  const n=new Set(rows.map(r=>r.code)).size;
  const worst=rows.length?Math.max.apply(null,rows.map(r=>r.tauRseWorst)):null;
  const failing=rows.filter(r=>r.tauRseWorst>0.45).length;
  return {rows:rows.length, excluded:all.length-rows.length, n, worst, failing, criterion:0.45,
    passes: n>=6 && rows.length>0 && failing===0};
}

/* ══ ENGINE — fixed-step 60 Hz ════════════════════════════════════ */
const Eng={active:false};
function engStop(){
  if(Eng.raf) cancelAnimationFrame(Eng.raf);
  if(Eng.nbTimer) clearTimeout(Eng.nbTimer);
  Eng.raf=null; Eng.nbTimer=null; Eng.active=false;
}
function engStart(i, step, onDone){
  const cond = step.k==='practice' ? step.segments[0].cond : step.cond;
  const durS = step.dur;
  const N = Math.round(durS*PROTOCOL.fs);
  const seed = stepSeed(i, step);
  /* scheduleFor() is the single decision point (10b): one timing for every
     300 s block, per-perturbation direction, continuous induction, short
     practice lead-in, pre-specified probes. */
  const sched = scheduleFor(i, step);
  /* Segment plan: practice switches condition inside the step; every other
     tracking step is a single segment. Condition is never switched mid-block
     in a data block. */
  const segs = stepSegments(step, cond, N);

  const rnd=mulberry32((seed^0x9e3779b9)>>>0);
  /* Injected disturbance, precomputed for the whole block and retained. */
  const dArr=new Float32Array(N);
  let distUsed=false, distOffset=null;
  const needsDist = segs.some(s=>CONDITIONS[s.cond].dist);
  let distWrapped=false, distTraceS=null, plan=null;
  if(needsDist){
    const tp=ensureTraceMatchesParams();
    if(tp.installed && !tp.matches)
      deviation('disturbance','The installed trace was band-limited at '+JSON.stringify(DIST.meta.bandLimitHz)+' Hz against the current ['+
        P('distBandLowHz')+', '+P('distBandHighHz')+'] Hz and its source is not retained — reinstall the trace file');
    if(DIST && DIST.samples60.length>10){
      distUsed=true;
      if(!distResampledOK(DIST)) deviation('disturbance','The stored trace was resampled by an earlier build (linear interpolation, 10a) and carries folded vibration — reinstall the trace');
      const L=DIST.samples60.length; distTraceS=+(L/PROTOCOL.fs).toFixed(1);
      /* Every data block that carries disturbance plays the SAME stretch,
         because the early and late road blocks exist to be compared at
         equal disturbance (v6 L). Practice reads only from positions
         disjoint from that stretch (10c). Drawn so a block FITS: v5 read
         modulo the length and wrapped mid-block. */
      plan=playbackPlan(step, segs, L);
      distOffset = plan.reads.length ? plan.reads[0].traceStart : plan.data.start;
      distWrapped = plan.wrapped;
      plan.reads.forEach(rd=>{ for(let n=rd.n0;n<rd.n1;n++) dArr[n]=DIST.samples60[(rd.traceStart+(n-rd.n0))%L]; });
      if(plan.overlapsData)
        deviation('disturbance','The trace is too short to give practice a stretch disjoint from the '+PROTOCOL.blockS+
          ' s data stretch, so familiarisation previews part of the data road');
      if(distWrapped)
        deviation('disturbance','Trace is '+distTraceS+' s against a '+(N/PROTOCOL.fs).toFixed(0)+
          ' s block, so playback wrapped '+Math.floor(N/L)+' time(s) — each wrap is a step discontinuity in d(t)');
    } else {
      deviation('disturbance','No disturbance trace loaded — block ran with zero disturbance');
    }
  }

  Eng.active=true; Eng.i=i; Eng.step=step; Eng.N=N; Eng.n=0; Eng.e=0; Eng.uPending=0;
  Eng.err=new Float32Array(N); Eng.d=dArr; Eng.inputs=[]; Eng.sched=sched; Eng.pertI=0;
  Eng.segs=segs; Eng.rnd=rnd; Eng.clamped=0; Eng.clampIdx=[]; Eng.onDone=onDone;
  /* S2.18 needs the >0.5 Hz band variance of the tracked variable AND of the
     error signal, regressed on the known injected variance. Under a
     compensatory display with the target fixed at centre those two series are
     the same up to sign, which is exactly the degeneracy S2.18's artifact
     signature warns about ("the estimator recovering d(t) trivially because
     the plant passes it through unchanged — check against the error signal as
     well as the tracked variable"). All four channels are metered and emitted
     under their protocol names so the analysis verifies the identity instead
     of inheriting an assumption, and the control output supplies the
     operator-side channel the check actually needs. */
  Eng.meterE=makeBandMeter();   // error signal  (target − cursor)
  Eng.meterX=makeBandMeter();   // tracked variable (cursor position)
  Eng.meterU=makeBandMeter();   // control output (participant impulses)
  Eng.meterD=makeBandMeter();   // known injected disturbance — ground truth
  Eng.acc=0; Eng.last=null; Eng.jitter=[]; Eng.gaps=[]; Eng.startMs=performance.now(); Eng.startedAt=nowISO();
  Eng.distMeta = distUsed ? {used:true, offsetSample:distOffset, offsetS:+(distOffset/PROTOCOL.fs).toFixed(2),
                             name:DIST.meta.name, surrogate:!!DIST.meta.surrogate,
                             correlationTimeS:DIST.meta.correlationTimeS,
                             spectralCentroidHz:DIST.meta.spectral?DIST.meta.spectral.centroidHz:null,
                             traceDurationS:distTraceS, wrapped:distWrapped,
                             resample:DIST.meta.resample||null,
                             targetRms:DIST.meta.targetRms, bandLimitHz:DIST.meta.bandLimitHz, bundled:!!DIST.meta.bundled,
                             dataStretchS:[+(plan.data.start/PROTOCOL.fs).toFixed(2), +(plan.data.end/PROTOCOL.fs).toFixed(2)],
                             reads:plan.reads.map(rd=>({fromS:+(rd.n0/PROTOCOL.fs).toFixed(2), toS:+(rd.n1/PROTOCOL.fs).toFixed(2),
                               traceStartS:+(rd.traceStart/PROTOCOL.fs).toFixed(2)})),
                             overlapsDataStretch: step.k==='practice' ? !!plan.overlapsData : null,
                             stretch: step.k==='practice'?'practice draw, disjoint from the data stretch':'shared data-block draw',
                             note: step.k==='practice'
                               ? 'Practice reads only from trace positions outside the stretch every data block plays, so familiarisation does not preview it.'
                               : 'Every data block carrying disturbance plays this same stretch, so the early and late road blocks differ in state and not in road.'} : {used:false};
  Eng.phi=Math.exp(-P('plantLambda')*PROTOCOL.dt);
  Eng.nback = segs.some(s=>CONDITIONS[s.cond].load) ? startNback(segs.filter(s=>CONDITIONS[s.cond].load)) : null;
  Eng.pertCount=0;

  const loop=(ts)=>{
    if(!Eng.active) return;
    if(Eng.last==null) Eng.last=ts;
    let delta=ts-Eng.last; Eng.last=ts;
    if(delta>0 && delta<500) Eng.jitter.push(delta);
    /* A backgrounded tab is a real gap in the record, not samples to invent.
       Part 4: "check the input stream for an unlogged pause". */
    if(delta>=500){ Eng.gaps.push({atSample:Eng.n, ms:Math.round(delta)}); delta=1000/PROTOCOL.fs; }
    Eng.acc+=delta;
    const stepMs=1000/PROTOCOL.fs;
    let guard=0;
    while(Eng.acc>=stepMs && Eng.n<Eng.N && guard<20){ engTick(); Eng.acc-=stepMs; guard++; }
    if(Eng.acc>stepMs*20) Eng.acc=0;
    engDraw();
    if(Eng.n>=Eng.N){ engFinish(); return; }
    Eng.raf=requestAnimationFrame(loop);
  };
  Eng.raf=requestAnimationFrame(loop);
}
function currentSeg(){ for(let k=0;k<Eng.segs.length;k++){ if(Eng.n>=Eng.segs[k].n0 && Eng.n<Eng.segs[k].n1) return Eng.segs[k]; } return Eng.segs[Eng.segs.length-1]; }
function engTick(){
  const n=Eng.n;
  const u=Eng.uPending;
  const w=gaussFrom(Eng.rnd)*P('motorNoiseSD');
  let e=Eng.phi*Eng.e + Eng.d[n] + w + u;
  Eng.uPending=0;
  while(Eng.pertI<Eng.sched.onsets.length && n>=Eng.sched.onsets[Eng.pertI].nIdx){
    const o=Eng.sched.onsets[Eng.pertI];
    e += o.dir*P('pertAmp');
    o.realisedSample=n; o.realisedTS=+(n/PROTOCOL.fs).toFixed(4);
    Eng.pertI++; Eng.pertCount++;
    /* No haptic cue on onset. navigator.vibrate is unavailable on iOS
       Safari, so v3's buzz made the perturbation stimulus differ by device
       within a within-participant design. The displacement is the stimulus. */
  }
  const lim=P('clampAbs');
  /* The index is kept, not only the count: a clamp inside a fit window
     censors the recovery fitted from that onset, and a count cannot say
     where it landed. Capped so a pathological block cannot exhaust memory. */
  if(e>lim || e<-lim){ e = e>lim?lim:-lim; Eng.clamped++; if(Eng.clampIdx.length<200000) Eng.clampIdx.push(n); }
  Eng.e=e; Eng.err[n]=e;
  /* Target is fixed at centre, so tracked variable = cursor = e and the error
     signal = 0 − e. Metered separately; variance is identical by construction
     and the record says so rather than omitting the second channel. */
  Eng.meterE.push(-e); Eng.meterX.push(e); Eng.meterU.push(u); Eng.meterD.push(Eng.d[n]);
  Eng.n++;
  if(Eng.nback) nbackTick();
}
function engInput(dir, source){
  if(!Eng.active) return;
  Eng.uPending += dir*P('impulseAmp');
  Eng.inputs.push({n:Eng.n, tS:+(Eng.n/PROTOCOL.fs).toFixed(4), dir, src:source||'touch'});
  const b=document.getElementById(dir<0?'imp-left':'imp-right');
  if(b){ b.classList.add('fired'); setTimeout(()=>b.classList.remove('fired'),70); }
}
function engDraw(){
  drawDot(document.getElementById('track-canvas'), Eng.e);
  const td=document.getElementById('t-display');
  if(td) td.textContent=fmtClock((Eng.N-Eng.n)/PROTOCOL.fs);
  /* Counters are familiarisation feedback, shown in practice only. A live
     correction count during a data block invites the participant to
     minimise it, which changes strategy over the induction and interacts
     with exactly the trajectory §8.6 is measuring. */
  if(Eng.n%30===0 && Eng.step && Eng.step.k==='practice'){
    const zs=document.getElementById('zone-stat');
    if(zs) zs.textContent=Eng.inputs.length+' corrections';
    const bs=document.getElementById('bump-stat');
    if(bs) bs.textContent=Eng.pertCount+'/'+Eng.sched.onsets.length+' perturbations';
  }
}
function engFinish(){
  const step=Eng.step, i=Eng.i, durS=Eng.N/PROTOCOL.fs;
  const wallS=(performance.now()-Eng.startMs)/1000;
  engStop();
  const err=Eng.err, sch=Eng.sched;
  const jit=Eng.jitter.slice().sort((a,b)=>a-b);
  const jitStats=jit.length?{medianMs:+jit[Math.floor(jit.length/2)].toFixed(2),
    p95Ms:+jit[Math.floor(jit.length*0.95)].toFixed(2), maxMs:+jit[jit.length-1].toFixed(2), n:jit.length}:null;

  /* Segment premise, with the fix v3 lacked: a perturbation late in one
     segment excludes samples from the start of the next, so onsets are
     selected by whether their fit window OVERLAPS the segment, not by
     whether the onset itself falls inside it. v3 filtered on the onset and
     leaked up to 5 s of fit-window samples into the following segment's
     "perturbation-free" estimate. */
  const perSeg=Eng.segs.map(sg=>{
    const sub=err.subarray(sg.n0,sg.n1);
    const t0=sg.n0/PROTOCOL.fs, t1=sg.n1/PROTOCOL.fs;
    const ons=sch.onsets.filter(o=>o.tS<t1 && o.tS+exclSpanS(o)>t0).map(o=>({nIdx:o.nIdx-sg.n0, tS:o.tS-t0, gtype:o.gtype}));
    const ins=Eng.inputs.filter(e=>e.tS>=t0 && e.tS<t1).map(e=>({tS:e.tS-t0}));
    return {cond:sg.cond, durS:+(t1-t0).toFixed(1),
      premise:sdlpPremise(sub, ons), deployment:{mean:sdlpDeployment(sub).mean},
      fitWindow:fitWindowStats(sub, ons),
      onsetsOverlapping:ons.length,
      intercorrection:intercorrection(ins, t1-t0)};
  });

  const vE=Eng.meterE.variance(), vX=Eng.meterX.variance(), vU=Eng.meterU.variance(), vD=Eng.meterD.variance();
  const ex=v=>v!=null?+v.toExponential(5):null;

  const value={
    cond: step.k==='practice' ? 'practice' : step.cond,
    phase: step.phase||step.k,
    durationS:+durS.toFixed(1),
    startedAt:Eng.startedAt, endedAt:nowISO(),
    realisedWallClockS:+wallS.toFixed(2),
    premise: sdlpPremise(err, sch.onsets),
    deployment: sdlpDeployment(err),
    fitWindow: fitWindowStats(err, sch.onsets),           // S2.1b
    /* Computed before clampAudit tags the onsets, so the constants below are
       the unexcluded ones and the tagging is a separate, later fact. */
    recovery: recoveryStats(err, sch.onsets),             // G5, S2.14
    intercorrection: intercorrection(Eng.inputs, durS),
    perturbations:{planned:sch.onsets.length, delivered:Eng.pertCount,
      allDelivered:Eng.pertCount===sch.onsets.length,
      quietHistoryN:sch.quietHistoryN, recentHistoryN:sch.recentHistoryN,
      pairs:sch.pairs, singletons:sch.singletons, jitterRefixed:sch.jitterRefixed,
      preSpecified:!!sch.preSpecified,
      predictedFreeS:sch.predictedFreeS, groupsPerMin:sch.groupsPerMin,
      sequenceGroupsPerMin:sch.sequenceGroupsPerMin, sequencePairsPerMin:sch.sequencePairsPerMin,
      pairsPerGapWindow:sch.pairsPerGapWindow,
      ruleNineteen: sch.ruleNineteen || null,
      /* 10b. Timing and order only; §1.2 requires it identical across blocks. */
      scheduleSignature: sch.signature||null, identicalAcrossBlocks: !!sch.identicalAcrossBlocks,
      sharedTimingSeed: sch.sharedTimingSeed!=null ? sch.sharedTimingSeed : null,
      directionSeed: sch.dirSeed!=null ? sch.dirSeed : null},
    /* S2.18 — all four channels under their protocol names. */
    proxy:{bandHz:[P('proxyBandLowHz'),P('proxyBandHighHz')],
      errorSignalVar: ex(vE),
      trackedVariableVar: ex(vX),
      controlOutputVar: ex(vU),
      injectedDisturbanceVar: ex(vD),
      targetPosition:0,
      channelsIdentical:true,
      note:'§1.2 requires the >0.5 Hz band variance of the tracked variable AND the error signal. Under a compensatory display with the target fixed at centre these are the same series up to sign, so their variances are equal by construction — emitted separately so S2.18 verifies the identity rather than inheriting it. Control output is the operator-side channel the S2.18 artifact-signature check needs; the full input stream is stored alongside.'},
    /* S2.14 — required, not optional. Emitted; applied in analysis. */
    preOnsetVelocity:{
      windowS:P('preOnsetVelWindowS'), pctile:P('preOnsetVelPctile'),
      perOnset: preOnsetVelocities(err, sch.onsets),
      premiseDistribution: premiseVelocityDistribution(err, sch.onsets),
      note:'S2.14 pre-onset velocity exclusion. Measured over the window ENDING at the last sample before the impulse lands; err[nIdx] is post-onset. The threshold is this participant\'s BASELINE-block distribution at the configured percentile and is applied downstream, never here — a threshold read off the block it is applied to is not a threshold (Standing Rule 3). Report exclusion rate by condition and by history, and treat a rate near 0% or near 100% as a fault in the measurement rather than a property of the participant.'},
    disturbance: Eng.distMeta,
    timing:{nominalHz:PROTOCOL.fs, sampleClockS:+durS.toFixed(2), wallClockS:+wallS.toFixed(2),
      clockDriftS:+(wallS-durS).toFixed(2), frameJitter:jitStats, gaps:Eng.gaps, clampedSamples:Eng.clamped},
    clamping: clampAudit(err, sch.onsets, Eng.clampIdx||[]),
    nback: Eng.nback ? nbackSummary() : null,
    segments: step.segments ? perSeg : null
  };
  if(step.phase==='induction'){
    const win=windowSeries(err, Eng.inputs, sch.onsets, durS, PROTOCOL.inductionWindowS, PROTOCOL.inductionStrideS);
    value.inductionWindows={
      windowS:PROTOCOL.inductionWindowS, strideS:PROTOCOL.inductionStrideS,
      oneMin: win,
      standardScored:{
        sdlpPremise: standardScore(win,'sdlpPremise'),
        sdlpDeployment: standardScore(win,'sdlpDeployment'),
        cv: standardScore(win,'cv')
      },
      historyGapWindows: gapWindowCensus(sch.onsets, durS),
      note:'§8.6. SDLP and inter-correction CV on 1-minute windows, standard-scored against minutes two and three. The history gap is fitted in analysis on 3-minute windows with a 1-minute stride; the realised pair count per window is reported here so power is re-derived at the achieved count.'
    };
  }
  /* §8.2 "disturbance amplitude and load difficulty confirmed against the
     participant's own baseline". Confirmation, not calibration: the numbers
     are compared to the pilot-fixed target and a miss is logged. No
     parameter moves, in any mode, ever. */
  if(step.k==='practice' && P('sdlpTargetIncreasePct')>0){
    const seg=value.segments||[];
    const b=seg.find(x=>x.cond==='base');
    const tgt=P('sdlpTargetIncreasePct'), band=P('practiceConfirmBandPct');
    value.practiceConfirmation={targetIncreasePct:tgt, bandPct:band, checks:[], note:
      'Confirmation only. A 60 s segment yields about 36 s of premise (32–44 s across schedules), so the band is wide and a miss is a flag for the operator, not a verdict and not a reason to change anything. G1 is scored across the pilot on full 300 s blocks.'};
    ['road','load'].forEach(c=>{
      const x=seg.find(y=>y.cond===c);
      const inc=(x&&b&&b.premise.sdlp)?+(((x.premise.sdlp-b.premise.sdlp)/b.premise.sdlp)*100).toFixed(1):null;
      const within = inc!=null && Math.abs(inc-tgt)<=band;
      value.practiceConfirmation.checks.push({cond:c, increasePct:inc, within});
      if(inc!=null && !within)
        deviation('calibration','Practice '+c+' SDLP-premise increase '+inc+'% against a pilot target of '+tgt+
          '% (band ±'+band+'%). Recorded and NOT corrected — parameters do not move inside a session.');
      if(inc==null)
        deviation('calibration','Practice '+c+' segment produced no comparable SDLP-premise increase — confirmation could not be made');
    });
  }
  /* Caught per block, not only at setup: a device can drop to half rate
     partway through an hour (thermal throttling, a battery-saver kicking
     in, another tab taking the compositor) and nothing else here would
     notice. The plant stays correct either way, which is exactly why this
     needs saying out loud. */
  if(jitStats && jitStats.medianMs > PROTOCOL.frameIntervalCeilingMs)
    deviation('timing','Median frame interval '+jitStats.medianMs.toFixed(1)+' ms during '+step.title+
      ' = '+(1000/jitStats.medianMs).toFixed(1)+' Hz against the '+PROTOCOL.fs+' Hz §1.2 specifies. '+
      'The plant integrated correctly, but input is sampled once per frame, so correction timestamps, '+
      'inter-correction intervals (S2.12) and fit windows in this block carry half the intended resolution');
  if(Eng.gaps.length) deviation('timing', Eng.gaps.length+' frame gap(s) ≥500 ms during '+step.title+' — the page was backgrounded or the device slept');
  if(Eng.clamped>0){
    const ca=value.clamping;
    deviation('clamping', Eng.clamped+' sample(s) at the display bound during '+step.title+
      (ca.inFitWindow ? ' — '+ca.inFitWindow+' of them inside a fit window, censoring '+ca.onsetsAffected+
        ' onset(s) ('+ca.byHistory.quiet+' quiet, '+ca.byHistory.recent+' recent). Those recoveries are censored '+
        'and the censoring is unequal between histories, which Standing Rule 19 forbids for any gap computed from this block'
       : ' — none inside a fit window, so no recovery in this block is censored by the bound'));
  }
  /* Reported while the participant is still in the room. A cell fitted at a
     relative standard error above 0.45 cannot support S3 at any sample size
     (Protocol Part 2), and finding that out in analysis is finding it out
     after the perturbation count could have been changed. */
  if(value.recovery && value.recovery.g5.worstRse!=null && value.recovery.g5.passes===false
     && step.k!=='practice' && durS>=PROTOCOL.blockS)
    deviation('precision','G5: tau-hat relative standard error '+value.recovery.g5.worstRse.toFixed(2)+
      ' in '+step.title+' against a criterion of 0.45 (quiet '+value.recovery.g5.quietRse+
      ', recent '+value.recovery.g5.recentRse+'). Below this threshold S3 is underpowered regardless of n; '+
      'the remedy is more perturbations per block and it is a protocol change, not a session change');
  if(value.recovery && value.recovery.g5.censoredFits>0 && step.k!=='practice')
    deviation('precision',value.recovery.g5.censoredFits+' of 2 history cells in '+step.title+
      ' returned a decay constant censored at the '+PROTOCOL.fitWindowS+' s fit ceiling. A constant at the bound '+
      'is not an estimate of a decay, and no history gap can be formed from it (Part 4)');
  if(Math.abs(wallS-durS)>PROTOCOL.clockToleranceS)
    deviation('timing','"'+step.title+'" ran '+wallS.toFixed(1)+' s of wall clock against '+durS.toFixed(1)+
      ' s of samples — the sample clock fell behind real time and the series is shorter in seconds than it appears');
  if(Eng.pertCount!==sch.onsets.length)
    deviation('perturbation','Delivered '+Eng.pertCount+' of '+sch.onsets.length+' scheduled onsets during '+step.title);
  if(value.premise.durationS<PROTOCOL.premiseFloorS && durS>=PROTOCOL.blockS)
    deviation('premise','Realised perturbation-free sample '+value.premise.durationS+' s is below the 150 s floor');

  const payload={
    step:i, cond:value.cond, fs:PROTOCOL.fs, durationS:value.durationS,
    codec:{type:'int16-base64', scale:1000, endian:'little',
      decode:'atob → Uint8Array → Int16Array (little-endian) → divide by scale'},
    error:encodeI16(err,1000),
    disturbance: Eng.distMeta.used ? encodeI16(Eng.d,1000) : null,
    inputs:Eng.inputs, schedule:sch,
    nbackEvents: Eng.nback ? Eng.nbackLog : null
  };
  putBlock(i, payload);

  const st=S.steps[i];
  st.value=value;
  log(step.title+' complete — SDLP-premise '+(value.premise.sdlp!=null?value.premise.sdlp:'—')+
      ' over '+value.premise.durationS+' s, '+value.intercorrection.n+' corrections');
  if(Eng.onDone) Eng.onDone(value); else completeStep(i);
}

function drawDot(canvas, e){
  if(!canvas) return;
  const w=canvas.clientWidth||300, h=90;
  if(canvas.width!==w) canvas.width=w;
  if(canvas.height!==h) canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const midY=h/2, range=(w/2)-22;
  const x=w/2 + (e/P('clampAbs'))*range;
  const off=Math.min(1, Math.abs(e)/2.2);
  ctx.beginPath(); ctx.arc(w/2, midY, 22, 0, Math.PI*2);
  ctx.strokeStyle=cssvar('--card3'); ctx.lineWidth=6; ctx.stroke();
  const c1=hexToRgb(cssvar('--accent')), c2=hexToRgb(cssvar('--warn'));
  const mix=c1.map((v,i)=>Math.round(v+(c2[i]-v)*off));
  ctx.beginPath(); ctx.arc(x, midY, 13+off*3, 0, Math.PI*2);
  ctx.fillStyle='rgb('+mix.join(',')+')'; ctx.fill();
}
function hexToRgb(hex){
  hex=(hex||'#2c6e68').replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}

/* ══ AUDITORY n-BACK ══════════════════════════════════════════════
   §1.2: concurrent auditory 2-back, tracking parameters unchanged. The
   load is carried entirely in the auditory channel and one extra button;
   the plant, the noise, the impulse size and the schedule are identical
   to baseline. ════════════════════════════════════════════════════ */
const NB_LETTERS=['B','F','H','K','M','Q','R','X'];
let audioCtx=null, voiceMode='speech';
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; } }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function speechAvailable(){ try{ return typeof speechSynthesis!=='undefined' && speechSynthesis.getVoices().length>0; }catch(e){ return false; } }
function sayLetter(ch){
  if(voiceMode==='speech' && speechAvailable()){
    try{ const u=new SpeechSynthesisUtterance(ch); u.rate=0.95; u.volume=1; speechSynthesis.speak(u); return; }catch(e){}
  }
  ensureAudio();
  if(!audioCtx) return;
  const idx=Math.max(0,NB_LETTERS.indexOf(ch));
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.frequency.value=330*Math.pow(2, idx/12); o.type='sine';
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.35);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.4);
}
function startNback(loadSegs){
  Eng.nbackLog=[]; Eng.nbSeq=[]; Eng.nbNext=null; Eng.nbSegs=loadSegs;
  /* falseAlarms counts responses to a non-target stimulus, so the rate has
     non-targets as its denominator and cannot exceed 1. Responses with no
     stimulus pending are commission errors and are counted separately — v3
     folded them together, which could drive d' off a cliff. */
  Eng.nbStats={stim:0, targets:0, hits:0, misses:0, falseAlarms:0, spurious:0};
  Eng.nbAwait=null;
  const isi=Math.round(P('nbackIsiS')*PROTOCOL.fs);
  Eng.nbIsi=isi;
  Eng.nbNextN=loadSegs[0].n0+isi;
  if(voiceMode==='speech' && !speechAvailable()) deviation('nback','Speech synthesis unavailable — auditory stimuli delivered as tones');
  return true;
}
function nbackInSeg(){ return Eng.nbSegs.some(s=>Eng.n>=s.n0 && Eng.n<s.n1); }
function nbackTick(){
  if(!nbackInSeg()) return;
  if(Eng.nbAwait && Eng.n - Eng.nbAwait.n > Eng.nbIsi){
    if(Eng.nbAwait.isTarget){ Eng.nbStats.misses++; flashNb(false); }
    Eng.nbAwait=null;
  }
  if(Eng.n>=Eng.nbNextN){
    const rnd=Eng.rnd, lvl=P('nbackLevel');
    let ch;
    const canTarget=Eng.nbSeq.length>=lvl;
    const isTarget = canTarget && rnd()<P('nbackTargetRate');
    if(isTarget) ch=Eng.nbSeq[Eng.nbSeq.length-lvl];
    else{
      do{ ch=NB_LETTERS[Math.floor(rnd()*NB_LETTERS.length)]; }
      while(canTarget && ch===Eng.nbSeq[Eng.nbSeq.length-lvl]);
    }
    Eng.nbSeq.push(ch);
    Eng.nbStats.stim++; if(isTarget) Eng.nbStats.targets++;
    const ev={n:Eng.n, tS:+(Eng.n/PROTOCOL.fs).toFixed(3), letter:ch, isTarget, responded:false, rtMs:null};
    Eng.nbackLog.push(ev);
    Eng.nbAwait=ev;
    sayLetter(ch);
    const cue=document.getElementById('nb-cue');
    if(cue) cue.textContent='listening · '+Eng.nbStats.stim+' heard';
    Eng.nbNextN=Eng.n+Eng.nbIsi;
  }
}
function nbackRespond(){
  if(!Eng.active || !Eng.nback) return;
  const ev=Eng.nbAwait;
  if(!ev){ Eng.nbStats.spurious++; flashNb(false); return; }
  if(ev.responded) return;
  ev.responded=true; ev.rtMs=Math.round((Eng.n-ev.n)*1000/PROTOCOL.fs);
  if(ev.isTarget){ Eng.nbStats.hits++; flashNb(true); }
  else{ Eng.nbStats.falseAlarms++; flashNb(false); }
  Eng.nbAwait=null;
  const sc=document.getElementById('nb-score');
  if(sc) sc.textContent=Eng.nbStats.hits+'/'+Eng.nbStats.targets;
}
/* Feedback is familiarisation, not part of the manipulation. §1.2 specifies
   a concurrent auditory 2-back with tracking parameters unchanged; per-
   response colour and haptics would be an additional visual and tactile
   channel present only in the load condition, and a running score changes
   effort allocation. Both are confined to the practice step. */
function nbackFeedbackAllowed(){ return !!(Eng.step && Eng.step.k==='practice'); }
function flashNb(ok){
  if(!nbackFeedbackAllowed()) return;
  const row=document.getElementById('nbrow');
  if(!row) return;
  row.classList.remove('flash-ok','flash-bad'); void row.offsetWidth;
  row.classList.add(ok?'flash-ok':'flash-bad');
  buzz(ok?15:45);
}
function nbackSummary(){
  const s=Eng.nbStats, rts=Eng.nbackLog.filter(e=>e.rtMs!=null).map(e=>e.rtMs).sort((a,b)=>a-b);
  const hitRate=s.targets?s.hits/s.targets:null;
  const nonTargets=s.stim-s.targets;
  const faRate=nonTargets?s.falseAlarms/nonTargets:null;
  const z=p=>{ p=Math.min(1-1/(2*Math.max(1,s.stim)), Math.max(1/(2*Math.max(1,s.stim)), p));
    /* Acklam inverse-normal, adequate for a reported d' */
    const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
    const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
    const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
    const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
    const pl=0.02425;
    let q,r;
    if(p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    if(p<=1-pl){ q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
    q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  };
  return {level:P('nbackLevel'), isiS:P('nbackIsiS'), modality: (voiceMode==='speech'&&speechAvailable())?'speech':'tones',
    stimuli:s.stim, targets:s.targets, nonTargets:nonTargets, hits:s.hits, misses:s.misses,
    falseAlarms:s.falseAlarms, spuriousResponses:s.spurious,
    feedbackShown:nbackFeedbackAllowed(),
    hitRate:hitRate!=null?+hitRate.toFixed(3):null, faRate:faRate!=null?+faRate.toFixed(3):null,
    dPrime:(hitRate!=null&&faRate!=null)?+(z(hitRate)-z(faRate)).toFixed(3):null,
    medianRtMs:rts.length?rts[Math.floor(rts.length/2)]:null,
    note:'falseAlarms are responses to a non-target stimulus; spuriousResponses are presses with nothing pending and are excluded from the false-alarm rate.'};
}

async function saveFile(filename, text, mime){
  if(window.claude && typeof window.claude.use==='function'){
    try{
      const downloads=await window.claude.use('downloads');
      if(!downloads) return {ok:false, reason:'Downloads aren\u2019t available in this view.'};
      await downloads.save({filename, data:text});
      return {ok:true};
    }catch(e){ return {ok:false, reason:'The save prompt was declined or failed.'}; }
  }
  try{
    const blob=new Blob([text],{type:mime||'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
    return {ok:true};
  }catch(e){ return {ok:false, reason:'Your browser blocked the download.'}; }
}

/* S2.1b at session level — the residual between cells after SDLP-premise
   matching, which is a cross-condition quantity a single block cannot
   supply. Baseline is the early-phase baseline block. */
function residualS21b(){
  const cells={};
  STEPS.forEach((s,i)=>{ const v=S.steps[i].value;
    if(s.k==='track' && v && v.premise && v.premise.sdlp!=null)
      cells[s.cond]={premise:v.premise.sdlp, premiseDurationS:v.premise.durationS,
        deployment:v.deployment?v.deployment.mean:null,
        fitWindowShare:v.fitWindow?v.fitWindow.shareOfBlockVariance:null}; });
  const b=cells.base;
  const rows=Object.keys(cells).map(c=>{
    const x=cells[c];
    return {cond:c, sdlpPremise:x.premise, sdlpDeployment:x.deployment,
      premiseDurationS:x.premiseDurationS, fitWindowVarianceShare:x.fitWindowShare,
      premiseDeltaFromBaseline: (b&&b.premise)? +((x.premise-b.premise)).toFixed(4) : null,
      deploymentDeltaFromBaseline: (b&&b.deployment!=null&&x.deployment!=null)? +((x.deployment-b.deployment)).toFixed(4) : null,
      residualAfterPremiseMatching: (b&&b.premise&&b.deployment!=null&&x.deployment!=null)
        ? +((x.deployment-b.deployment)-(x.premise-b.premise)).toFixed(4) : null};
  });
  return {baselineCell:'base', rows,
    note:'S2.1b. Residual is the SDLP-deployment offset that survives SDLP-premise matching. Expected positive in the fatigued cell: the probe assists the statistic under criticism, so any advantage the corrected rules show in S3 is a lower bound.'};
}
/* Schedule density, checked rather than asserted. §1.2 requires the pair
   schedule to continue through the induction "at constant density"; the
   quantity that must match is the density inside the sequence, since a
   block is diluted by its lead-in and lead-out. */
/* §1.2: "The same pair schedule continues through the 22-min induction at
   constant density." The quantity actually held constant is the inter-group
   onset cycle and the pair proportion, so that is what is compared. A
   pairs-per-minute ratio computed over each sequence span is NOT comparable
   between them: a 10-group block spans nine inter-group intervals and so
   reads about 5% high, while the induction's many intervals converge on the
   true rate. Comparing those two numbers would fail a schedule that is in
   fact identical. Both are reported; the gate runs on the cycle. */
function meanGroupCycle(sch){
  if(!sch.groups || sch.groups.length<2) return null;
  const f=sch.groups[0].tS, l=sch.groups[sch.groups.length-1].tS;
  return (l-f)/(sch.groups.length-1);
}
function densityCheck(){
  const base=(S.seed^hashStr('densitycheck'))>>>0;
  /* A single 300 s block holds nine jitter draws, so its realised cycle has
     a standard error near 2%. Average across seeds for a stable comparator. */
  let cyc=0, pp=0, ppm=0, reps=200;
  for(let k=0;k<reps;k++){
    const b=buildSchedule(PROTOCOL.blockS, (base+k)>>>0, {maxGroups:PROTOCOL.groupsPerBlock});
    cyc+=meanGroupCycle(b); pp+=b.pairs/b.groups.length; ppm+=b.sequencePairsPerMin;
  }
  const blockCycle=cyc/reps, blockPairProp=pp/reps, blockPPM=ppm/reps;
  const ind=buildSchedule(PROTOCOL.inductionS, base, {});
  const indCycle=meanGroupCycle(ind), indPairProp=ind.pairs/ind.groups.length;
  const relC=Math.abs(indCycle-blockCycle)/blockCycle;
  const relP=Math.abs(indPairProp-blockPairProp)/blockPairProp;
  return {
    blockMeanGroupCycleS:+blockCycle.toFixed(3), inductionMeanGroupCycleS:+indCycle.toFixed(3),
    blockPairProportion:+blockPairProp.toFixed(3), inductionPairProportion:+indPairProp.toFixed(3),
    cycleRelativeDifference:+relC.toFixed(4), pairProportionRelativeDifference:+relP.toFixed(4),
    withinFivePercent: relC<=0.05 && relP<=0.05,
    blockPairsPerMin:+blockPPM.toFixed(3), inductionPairsPerMin:ind.sequencePairsPerMin,
    blockPairsPerGapWindow:+(blockPairProp*(60/blockCycle)*(PROTOCOL.gapWindowS/60)).toFixed(2),
    inductionPairsPerGapWindow:ind.pairsPerGapWindow,
    jitterS:[PROTOCOL.jitterMinS,PROTOCOL.jitterMaxS], pairIntervalS:PROTOCOL.pairIntervalS,
    note:'Gate is on the inter-group cycle and pair proportion. The pairs-per-minute figures are descriptive only: a block reads about 5% high because ten groups span nine intervals, which is an artefact of the measure rather than of the schedule. Pairs per 3-minute window is reported because §8.6 sized that window on an assumed nine.'};
}
/* S2.14's threshold is the participant's OWN baseline block, so it exists the
   moment the last block ends. Leaving the exclusion entirely to analysis meant
   nobody saw that the rule was removing most of a condition until weeks later.
   Computed here, reported here, and a cell that drops under the power
   requirement raises a deviation while the participant is still in the room. */
function exclusionAudit(){
  const by={};
  S.steps.forEach(st=>{ const v=st.value;
    /* 10e. Practice is familiarisation. It has no power requirement and
       scoring it raised a spurious deviation in every session. */
    if(!v||!v.preOnsetVelocity||!v.cond||v.cond==='practice') return;
    by[v.cond]=v; });
  const base=by['base'];
  if(!base||!base.preOnsetVelocity.premiseDistribution) return null;
  const thr=base.preOnsetVelocity.premiseDistribution.atConfiguredPctile;
  const probe=c=>(c==='removal'||c==='persist');
  const rows=Object.keys(by).map(c=>{
    const po=by[c].preOnsetVelocity.perOnset.filter(o=>o.absVelocity!=null);
    if(!po.length) return null;
    const kept=po.filter(o=>o.absVelocity<=thr);
    const kq=kept.filter(o=>o.history==='quiet').length, kr=kept.filter(o=>o.history==='recent').length;
    const need=probe(c)?2:8;
    return {cond:c, n:po.length, excluded:po.length-kept.length,
      excludedPct:+(100*(po.length-kept.length)/po.length).toFixed(1),
      keptQuiet:kq, keptRecent:kr, requiredPerHistory:need, meetsPower:kq>=need&&kr>=need};
  }).filter(Boolean);
  return {thresholdFromBaselineBlock:thr, pctile:P('preOnsetVelPctile'),
    windowS:P('preOnsetVelWindowS'), rows,
    note:'S2.14 applied at this participant\u2019s own baseline-block p'+P('preOnsetVelPctile')+
      '. Rates that differ sharply BY CONDITION are the thing to look at: differential exclusion is a bias, '+
      'not a cleaning step, and a condition whose error velocity is raised by the manipulation itself will '+
      'lose observations for that reason alone. A rate near 0% or near 100% everywhere means the measurement '+
      'is wrong, not the participant.'};
}

       provenance field disagreed with the build in every file. */
    protocol:Object.assign({}, PROTOCOL, {conformance:'Study 2 '+PROTOCOL.runner+', built to Analysis Protocol v16 §1.2 and Proposal v16 §8.2–8.2b'}),
    exportedAt:nowISO(),

/* ══ MANIPULATION CHECK (G2) ══════════════════════════════════════
   §1.2: fatigue confirmed by KSS and PVT, never assumed from clock
   time. Computed here so the operator sees it before leaving. ════ */
function manipulationCheck(){
  const kss=[], pvt=[];
  STEPS.forEach((s,i)=>{ const st=S.steps[i];
    if(s.k==='kss' && st.value && st.value.kss!=null) kss.push({boundary:s.boundary, value:st.value.kss, at:st.endedAt});
    if(s.k==='pvt' && st.value) pvt.push({point:s.point, medianRT:st.value.medianRT, lapses:st.value.lapses});
  });
  const first=kss.length?kss[0].value:null;
  const postInduction=(kss.find(k=>k.boundary==='induction-end')||{}).value;
  const kssRise=(first!=null&&postInduction!=null)?postInduction-first:null;
  const p0=pvt.find(p=>p.point==='early-phase-end'), p1=pvt.find(p=>p.point==='session-end');
  const rtDelta=(p0&&p1&&p0.medianRT!=null&&p1.medianRT!=null)?p1.medianRT-p0.medianRT:null;
  const lapseDelta=(p0&&p1)?(p1.lapses-p0.lapses):null;
  const pass = kssRise!=null && kssRise>=2 && rtDelta!=null && (rtDelta>0 || (lapseDelta!=null && lapseDelta>0));

  /* G2 is read four ways, not one. The other three readings turn on what
     disturbance and load did to KSS, which the early-phase ratings already
     hold. PVT is sampled only at the two points §1.2 specifies, so the
     early-phase PVT is a single shared post-condition reading and the
     limitation is stated rather than papered over. */
  const kssAfter=(cond)=>{
    const i=STEPS.findIndex(s=>s.k==='track'&&s.cond===cond);
    if(i<0) return null;
    for(let j=i+1;j<STEPS.length;j++){
      if(STEPS[j].k==='kss'){ const v=S.steps[j].value; return v&&v.kss!=null?v.kss:null; }
      if(STEPS[j].k==='track'&&STEPS[j].cond!=='removal') return null;
    }
    return null;
  };
  const conditionReads=['road','load'].map(c=>{
    const after=kssAfter(c), d=(after!=null&&first!=null)?after-first:null;
    return {condition:c, kssAfterBlock:after, kssDeltaFromStart:d,
      reading: d==null ? 'incomplete'
        : (d>=2 ? 'raises KSS — read against the early-phase PVT: if PVT is also degraded this manipulation is genuinely fatiguing and impure; if PVT is intact this is misattribution and a result (S2.9), not a failure'
                : 'KSS not materially raised by this manipulation')};
  });
  const lateUnmoved = (kssRise!=null && kssRise<2 && rtDelta!=null && rtDelta<=0);

  return {gate:'G2', kssSeries:kss, pvt:pvt, kssRise, pvtMedianRtDeltaMs:rtDelta, pvtLapseDelta:lapseDelta,
    criterion:'Fatigue: KSS rises ≥2 points and PVT degrades',
    result: (kssRise==null||rtDelta==null) ? 'incomplete' : (pass?'induction confirmed':'not confirmed — read four ways, §G2'),
    reads:{
      fatigue:{kssRise, pvtMedianRtDeltaMs:rtDelta, pvtLapseDelta:lapseDelta, meetsCriterion:pass},
      disturbanceAndLoad:conditionReads,
      misattribution:'Raised KSS with an intact PVT is misattribution and a result (S2.9), not a failed manipulation.',
      compensation: lateUnmoved
        ? 'Late blocks unmoved on KSS and PVT. Do NOT score this as a failed induction until the history gap has been read — it may be a compensation stage (S2.15, Standing Rule 15).'
        : 'Not applicable on this session.'
    },
    pvtCoverage:'PVT is sampled at end of early phase and session end only (§1.2), so no per-condition PVT exists by design. The early-phase PVT is the shared post-condition reading for both disturbance and load.',
    note:'Read four ways, never pass/fail. Ground truth is KSS/PVT, never the condition label (Standing Rule 6).'};
}

  else if(uiView==='analyze'){ document.getElementById('hd-name').textContent='Trace'; renderAnalyze(); }
  updateElapsed();
}

function renderStrip(){

function peek(i){
  const s=STEPS[i], st=S.steps[i], v=st.value;

      +'<div class="sumrow"><span>premise duration / segments</span><span>'+v.premise.durationS+' s / '+v.premise.segments+'</span></div>'
      +'<div class="sumrow"><span>SDLP-deployment (60 s windows)</span><span>'+v.deployment.mean+'</span></div>'
      +'<div class="sumrow"><span>corrections · rate · CV</span><span>'+v.intercorrection.n+' · '+v.intercorrection.ratePerS+'/s · '+(v.intercorrection.cv!=null?v.intercorrection.cv:'—')+'</span></div>'
      +'<div class="sumrow"><span>perturbations (quiet / recent)</span><span>'+v.perturbations.quietHistoryN+' / '+v.perturbations.recentHistoryN+'</span></div>'
      +'<div class="sumrow"><span>proxy band var — error / tracked / control / injected</span><span>'+v.proxy.errorSignalVar+' · '+v.proxy.trackedVariableVar+' · '+v.proxy.controlOutputVar+' · '+(v.proxy.injectedDisturbanceVar||'—')+'</span></div>'
      +'<div class="sumrow"><span>fit-window variance share (S2.1b)</span><span>'+(v.fitWindow?v.fitWindow.shareOfBlockVariance:'—')+'</span></div>';
    if(v.nback) rows+='<div class="sumrow"><span>2-back hits / targets · d′</span><span>'+v.nback.hits+'/'+v.nback.targets+' · '+(v.nback.dPrime!=null?v.nback.dPrime:'—')+'</span></div>';
  }
  if(v && v.medianRT!==undefined) rows+='<div class="sumrow"><span>Median RT · lapses · false starts</span><span>'+(v.medianRT!=null?v.medianRT+' ms':'—')+' · '+v.lapses+' · '+v.falseStarts+'</span></div>';
  if(v && v.kss!=null) rows+='<div class="sumrow"><span>KSS</span><span>'+v.kss+' — '+esc(KSS_LABELS[v.kss-1])+'</span></div>';
  openModal('<h3>'+esc(s.title)+'</h3>'+rows+'<div class="btnrow" style="margin-top:14px"><button class="ghost" id="m-close">Close</button></div>');

function renderNow(){
  const host=document.getElementById('nowcard');
  if(S.current>=STEPS.length){ host.innerHTML=''; return; }
  const step=STEPS[S.current], st=S.steps[S.current];
  let control='';
  if(step.k==='setup') control=setupPanel();
  else if(step.k==='consent') control=consentPanel();
  else if(step.k==='practice') control=practicePanel(step, st);
  else if(step.k==='track') control=trackPanel(step, st);
  else if(step.k==='kss') control=(st.value && step.offerBreak && !st.acknowledged) ? kssBreakPanel(step, st) : kssPanel(step);
  else if(step.k==='pvt') control=(st.value && step.offerBreakAfter && !st.acknowledged) ? pvtBreakPanel(step, st) : pvtPanel();
  else if(step.k==='break') control=breakPanel(step, st);
  else if(step.k==='finish') control=finishPanel();
  const showSkip = testMode && step.k!=='finish';
  const desc = step.k==='track' ? CONDITIONS[step.cond].desc : (step.k==='practice'?'Familiarisation and an audibility check. Not a G1 test.':'');
  host.innerHTML=`<div class="now">
    <span class="tag ${step.tag}">${TAGLABEL[step.tag]||'—'}</span>
    <h2>${esc(step.title)}</h2>
    ${desc?`<div class="sub">${esc(desc)}</div>`:'<div class="sub" style="height:4px"></div>'}
    ${control}
    ${showSkip?`<div class="btnrow" style="margin-top:10px"><button class="ghost" id="test-skip">⏭ Skip step (testing mode)</button></div>`:''}
  </div>`;
  skipFn=null;
  wirePanel(step, st, S.current);
  if(showSkip){ const b=document.getElementById('test-skip'); if(b) b.onclick=()=>{ if(skipFn) skipFn(); }; }
}

function studyGate(){
  const n=parseInt(S.setup.participantNo,10);
  const td=today();
  const eDate=S.setup.ethicsDate, pDate=S.setup.preregDate;
  const ethicsOK = !!(S.setup.ethicsRef && eDate && eDate<=td);
  const preregOK = !!(S.setup.preregRef && pDate && pDate<=td);
  const numOK = n>=1 && n<=PROTOCOL.participantMax;
  /* Standing Rule 3: a threshold chosen after seeing the number is not a
     threshold. Fixing a parameter on the day of a study session, or after
     the pre-registration was filed, defeats the date. */
  const lateParams = pDate ? Object.keys(PARAMS).filter(k=>PARAMS[k].fixedOn && PARAMS[k].fixedOn>pDate) : [];
  /* The induction carries no disturbance, so the binding length is the
     longest block that does — 300 s, not 1320 s. */
  const longestDistBlockS = Math.max.apply(null, buildSteps(0)
    .filter(x=>(x.k==='track'&&CONDITIONS[x.cond]&&CONDITIONS[x.cond].dist)||x.k==='practice')
    .map(x=>x.k==='practice'?60:x.dur).concat([0]));
  /* 10c. The trace must also leave room for a practice stretch disjoint
     from the data stretch. */
  const practiceRoadS = ((buildSteps(0).find(x=>x.k==='practice')||{segments:[]}).segments.find(s=>s.cond==='road')||{dur:0}).dur;
  const distCoverOK = !!(DIST && DIST.meta.durationS>=longestDistBlockS && DIST.meta.durationS>=PROTOCOL.blockS+practiceRoadS);
  const g1=g1Status(), g5=g5Status();
  const arith=sessionArithmetic(buildSteps(0));
  const dens=densityCheck();
  const checks=[
    {name:'Ethics approval recorded and not retroactive',
     ok:ethicsOK,
     detail: !S.setup.ethicsRef||!eDate ? 'Reference and date required (Appendix C)'
       : (eDate>td ? 'Approval date '+eDate+' is in the future — approval cannot be granted retroactively'
                   : 'Approved '+eDate+', before this session and before any recruitment contact')},
    {name:'Pre-registration filed before collection',
     ok:preregOK,
     detail: !S.setup.preregRef||!pDate ? 'Reference and timestamp required (Appendix D)'
       : (pDate>td ? 'Filing date '+pDate+' is in the future — Standing Rule 24 requires a public timestamp before collection'
                   : 'Filed '+pDate+', before collection and before any empirical analysis')},
    {name:'Participant number within the recruitment frame', ok:numOK,
     detail: numOK ? ('Order '+(((n-1)%6)+1)+' of 6 assigned; code '+participantCode(n))
       : ('A number from 1 to '+PROTOCOL.participantMax+' is required — it assigns the counterbalance order and is the participant code')},
    {name:'Parameters fixed and dated before pre-registration', ok:paramsLocked() && lateParams.length===0,
     detail: paramsNeedingValue().length ? (paramsNeedingValue().join(', ')+' still sits at 0. A date on a zero is not a calibration — take the value from the G1 pilot result')
       : (!paramsLocked() ? 'Some parameters have no fixed-on date (Standing Rules 1 and 3)'
       : (lateParams.length ? ('Fixed after the pre-registration was filed: '+lateParams.join(', '))
                            : 'All '+PARAM_SPEC.length+' carry a logbook date on or before '+pDate))},
    /* Before the session, not after it. The pilot of 2026-09-24 ran a full
       hour at 30.3 Hz and found out from the export. */
    /* §8.2's three manipulations are compared to each other. Unmatched,
       there is nothing to compare and an hour of collection buys nothing. */
    {name:'G1 — the three manipulations are matched', ok:g1.passes,
     detail: g1.cells===0 ? (g1.excluded.length ? 'No eligible cells. '+g1.excluded.length+' recorded row(s) excluded — '+g1.exWhy.join('; ')+'. Menu → G1 calibration record → Re-score saved pilot session files carries over what is comparable'
                                                : 'No calibration cells recorded. Run the G1 pilot, or re-score its saved session files, before collecting')
       : (g1.n<6 ? 'Eligible pilot participants per cell: road '+g1.nCell.road+', load '+g1.nCell.load+', fatigue '+g1.nCell.fatigue+' (about six each)'+(g1.excluded.length?'; '+g1.excluded.length+' row(s) excluded — '+g1.exWhy.join('; '):'')
       : (g1.short ? g1.short+' eligible cell(s) fall below the '+PROTOCOL.premiseFloorS+' s premise floor'
       : (g1.pairs.every(x=>x.ok===true)
          ? 'road '+g1.agg.road.toFixed(0)+'%, load '+g1.agg.load.toFixed(0)+'%, fatigue '+g1.agg.fatigue.toFixed(0)+'% — all pairs within tolerance'+(g1.excluded.length?' ('+g1.excluded.length+' earlier row(s) excluded)':'')
          : g1.pairs.filter(x=>x.ok===false).map(x=>x.a+' vs '+x.b+' differ by '+x.d+' pp against a tolerance of '+x.tol+' pp').join('; '))))},
    /* Protocol Part 2: "Do not proceed past a failed gate." G5 is the gate
       Part 2 says is most often skipped, so it blocks here on G1's terms. Its
       remedy — more perturbations per block — is a protocol change. */
    {name:'G5 — τ̂ precision across the pilot (relative SE ≤ 0.45)', ok:g5.passes,
     detail: g5.rows===0 ? (g5.excluded ? 'No eligible precision records; '+g5.excluded+' from earlier builds excluded — re-score their session files'
                                        : 'No precision recorded. Add pilot cells to the calibration record — every session computes it.')
       : (g5.n<6 ? 'n='+g5.n+' of about six pilot participants'
       : (g5.failing ? g5.failing+' of '+g5.rows+' eligible cell(s) exceed 0.45, worst '+g5.worst.toFixed(2)+
            '. S3 is underpowered at any sample size until this passes; the remedy is more perturbations per block (§8.2a) and it changes the protocol first'
          : 'worst relative SE '+g5.worst.toFixed(2)+' across '+g5.rows+' eligible cell(s), n='+g5.n))},
    (()=>{ const s=p0Status(); return {name:'P0 computational validation run on this build', ok:s.ok,
      detail: !s.ran ? 'Not run on this device. Menu → P0 computational validation (Protocol Part 3: before any real data)'
        : (!s.current ? 'Last run under '+s.rec.runner+'; run it again on '+PROTOCOL.runner
        : (s.runnerFails.length ? 'Run '+s.rec.at.slice(0,10)+': failing checks the runner owns — '+s.runnerFails.map(f=>f.name).join('; ')
        : 'Run '+s.rec.at.slice(0,10)+': '+s.rec.passed+' of '+s.rec.scored+' scored checks passed.'+
          (s.protocolFails.length ? ' Failing on the protocol’s own definitions, to be resolved in the protocol and pre-registration: '+s.protocolFails.map(f=>f.name).join('; ')+'. Protocol Part 3 says work stops until every check passes.' : ''))) }; })(),
    {name:'Display refresh meets the '+PROTOCOL.fs+' Hz sampling spec',
     ok: measuredHz==null ? false : (1000/measuredHz) <= PROTOCOL.frameIntervalCeilingMs,
     detail: measuredHz==null ? 'Display rate not yet measured — reload the page and wait a moment'
       : ((1000/measuredHz)<=PROTOCOL.frameIntervalCeilingMs
          ? measuredHz+' Hz measured, frame interval '+(1000/measuredHz).toFixed(1)+' ms'
          : measuredHz+' Hz measured ('+(1000/measuredHz).toFixed(1)+' ms per frame, ceiling '+
            PROTOCOL.frameIntervalCeilingMs+' ms). Input is sampled per frame, so S2.12 and every fit window '+
            'would run at half resolution. Close other tabs, disable battery saver, or use another device')},
    {name:'Trace covers the longest block that uses it', ok:distCoverOK,
     detail: !DIST ? 'No trace installed'
       : (distCoverOK ? DIST.meta.durationS+' s of trace against a '+longestDistBlockS+
            ' s disturbance block plus a '+practiceRoadS+' s practice stretch kept disjoint from it; playback never wraps'
          : DIST.meta.durationS+' s of trace against '+(PROTOCOL.blockS+practiceRoadS)+
            ' s needed — a '+PROTOCOL.blockS+' s data stretch and a disjoint '+practiceRoadS+' s practice stretch')},
    {name:'Disturbance trace installed', ok:!!(DIST && !DIST.meta.surrogate && DIST.meta.inS12Range!==false && distResampledOK(DIST) && traceParamState().matches),
     detail:DIST?(!distResampledOK(DIST)?'The stored trace was resampled by an earlier build, which folded vibration into the playback band (10a) — reinstall it'
       :!traceParamState().matches?'The installed trace was band-limited with different edges from the current parameters and its source is not retained — reinstall it'
       :DIST.meta.surrogate?'A surrogate is installed — not permitted in a study session'
       :(DIST.meta.name+' · τ='+DIST.meta.correlationTimeS+' s spectral, centroid '+
         (DIST.meta.spectral?DIST.meta.spectral.centroidHz:'—')+' Hz'+
         (DIST.meta.inS12Range?' (within the S1.2 range, tolerance '+(P('s12ToleranceFrac')*100).toFixed(0)+'%)'
                              :' — OUTSIDE the S1.2 measured range'))):'Study 1 lateral-acceleration trace required (§1.2)'},
    {name:'Session arithmetic closes', ok:arith.closes,
     detail:arith.nominalS+' s nominal against '+arith.requiredS+' s required (Standing Rules 12 and 20)'},
    /* §8.6 sized the 3-minute history-gap window on "≈9 pairs per window".
       The realised schedule delivers about 7.5. That is a 17% shortfall on
       the count the window length and the power derivation both rest on, so
       it blocks a study session until a re-derivation exists and is
       referenced. A note in an export is not a re-derivation. */
    {name:'History-gap power re-derived at the realised pair count',
     ok: !!(S.setup.gapPowerRef && S.setup.gapPowerDate && S.setup.gapPowerDate<=td
            && (!pDate || S.setup.gapPowerDate<=pDate)),
     detail: !S.setup.gapPowerRef||!S.setup.gapPowerDate
       ? ('§8.6 assumed '+PROTOCOL.gapPairsAssumed+' pairs per 3-min window; this schedule delivers '+
          dens.inductionPairsPerGapWindow+'. A logbook reference for the re-derivation at the realised count is required before collection (Standing Rule 19)')
       : (S.setup.gapPowerDate>td ? 'Re-derivation date '+S.setup.gapPowerDate+' is in the future'
          : (pDate && S.setup.gapPowerDate>pDate
             ? 'Re-derived '+S.setup.gapPowerDate+', after the pre-registration was filed on '+pDate
             : 'Re-derived at '+dens.inductionPairsPerGapWindow+' pairs per window — '+S.setup.gapPowerRef+', '+S.setup.gapPowerDate))},
    {name:'Induction runs the block schedule at constant density', ok:dens.withinFivePercent!==false,
     detail:'Inter-group cycle '+dens.blockMeanGroupCycleS+' s block vs '+dens.inductionMeanGroupCycleS+
       ' s induction ('+(dens.cycleRelativeDifference*100).toFixed(1)+'% apart); pair proportion '+
       dens.blockPairProportion+' vs '+dens.inductionPairProportion+'; '+dens.inductionPairsPerGapWindow+
       ' pairs per 3-min gap window against §8.6\u2019s assumed 9'},
    (()=>{ const ids=identifierScan(); return {name:'No identifiable data collected', ok:ids.ok,
     detail: ids.found.length ? 'Identifier-like field(s) in the session record: '+ids.found.join(', ')
       : 'Session record scanned: no name, contact, date-of-birth or location field; setup holds only '+ids.setupKeys+'. Code is '+(S.code||'derived from the participant number')+' (Appendix C)'}; })(),
    {name:'Testing mode off', ok:!testMode, detail:testMode?'Skip is enabled — no session can be data of record':'Skip disabled'}
  ];
  return {checks, ok:checks.every(c=>c.ok)};
}

function practicePanel(step, st){
  if(st.value) return practiceReviewMarkup(st.value);
  if(!st.started){
    return `<div class="blurb" style="margin-top:0">Three minutes: one minute of the plain task, one with the road disturbance, one with the auditory 2-back. Familiarisation, and a check that the participant can hear the letters. Nothing is tuned here and no gate is scored here — G1 runs on full blocks across the pilot.</div>
    <div class="btnrow" style="margin-bottom:10px"><button class="small" id="au-test">🔊 Test the sound</button></div>
    <div class="note" style="margin-bottom:14px">Headphones or a quiet room. The participant must be able to hear the letters clearly before the load minute starts.</div>
    <div class="btnrow"><button class="primary" id="pr-start" disabled>Start practice</button></div>`;
  }
  return trackMarkup(true, true);
}
/* Practice is familiarisation and an audibility check. It is NOT a G1 test
   and does not render a G1 verdict. G1 requires a realised SDLP-premise
   duration of at least 150 s per block; a 60 s practice segment yields
   about 36 s (32–44 s) once fit windows are excluded, so a 15%-of-the-smaller-
   effect tolerance applied to it would be a verdict on noise. The numbers
   are shown; the judgement is not made here. */
function practiceReviewMarkup(v){
  const seg=v.segments||[];
  const base=seg.find(s=>s.cond==='base'), road=seg.find(s=>s.cond==='road'), load=seg.find(s=>s.cond==='load');
  const inc=(x)=> (x&&base&&base.premise.sdlp) ? +(((x.premise.sdlp-base.premise.sdlp)/base.premise.sdlp)*100).toFixed(1) : null;
  const rows=seg.map(s=>`<div class="sumrow"><span>${esc(CONDITIONS[s.cond].title)}</span><span>SDLP-premise ${s.premise.sdlp} · ${s.premise.durationS} s premise-free</span></div>`).join('');
  const ri=inc(road), li=inc(load);
  const minDur=Math.min.apply(null, seg.map(s=>s.premise.durationS));
  const heard = v.nback && v.nback.stimuli>0;
  return `${rows}
  <div class="sumrow"><span>Change from baseline — road / load</span><span>${ri!=null?ri+'%':'—'} / ${li!=null?li+'%':'—'}</span></div>
  ${v.nback?`<div class="sumrow"><span>2-back stimuli heard · hits</span><span>${v.nback.stimuli} · ${v.nback.hits}/${v.nback.targets}</span></div>`:''}
  ${v.practiceConfirmation ? v.practiceConfirmation.checks.map(c=>`<div class="gate"><span class="st ${c.within?'ok':'no'}">${c.within?'OK':'!'}</span><div class="gb"><b>${esc(CONDITIONS[c.cond].title)} confirmed against the pilot target</b>
  <span>${c.increasePct!=null?c.increasePct+'% against a target of '+v.practiceConfirmation.targetIncreasePct+'% (band ±'+v.practiceConfirmation.bandPct+'%). ':'No comparable increase. '}${c.within?'Within band.':'Outside band — logged as a deviation. Nothing is tuned; the session continues as specified.'}</span></div></div>`).join('') : ''}
  <div class="gate" style="margin-top:10px"><span class="st na">i</span><div class="gb"><b>Not a G1 test</b>
  <span>G1 is scored across about six pilot participants on full 300 s blocks with a realised SDLP-premise duration of at least 150 s. The shortest segment here gives ${minDur} s. These figures are familiarisation only and carry no pairwise tolerance; they are recorded, not judged. Parameters are never changed inside a session.</span></div></div>
  <div class="gate"><span class="st ${heard?'ok':'no'}">${heard?'OK':'NO'}</span><div class="gb"><b>Auditory channel confirmed</b>
  <span>${heard?(v.nback.stimuli+' letters delivered by '+v.nback.modality+'. The participant could hear the load minute.'):'No 2-back stimuli were delivered — check the sound before continuing.'}</span></div></div>
  <div class="btnrow" style="margin-top:14px"><button class="primary" id="pr-ok">Recorded — continue</button></div>`;
}
function trackPanel(step, st){ return trackMarkup(CONDITIONS[step.cond] && CONDITIONS[step.cond].load, false); }
/* §1.2: "tracking parameters unchanged". That includes the motor task. v3
   put MATCH inside the same row as ◀ and ▶, which shrank both from about
   half the row to under a third and moved ▶ — a change to the tracking
   task present only in the condition that has to be matched on SDLP.
   The correction row is now identical in every condition and MATCH sits
   on its own row. The running score is gone from data blocks: accuracy
   belongs in the file, not on the screen. isPractice is passed rather than
   read off the engine, because this markup is rendered before engStart. */
function trackMarkup(withLoad, isPractice){
  const showScore = !!isPractice;

    <div class="zonebar"><span id="zone-stat">tracking</span><span id="bump-stat"></span></div>
    ${withLoad?`<div class="nbrow" id="nbrow"><span class="nb-cue" id="nb-cue">listening…</span>${showScore?`<span class="nb-score" id="nb-score">0/0</span>`:''}</div>`:''}
    <div class="holdrow">
      <button class="hold" id="imp-left">◀</button>
      <button class="hold" id="imp-right">▶</button>
    </div>

    <div class="timerbig" id="t-display">--:--</div>

function kssPanel(step){
  return `<div class="blurb" style="margin-top:0">How sleepy do you feel <b>right now</b>?</div>
    <div class="kssdisplay"><span class="kssnum" id="kss-num">–</span></div>
    <div class="kssdesc" id="kss-desc">Move the slider</div>
    <input type="range" class="kssrange" id="kss-slider" min="1" max="9" step="1" value="5">

    ${step.offerBreak?`<div class="note">A break is offered after this rating, not beside it.</div>`:''}`;
}
/* §8.2b "Breaks are offered at phase boundaries." Offered AFTER the rating,
   never before it, for the same reason the PVT break is: the induction-end
   KSS is the input to G2's "KSS rises ≥2 points", and a participant who has
   just rested is not rating the induction. v4 put the offer beside the
   slider with no enforced order. Timed, because this break sits between the
   fatigue induction and the phase where its effect is measured, so its
   length is a covariate on the study's central comparison. */
function kssBreakPanel(step, st){
  const v=st.value||{};
  return `<div class="blurb" style="margin-top:0">Rating recorded — KSS ${v.kss!=null?v.kss:'—'}${v.label?', '+esc(v.label):''}.</div>

    <div class="btnrow" style="margin-top:8px"><button class="small" id="kb-take">Break taken — start timing</button></div>
    <div class="note" id="kb-note">Offered after the rating, not before: this rating is what G2 reads.</div>`;
}
function pvtPanel(){

    <div class="pvtstats">
      <div>Trials<b id="pvt-n">0</b></div><div>Median RT<b id="pvt-med">—</b></div>

    </div>
    <div class="flash" id="pvt-flash">Get ready…</div>
    <div class="timerbig" id="t-display" style="font-size:28px">--:--</div>`;
}
/* §8.2b "Breaks are offered at phase boundaries and completion rate is
   reported." Offered AFTER the phase-end PVT, never before it — a rest
   taken before a vigilance test would change the reading G2 depends on. */
function pvtBreakPanel(step, st){
  const v=st.value||{};
  return `<div class="blurb" style="margin-top:0">PVT complete — median ${v.medianRT!=null?v.medianRT+' ms':'—'}, ${v.lapses} lapse(s).</div>
    <div class="blurb">A break is offered here, at the ${esc(step.offerBreakAfter)} boundary. Whether it is taken or declined is recorded either way.</div>
    <div class="btnrow"><button class="primary" id="pb-skip">No break — continue</button></div>

    <div class="note" id="pb-note">Offered after the PVT, not before: a rest before a vigilance test would change the reading.</div>`;

function breakPanel(step, st){
  return `<div class="blurb" style="margin-top:0">Seated, eyes open, no task. Two minutes, timed against the wall clock — the persistence probe is only interpretable against a known break length.</div>
    <div class="timerbig" id="t-display">${fmtClock(st.remaining!=null?st.remaining:step.dur)}</div>
    <div class="timertarget">runs automatically · realised length is recorded</div>`;
}
function finishPanel(){
  const rows=STEPS.map((s,k)=>{
    const st=S.steps[k];
    const dur=st.startedAt&&st.endedAt?fmtClock((new Date(st.endedAt)-new Date(st.startedAt))/1000):'—';
    return `<div class="sumrow"><span>${esc(s.title)}</span><span>${dur}</span></div>`;
  }).join('');
  const ok=sessionCompletedSuccessfully();
  const mc=manipulationCheck();
  const banner=`<div class="blurb" style="margin-top:0;padding:12px 14px;border-radius:12px;font-weight:600;background:${ok?'var(--c-block-tint)':'var(--warn-tint)'};color:${ok?'var(--accent)':'var(--warn)'}">`
    +(ok?'✓ Session completed':'⚠ Session ended incomplete'+(S.withdrawn?' — withdrawn at '+(S.withdrawnAtPhase||'unknown phase'):''))+`</div>`;
  const g2=`<div class="gate"><span class="st ${mc.result==='induction confirmed'?'ok':(mc.result==='incomplete'?'na':'no')}">G2</span>
    <div class="gb"><b>Manipulation check</b><span>KSS rise ${mc.kssRise!=null?mc.kssRise:'—'} · PVT median Δ ${mc.pvtMedianRtDeltaMs!=null?mc.pvtMedianRtDeltaMs+' ms':'—'} · lapses Δ ${mc.pvtLapseDelta!=null?mc.pvtLapseDelta:'—'} — ${esc(mc.result)}</span></div></div>`;
  const who=S.code?`<div class="blurb" style="margin-top:0">${esc(S.code)} · order ${S.orderIndex+1} of 6</div>`:'';
  return banner+who+g2+rows+`<div class="blurb" style="margin-top:14px">${esc(S.finalized?saveStatusText():'Saving the session file…')}</div>`;
