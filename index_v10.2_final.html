    </div>`).join('');
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="pa-back">←</button><h2>Pilot parameters</h2></div>
    <div class="blurb">${locked?'A study session is running — parameters are read-only. Changing a value mid-study is tuning, and the logbook cannot undo it.':'Set in pilot, then fixed with a date. A threshold chosen after seeing the number is not a threshold (Standing Rule 3).'}</div>
    ${rows}
    ${locked?'':`<div class="btnrow" style="margin-top:12px"><button class="primary" id="pa-fixall">Fix every parameter today</button></div>`}
    <div class="note">Every change is written to the calibration record with the previous value, the new value and the date.</div>`;
  document.getElementById('pa-back').onclick=()=>{ uiView='main'; renderApp(); };
  if(!locked){
    host.querySelectorAll('input.pv').forEach(inp=>{
      inp.onchange=()=>{
        const k=inp.dataset.k, nv=parseFloat(inp.value);
        if(!isFinite(nv)){ inp.value=PARAMS[k].v; return; }
        const old=PARAMS[k].v;
        if(nv===old) return;
        PARAMS[k].v=nv; PARAMS[k].fixedOn=null;
        if(['distRms','distBandLowHz','distBandHighHz'].indexOf(k)>=0) ensureTraceMatchesParams();   // 10.1b
        S.calibration.push({at:nowISO(), param:k, from:old, to:nv, mode:S.mode});
        saveParams(); save(); log('Parameter '+k+' '+old+' → '+nv+' (calibration iteration recorded)');
        renderParamsView();
      };
    });
    host.querySelectorAll('button[data-fix]').forEach(b=>{
      b.onclick=()=>{ const k=b.dataset.fix; PARAMS[k].fixedOn=today();
        S.calibration.push({at:nowISO(), param:k, fixedOn:today(), value:PARAMS[k].v});
        saveParams(); save(); log('Parameter '+k+' fixed at '+PARAMS[k].v+' on '+today()); renderParamsView(); };
    });
    const fa=document.getElementById('pa-fixall');
    if(fa) fa.onclick=()=>{ Object.keys(PARAMS).forEach(k=>{ if(!PARAMS[k].fixedOn) PARAMS[k].fixedOn=today(); });
      saveParams(); log('All parameters fixed on '+today()); renderParamsView(); };
  }
}

/* ══ P0 — COMPUTATIONAL VALIDATION ════════════════════════════════
   Protocol Part 3, P0. Estimators are validated against planted values
   before any real data can be blamed. Run from the menu; results are
   written to the log so the date they were run is on the record. ══ */
function ouSim(lambda, sigma, n, rnd){
  const dt=PROTOCOL.dt, phi=Math.exp(-lambda*dt), out=new Float64Array(n);
  let x=0;
  for(let i=0;i<n;i++){ x=phi*x+sigma*Math.sqrt(dt)*gaussFrom(rnd); out[i]=x; }
  return out;
}
/* Same driving noise, different parameters. Sharing the noise across the
   sigma values is not a shortcut: scaling sigma scales the trajectory
   linearly, so this isolates the sigma → variance mapping from sampling
   error instead of leaving the check at the mercy of it. */
function ouSimOn(lambda, sigma, noise){
  const dt=PROTOCOL.dt, phi=Math.exp(-lambda*dt), out=new Float64Array(noise.length);
  let x=0;
  for(let i=0;i<noise.length;i++){ x=phi*x+sigma*Math.sqrt(dt)*noise[i]; out[i]=x; }
  return out;
}
/* Exponential decay constant fitted to the mean post-displacement
   trajectory, bounded and censored at the analysis window. Part 4:
   unbounded exponential fitting diverges on slow decays — constrain and
   censor, and report the censoring rate. Amplitude is profiled out, so
   only tau is searched. */
function fitTau(mean, dt, winS){
  const n=Math.min(mean.length, Math.round(winS/dt));
  const lo=0.05, hi=winS;
  /* v10: the same least-squares criterion, computed in one pass. The
     profiled residual sum of squares is syy - sxy^2/sxx, and exp(-i dt/tau)
     is a geometric sequence. Against v9's two-pass form it agrees to within
     3e-7 relative on 3,000 planted cases, with identical censoring, and runs
     about 100x faster — which is what lets P0 run the checks the protocol
     lists at the sample sizes they need. */
  let syy=0; for(let i=0;i<n;i++) syy+=mean[i]*mean[i];
  const sse=(tau)=>{
    const r=Math.exp(-dt/tau); let b=1, sxy=0, sxx=0;
    for(let i=0;i<n;i++){ sxy+=b*mean[i]; sxx+=b*b; b*=r; }
    return sxx>0 ? syy-sxy*sxy/sxx : syy;
  };
  let a=Math.log(lo), b=Math.log(hi);
  const gr=(Math.sqrt(5)-1)/2;
  let c=b-gr*(b-a), d=a+gr*(b-a), fc=sse(Math.exp(c)), fd=sse(Math.exp(d));
  for(let k=0;k<90;k++){
    if(fc<fd){ b=d; d=c; fd=fc; c=b-gr*(b-a); fc=sse(Math.exp(c)); }
    else { a=c; c=d; fc=fd; d=a+gr*(b-a); fd=sse(Math.exp(d)); }
  }
  const tau=Math.exp((a+b)/2);
  return {tau, lambda:1/tau, censored: tau>=hi*0.995 || tau<=lo*1.005};
}
/* The naive estimator, kept solely so P0 can show what it does to a
   truncated window. Not used anywhere else. */
function fitTauLogLinear(mean, dt, winS){
  const N=Math.min(mean.length, Math.round(winS/dt));
  const xs=[], ys=[];
  for(let i=0;i<N;i++){ if(mean[i]>1e-4){ xs.push(i*dt); ys.push(Math.log(mean[i])); } }
  if(xs.length<10) return null;
  const n=xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
  let sxx=0, sxy=0;
  for(let i=0;i<n;i++){ sxx+=xs[i]*xs[i]; sxy+=xs[i]*ys[i]; }
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  return slope<0 ? -1/slope : null;
}
/* v10 (10g). The P0 list as steps sharing one seeded stream, so a run is
   reproducible and the screen can run them one at a time without freezing
   the page. Each returns {pass, detail}; pass === null is reported, not
   scored: p0 is "reported whichever way the gate falls" (G7), and the
   coverage row is a statement of scope. */
function p0Checks(){
  const rnd=mulberry32(20260924), dt=PROTOCOL.dt;
  /* Mean post-displacement trajectory: the quantity the decay constant is
     actually fitted to. Displacement and residual noise are the study's
     own, so the fit meets the noise floor where it really does. */
  const meanResponse=(tau, nObs, noiseSD, winS, amp)=>{
    const n=Math.round(winS/dt), m=new Float64Array(n), r=Math.exp(-dt/tau);
    for(let t=0;t<nObs;t++){ let x=amp; for(let i=0;i<n;i++){ m[i]+=x+noiseSD*gaussFrom(rnd); x*=r; } }
    for(let i=0;i<n;i++) m[i]/=nObs;
    return m;
  };
  /* The same from caller-drawn noise, so two noise levels share one
     realisation and a comparison isolates sigma from sampling error. */
  const meanFrom=(tau, z, nObs, n, sd, amp)=>{
    const m=new Float64Array(n), r=Math.exp(-dt/tau);
    for(let t=0;t<nObs;t++){ let x=amp; for(let i=0;i<n;i++){ m[i]+=x+sd*z[t*n+i]; x*=r; } }
    for(let i=0;i<n;i++) m[i]/=nObs;
    return m;
  };
  const lamAC=a=>{ const ac=lag1(a); return ac>0&&ac<1 ? -Math.log(ac)/dt : null; };
  const erf=x=>{ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
    return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x)); };
  /* The induction's own window grid, and the G7 classifier exactly as S2.15
     specifies it: index = max standardised SDLP - final standardised SDLP,
     counted when it exceeds the 95th percentile of a 1,000-fold
     block-permutation surrogate of the same series. Standardising against
     the observed baseline is one affine map applied to the series and to
     every permutation of it, so it cannot change the verdict and is
     omitted. Blocks are window/stride long: the span one window overlaps. */
  const gW=Math.floor((PROTOCOL.inductionS-PROTOCOL.inductionWindowS)/PROTOCOL.inductionStrideS)+1;
  const gRho=Math.max(0, 1-PROTOCOL.inductionStrideS/PROTOCOL.inductionWindowS);
  const gB=Math.max(1, Math.round(PROTOCOL.inductionWindowS/PROTOCOL.inductionStrideS));
  const gBlocks=[]; for(let s=0;s<gW;s+=gB) gBlocks.push([s, Math.min(gW, s+gB)]);
  const gOrd=new Int32Array(gBlocks.length), gBuf=new Float64Array(gW);
  const nmIndex=a=>{ let mx=-Infinity; for(let k=0;k<gW;k++) if(a[k]>mx) mx=a[k]; return mx-a[gW-1]; };
  const arSeries=shape=>{ const y=new Float64Array(gW); let p=gaussFrom(rnd);
    for(let k=0;k<gW;k++){ p=gRho*p+Math.sqrt(1-gRho*gRho)*gaussFrom(rnd); y[k]=p+(shape?shape(k/(gW-1)):0); } return y; };
  const flaggedNonMonotonic=(y, nPerm)=>{
    const obs=nmIndex(y), sur=new Float64Array(nPerm);
    for(let q=0;q<nPerm;q++){
      for(let i=0;i<gOrd.length;i++) gOrd[i]=i;
      for(let i=gOrd.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const x=gOrd[i]; gOrd[i]=gOrd[j]; gOrd[j]=x; }
      let pos=0; for(let i=0;i<gOrd.length;i++){ const [a,b]=gBlocks[gOrd[i]]; for(let k=a;k<b;k++) gBuf[pos++]=y[k]; }
      sur[q]=nmIndex(gBuf);
    }
    sur.sort();
    return obs>sur[Math.floor(0.95*nPerm)];
  };
  const pct=v=>(v*100).toFixed(0)+'%';
  const pause=()=>new Promise(r=>setTimeout(r,0));   // 10.1e. Yield to the page; the seeded order is unchanged.
  return [
  {name:'Planted λ recovered', run:()=>{
    const trueTau=0.5556, trials=3000;
    const fit1=fitTau(meanResponse(trueTau, trials, 0.06, 3.0, P('pertAmp')), dt, 3.0);
    const err=Math.abs(fit1.lambda-1/trueTau)/(1/trueTau)*100;
    return {pass:err<2, detail:'true λ '+(1/trueTau).toFixed(3)+' → '+fit1.lambda.toFixed(4)+' ('+err.toFixed(2)+'% error; criterion <2%)'+(fit1.censored?' — CENSORED at the window':'')};
  }},
  {name:'Variance exchange rate (Rule 25)', run:()=>{
    /* Standing Rule 25: a k-fold variance ratio is a k-fold apparent
       stability loss; the squaring applies only to a sigma ratio. Checked
       on both sides, sigma up and lambda down, on shared driving noise. */
    const LS=60*7200, noise=new Float64Array(LS);
    for(let i=0;i<LS;i++) noise[i]=gaussFrom(rnd);
    const v1=variance(ouSimOn(1.0,1.0,noise)), v2=variance(ouSimOn(1.0,2.0,noise)), v3=variance(ouSimOn(1.0,3.0,noise));
    const vL=variance(ouSimOn(0.25,1.0,noise));
    const r2=v2/v1, r3v=v3/v1, rL=vL/v1;
    return {pass:Math.abs(r2-4)<0.4 && Math.abs(r3v-9)<0.9 && Math.abs(rL-4)<0.4,
      detail:'σ×2 → Var×'+r2.toFixed(2)+' (theory 4); σ×3 → Var×'+r3v.toFixed(2)+' (theory 9); λ÷4 → Var×'+rL.toFixed(2)+' (theory 4). A 2× disturbance increase reproduces the variance signal of a 4× stability loss. A k-fold variance ratio is a k-fold apparent stability loss — the squaring applies only to a σ ratio.'};
  }},
  {name:'Coloured forcing drives the AC(1)-implied λ down (§4.2)', run:()=>{
    /* v9 band-limited the OU OUTPUT, which smooths any series and is not the
       protocol's test. §4.2: λ fixed, the FORCING coloured. λ = 2.0 s^-1 is
       §4.2's human correction rate at this study's 60 Hz. */
    const lam=2.0, phi=Math.exp(-lam*dt), N=60*600, wn=new Float32Array(N);
    for(let i=0;i<N;i++) wn[i]=gaussFrom(rnd);
    const drive=f=>{ const x=new Float64Array(f.length); let s=0; for(let i=0;i<f.length;i++){ s=phi*s+f[i]; x[i]=s; } return x; };
    const lw=lamAC(drive(wn)), lc=lamAC(drive(bandLimit(wn, 0.05, 1.0)));
    const okW = lw!=null && Math.abs(lw-lam)/lam<0.05;
    return {pass: okW && lc!=null && lw/lc>=10,
      detail:'λ fixed at '+lam.toFixed(1)+' s⁻¹. White forcing: AC(1) implies '+(lw!=null?lw.toFixed(3):'—')+' s⁻¹, so the identity holds. Forcing band-limited to 0.05–1.0 Hz: '+(lc!=null?lc.toFixed(3):'—')+' s⁻¹, '+((lw&&lc)?(lw/lc).toFixed(1):'—')+'× lower with λ unchanged (criterion ≥10×; §4.2 simulates 0.16 at a 1 Hz bandwidth).'};
  }},
  {name:'History gap recovered; 3.0 s censoring quantified (S2.14)', run:()=>{
    /* At the study's own counts, 10 quiet- and 8 recent-history per cell, so
       the shrinkage factor is the one the power re-derivation needs. */
    const gapAt=(win)=>{
      const quietTau=1.06, recentTau=2.01, noise=0.06, reps=200;
      let acc=0, n=0, cens=0;
      for(let r=0;r<reps;r++){
        const q=fitTau(meanResponse(quietTau, 10, noise, win, P('pertAmp')), dt, win);
        const c=fitTau(meanResponse(recentTau, 8, noise, win, P('pertAmp')), dt, win);
        if(q.censored||c.censored) cens++;
        acc += (c.tau-q.tau)/q.tau; n++;
      }
      return {gap:acc/n, censoredRate:cens/reps};
    };
    const gFull=gapAt(8.0), g3=gapAt(3.0);
    const shrink=(gFull.gap&&g3.gap)? g3.gap/gFull.gap : null;
    return {pass: g3.gap>0 && shrink!=null && shrink<=1.05,
      detail:'planted +90%: unrestricted window '+(gFull.gap*100).toFixed(0)+'%, common 3.0 s window '+(g3.gap*100).toFixed(0)
        +'%; shrinkage factor '+(shrink!=null?shrink.toFixed(2):'—')+'; censoring rate '+(g3.censoredRate*100).toFixed(0)
        +'% at 3 s, '+(gFull.censoredRate*100).toFixed(0)+'% unrestricted. Power is re-derived at this window below.'};
  }},
  {name:'Unequal windows manufacture a gap; the common window does not (§8.2a-i)', run:()=>{
    /* Plant NO gap, then fit each history over the window that would be
       available to it: P1 three seconds, P2 six. Two estimators, because
       which one is used matters more than the window does. */
    const tau=1.06, noise=0.06, reps=200;
    let nB=0, cB=0, nL=0, cL=0;
    for(let r=0;r<reps;r++){
      const m_q3=meanResponse(tau, 10, noise, 3.0, P('pertAmp'));
      const m_r6=meanResponse(tau, 8, noise, 6.0, P('pertAmp'));
      const m_r3=meanResponse(tau, 8, noise, 3.0, P('pertAmp'));
      const q3=fitTau(m_q3, dt, 3.0).tau, r6=fitTau(m_r6, dt, 6.0).tau, r3=fitTau(m_r3, dt, 3.0).tau;
      nB+=(r6-q3)/q3; cB+=(r3-q3)/q3;
      const lq3=fitTauLogLinear(m_q3, dt, 3.0), lr6=fitTauLogLinear(m_r6, dt, 6.0), lr3=fitTauLogLinear(m_r3, dt, 3.0);
      if(lq3&&lr6&&lr3){ nL+=(lr6-lq3)/lq3; cL+=(lr3-lq3)/lq3; }
    }
    const u={naiveBounded:nB/reps, commonBounded:cB/reps, naiveLog:nL/reps, commonLog:cL/reps};
    return {pass: Math.abs(u.commonBounded)<0.05 && Math.abs(u.commonLog)<Math.abs(u.naiveLog),
      detail:'with NO true gap planted. Naive log-linear fit: unequal windows (P1 3 s, P2 6 s) return '
        +(u.naiveLog*100).toFixed(0)+'% — a gap manufactured entirely by the schedule — against '
        +(u.commonLog*100).toFixed(0)+'% at the common window. Bounded amplitude-profiled fit: '
        +(u.naiveBounded*100).toFixed(1)+'% and '+(u.commonBounded*100).toFixed(1)
        +'%. The common window is the protection; the estimator choice is a second one, and both are needed.'};
  }},
  {name:'Gap estimator insensitive to σ alone (S2.14)', run:()=>{
    /* Protocol Part 3: "confirm the gap estimator is insensitive to a change
       in σ alone". Both noise levels share one noise realisation, scaled. */
    const n=Math.round(PROTOCOL.fitWindowS/dt), reps=200, amp=P('pertAmp'), W=PROTOCOL.fitWindowS;
    const run=(q, r)=>{ let a1=0, a2=0;
      for(let k=0;k<reps;k++){
        const zq=new Float64Array(10*n), zr=new Float64Array(8*n);
        for(let i=0;i<zq.length;i++) zq[i]=gaussFrom(rnd);
        for(let i=0;i<zr.length;i++) zr[i]=gaussFrom(rnd);
        const g=sd=>{ const fq=fitTau(meanFrom(q,zq,10,n,sd,amp),dt,W).tau, fr=fitTau(meanFrom(r,zr,8,n,sd,amp),dt,W).tau; return (fr-fq)/fq; };
        a1+=g(0.06); a2+=g(0.12);
      }
      return [a1/reps, a2/reps]; };
    const [z1,z2]=run(1.06,1.06), [g1,g2]=run(1.06,2.01);
    return {pass: Math.abs(z1)<0.05 && Math.abs(z2)<0.05 && Math.abs(g2-g1)<0.05,
      detail:'Zero gap planted: '+(z1*100).toFixed(1)+'% at σ, '+(z2*100).toFixed(1)+'% at 2σ. +90% planted: '+(g1*100).toFixed(1)+'% at σ, '+(g2*100).toFixed(1)+'% at 2σ. Doubling the disturbance moves the estimate '+(Math.abs(g2-g1)*100).toFixed(1)+' points and manufactures no gap (criterion under 5 points each), at the common 3.0 s window with 10 quiet and 8 recent observations on one shared noise realisation.'};
  }},
  {name:'First passage inverts under rising disturbance and cancels when both change (§5)', run:()=>{
    const T=1000;
    const fpt=(lam,sig)=>{ let tot=0; const ph=Math.exp(-lam*dt), sq=sig*Math.sqrt(dt);
      for(let t=0;t<T;t++){ let x=3.0,i=0; while(x>1.5 && i<60*60){ x=ph*x+sq*gaussFrom(rnd); i++; } tot+=i*dt; }
      return tot/T; };
    const b=fpt(0.08,1.0), s2=fpt(0.08,2.0), l2=fpt(0.04,1.0), both=fpt(0.04,2.0);
    return {pass: s2<b && l2>b && Math.abs(both/b-1)<0.10,
      detail:'Mean first passage from 3.0 to 1.5 over '+T+' trials per cell: baseline '+b.toFixed(1)+' s; σ×2 '+s2.toFixed(1)+' s ('+(((s2-b)/b)*100).toFixed(0)+'%, the inversion); λ÷2 '+l2.toFixed(1)+' s; both '+both.toFixed(1)+' s ('+(((both-b)/b)*100).toFixed(0)+'%, a null made of two real effects, while the decay constant doubles by construction). Criterion: inversion present and cancellation within 10%. v9 checked the inversion only.'};
  }},
  {name:'Classifier false-positive rate p₀ (G7a)', run:async()=>{
    const TR=1000, NP=1000; let f=0;
    for(let t=0;t<TR;t++){ if(flaggedNonMonotonic(arSeries(null), NP)) f++; if(t%25===24) await pause(); }
    return {pass:null, detail:'p₀ = '+(f/TR).toFixed(3)+' on '+TR+' flat noisy trajectories on the induction\u2019s own grid ('+gW+' windows of '+PROTOCOL.inductionWindowS+' s at a '+PROTOCOL.inductionStrideS+' s stride, adjacent-window correlation '+gRho.toFixed(2)+'), each against its own '+NP+'-fold block-permutation surrogate ('+gB+'-window blocks), as S2.15 specifies. Reported whichever way G7 falls: the qualifying proportion must exceed p₀ + 0.10. A sensitivity check is not a specificity check; the next row is the sensitivity check.'};
  }},
  {name:'Shape classifier sensitivity (S2.15)', run:async()=>{
    /* Protocol Part 3: "confirm the shape classifier correctly labels
       planted monotonic, non-monotonic and flat trajectories". The planted
       non-monotonic shape is §6.5b's own prediction — rolling SDLP "rises,
       then partially recovers" — here to 3 SD at 55% of the induction and
       back to 1 SD by the end. Full recovery and a larger rise are planted
       alongside so the failure mode is measured rather than asserted. */
    const NS=100, NP=1000;
    const rise=(A,pk,endFrac)=>u=> u<=pk ? A*u/pk : A-A*(1-endFrac)*(u-pk)/(1-pk);
    const rate=async shape=>{ let f=0; for(let t=0;t<NS;t++){ if(flaggedNonMonotonic(arSeries(shape), NP)) f++; if(t%25===24) await pause(); } return f/NS; };
    const flat=await rate(null), mono=await rate(u=>3*u), full=await rate(rise(3,0.5,0)), partial=await rate(rise(3,0.55,1/3)), big=await rate(rise(10,0.55,1/3));
    const pass = partial>=0.80 && full>=0.80 && flat<=0.10 && mono<=0.10;
    return {pass, protocolLevel:!pass,
      detail:'Labelled non-monotonic: flat '+pct(flat)+', monotonic rise '+pct(mono)+', rise then full recovery '+pct(full)+', rise then partial recovery — the shape §6.5b predicts — '+pct(partial)+' at a 3 SD rise and '+pct(big)+' at a 10 SD rise ('+NS+' series each; criterion ≥80% on both planted non-monotonic shapes, ≤10% on flat and monotonic). '+
        (pass ? 'Sensitivity confirmed. '
          : 'The specified classifier cannot see the predicted shape. Under block permutation, max − final is extreme only when the final window is among the lowest in the series, and after a partial recovery the pre-rise windows are lower still, so a larger effect scores no better. G7 as specified would fail on data containing exactly the effect it looks for. A null that keeps the rise — for example, block-permuting the residuals of a monotone (isotonic) fit and adding them back — asks the question §6.5b poses; whichever is chosen must be fixed and pre-registered before the pilot. THIS IS A PROTOCOL-LEVEL DEFECT AND IS NOT REPAIRABLE IN THE RUNNER. ')+
        'The protocol names three shapes but gives a decision rule for one; the monotonic/flat split needs its own rule, fixed before data (Section 0).'};
  }},
  {name:'Departure-criterion false-positive rate p₀ (§8.6)', run:()=>{
    /* §8.6 records "the window at which each measure first departs baseline
       by two standard deviations". Run on flat trajectories with no
       departure planted, at the study's own window and stride. Overlapping
       windows share samples, so the series is built autocorrelated. */
    const winN=Math.floor((PROTOCOL.inductionS-PROTOCOL.inductionWindowS)/PROTOCOL.inductionStrideS)+1;
    const b0=PROTOCOL.gapBaselineRangeS[0], b1=PROTOCOL.gapBaselineRangeS[1];
    const starts=[]; for(let k=0;k<winN;k++) starts.push(k*PROTOCOL.inductionStrideS);
    const baseIdx=starts.map((t,k)=>({t,k})).filter(o=>o.t>=b0 && o.t+PROTOCOL.inductionWindowS<=b1).map(o=>o.k);
    const postIdx=starts.map((t,k)=>({t,k})).filter(o=>o.t>=b1).map(o=>o.k);
    const rho=Math.max(0,1-PROTOCOL.inductionStrideS/PROTOCOL.inductionWindowS);
    let fired=0, sust=0, cross=0; const TRIALS=600;
    for(let t=0;t<TRIALS;t++){
      const y=new Float64Array(winN); let prev=gaussFrom(rnd);
      for(let k=0;k<winN;k++){ prev=rho*prev+Math.sqrt(1-rho*rho)*gaussFrom(rnd); y[k]=prev; }
      const bv=baseIdx.map(k=>y[k]);
      const m=bv.reduce((a,b)=>a+b,0)/bv.length;
      const sd=Math.sqrt(bv.reduce((a,b)=>a+(b-m)*(b-m),0)/(bv.length-1));
      if(!(sd>0)) continue;
      const hits=postIdx.filter(k=>Math.abs((y[k]-m)/sd)>=2);
      cross+=hits.length;
      if(hits.length) fired++;
      for(let i=0;i+1<hits.length;i++) if(hits[i+1]===hits[i]+1){ sust++; break; }
    }
    const p0First=fired/TRIALS, p0Sus=sust/TRIALS;
    return {pass: p0First<=0.10, protocolLevel: p0First>0.10,
      detail:'On flat trajectories with NO departure planted, the §8.6 rule "first departs baseline by two standard deviations" fires in '
        +pct(p0First)+' of series ('+pct(p0Sus)+' for two consecutive windows), with '+(cross/TRIALS).toFixed(1)+' crossings per series. Baseline is '
        +baseIdx.length+' window(s) against '+postIdx.length+' tested. An SD from that few windows of a stationary series understates the spread it is applied to, so the criterion is not a test and a departure time read off it is not evidence. Calibrate it the way G7b calibrates the shape, against a surrogate null built from that participant\u2019s own window series, or report the departure as descriptive only. THIS IS A PROTOCOL-LEVEL DEFECT AND IS NOT REPAIRABLE IN THE RUNNER.'};
  }},
  {name:'Power re-derived at the common 3.0 s window (S2.14)', run:async()=>{
    /* Protocol Part 3: "re-derive the standardised effect and the power at
       the 3 s window. If re-derived power at n = 40 falls below 0.80, the
       perturbation count is raised before collection." Each simulated
       participant carries §6.4's constants (alert 0.55/0.62 s, fatigued
       1.06/2.01 s) scaled by a lognormal factor with 30% spread (S3.9's
       between-participant variability), and the fatigued gap by a second
       30% factor. The statistic is that participant's interaction, fatigued
       gap minus alert gap, fitted as recoveryStats fits it. */
    const amp=P('pertAmp'), NP=200;
    const sim=async win=>{ const v=[];
      for(let p=0;p<NP;p++){ if(p%20===19) await pause();
        const s=Math.exp(0.3*gaussFrom(rnd)), g=Math.exp(0.3*gaussFrom(rnd));
        const qa=0.55*s, ra=0.62*s, qf=1.06*s, rf=qf+(2.01-1.06)*g*s;
        const f=(t,n)=>fitTau(meanResponse(t,n,0.06,win,amp),dt,win).tau;
        v.push((f(rf,8)-f(qf,10))-(f(ra,8)-f(qa,10)));
      }
      const m=v.reduce((a,b)=>a+b,0)/v.length, sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length-1));
      return {m, d:m/sd}; };
    const u=await sim(8.0), c=await sim(PROTOCOL.fitWindowS);
    const power=n=>0.5*(1+erf((c.d*Math.sqrt(n)-1.959964)/Math.SQRT2));
    return {pass: power(40)>=0.80,
      detail:'Interaction (fatigued gap − alert gap), '+NP+' simulated participants per window: unrestricted '+u.m.toFixed(3)+' s (d = '+u.d.toFixed(2)+'); common 3.0 s window '+c.m.toFixed(3)+' s (d = '+c.d.toFixed(2)+', mean shrinkage '+(c.m/u.m).toFixed(2)+'). Power, two-sided α = 0.05, normal approximation: '+power(20).toFixed(3)+' at n = 20, '+power(40).toFixed(3)+' at n = 40 (criterion ≥ 0.80 at n = 40). The model is stated so it can be disputed: §6.4 constants, 30% lognormal spread on level and on the fatigued gap, residual noise 0.06 per sample.'};
  }},
  {name:'Pre-onset velocity exclusion removes a manufactured gap (S2.14)', run:async()=>{
    /* Protocol Part 3: "Plant a zero gap in a controller whose second
       perturbation systematically lands on a still-moving trace, and confirm
       the estimator returns approximately zero after the velocity exclusion
       of S2.14 and a spurious positive gap without it. Report both." Run
       through this runner's own schedule, recoveryStats, preOnsetVelocities
       and premiseVelocityDistribution. */
    const tau=1.06, reps=120, amp=P('pertAmp'), N=Math.round(PROTOCOL.blockS*PROTOCOL.fs), ph=Math.exp(-dt/tau), W=PROTOCOL.fitWindowS;
    const synth=(seed, drift)=>{
      const sch=buildSchedule(PROTOCOL.blockS, seed, {maxGroups:PROTOCOL.groupsPerBlock});
      const add=new Float32Array(N);
      if(drift) sch.onsets.forEach(o=>{ if(o.history!=='recent' || (o.group%2)) return;
        for(let n=o.nIdx-12;n<o.nIdx+60;n++) if(n>=0&&n<N) add[n]+=o.dir*drift*dt; });
      const err=new Float32Array(N); let e=0, k=0;
      for(let n=0;n<N;n++){ e=ph*e+0.016*gaussFrom(rnd)+add[n];
        while(k<sch.onsets.length && n>=sch.onsets[k].nIdx){ e+=sch.onsets[k].dir*amp; k++; } err[n]=e; }
      return {err, onsets:sch.onsets};
    };
    /* recoveryStats' historyGap, computed with the same recoveryTrace,
       meanTrace and fitTau but without its jackknife, so 200 blocks fit in
       the time budget. The per-block gap is noisy (SD about 0.3 s at these
       counts), so "approximately zero" is operationalised as removing at
       least 80% of the manufactured gap, with both values reported with
       their standard errors, rather than as a bare threshold that a small
       run fails by chance. */
    const gapOfSet=(err, onsets)=>{ const q=[], r=[];
      onsets.forEach(o=>{ const t=recoveryTrace(err,o,W); if(t) (o.history==='quiet'?q:r).push(t); });
      if(q.length<2 || r.length<2) return null;
      return fitTau(meanTrace(r),dt,W).tau - fitTau(meanTrace(q),dt,W).tau; };
    const raw=[], exc=[]; let nulls=0, eq=0, er=0, nq=0, nr=0;
    for(let r=0;r<reps;r++){
      if(r%5===4) await pause();
      const base=synth(5000+r, 0), dist=premiseVelocityDistribution(base.err, base.onsets);
      const thr=dist?dist.atConfiguredPctile:Infinity;
      const blk=synth(6000+r, 2.0);
      const pv=preOnsetVelocities(blk.err, blk.onsets);
      const kept=blk.onsets.filter((o,j)=>pv[j].absVelocity!=null && pv[j].absVelocity<=thr);
      pv.forEach(v=>{ const x=!(v.absVelocity!=null && v.absVelocity<=thr); if(v.history==='quiet'){ nq++; if(x) eq++; } else { nr++; if(x) er++; } });
      const a=gapOfSet(blk.err, blk.onsets), b=gapOfSet(blk.err, kept);
      if(a!=null) raw.push(a); else nulls++;
      if(b!=null) exc.push(b); else nulls++;
    }
    const ms=v=>{ if(v.length<2) return {m:null, se:null}; const m=v.reduce((x,y)=>x+y,0)/v.length;
      return {m, se:Math.sqrt(v.reduce((x,y)=>x+(y-m)*(y-m),0)/(v.length-1)/v.length)}; };
    const R=ms(raw), E=ms(exc);
    const pass = R.m!=null && E.m!=null && R.m>0.10 && Math.abs(E.m)<0.2*R.m;
    return {pass,
      detail:'Zero gap planted (τ '+tau+' s in both histories); half the recent-history onsets land on a trace still moving at 2 units/s in the direction of the push. Without the exclusion the history gap reads '+(R.m!=null?R.m.toFixed(3)+' ± '+R.se.toFixed(3):'—')+' s; with it, at the baseline block\u2019s p'+P('preOnsetVelPctile')+', '+(E.m!=null?E.m.toFixed(3)+' ± '+E.se.toFixed(3):'—')+' s (mean ± SE over '+reps+' blocks'+(nulls?', '+nulls+' unfittable':'')+'; criterion: over 0.10 s without the exclusion, and at least 80% of it removed with it). Exclusion removed '+(nq?pct(eq/nq):'—')+' of quiet-history and '+(nr?pct(er/nr):'—')+' of recent-history onsets: differential by construction here, which is why S2.14 requires the rate by history.'};
  }},
  {name:'Disturbance proxy tracks the injected input; a halved λ barely moves it (S2.18)', run:()=>{
    /* Protocol Part 3, required by S2.18: plant a known coloured disturbance
       in a simulated first-order controller, confirm the band-limited proxy
       recovers it, then halve λ with the disturbance unchanged. The
       protocol's recovery tolerance is still a placeholder, so this row
       scores G9's own criteria (R² ≥ 0.8; state share < 20% of the
       road-driven range) in simulation, through makeBandMeter. */
    const N=60*600, white=new Float32Array(N); for(let i=0;i<N;i++) white[i]=gaussFrom(rnd);
    const base=bandLimit(white, P('distBandLowHz'), P('distBandHighHz')), br=rms(base)||1;
    const w=new Float64Array(N); for(let i=0;i<N;i++) w[i]=gaussFrom(rnd)*P('motorNoiseSD');
    const run=(lam,k)=>{ const ph=Math.exp(-lam*dt), mE=makeBandMeter(), mD=makeBandMeter(); let e=0;
      for(let i=0;i<N;i++){ const d=base[i]/br*P('distRms')*k; e=ph*e+d+w[i]; mE.push(e); mD.push(d); }
      return {pe:mE.variance(), pd:mD.variance()}; };
    const ks=[1,2,3,4,Math.sqrt(30)], rs=ks.map(k=>run(2.0,k));
    const xs=rs.map(r=>r.pd), ys=rs.map(r=>r.pe), mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
    let sxy=0,sxx=0,syy=0; xs.forEach((x,i)=>{ sxy+=(x-mx)*(ys[i]-my); sxx+=(x-mx)*(x-mx); syy+=(ys[i]-my)*(ys[i]-my); });
    const R2=(sxx>0&&syy>0)?sxy*sxy/(sxx*syy):0, range=ys[ys.length-1]-ys[0], half=run(1.0,3), ref=rs[2];
    const share=range>0?Math.abs(half.pe-ref.pe)/range:Infinity;
    return {pass: R2>=0.8 && share<0.20,
      detail:'Controller λ 2.0 s⁻¹, injected variance spanning 30× over '+ks.length+' amplitudes. Proxy on the tracked variable ('+P('proxyBandLowHz')+'–'+P('proxyBandHighHz')+' Hz) against injected band variance: R² = '+R2.toFixed(4)+'. Halving λ at a fixed disturbance moves the proxy '+((half.pe-ref.pe)/ref.pe*100).toFixed(1)+'% of its value, '+(share*100).toFixed(1)+'% of the road-driven range (G9\u2019s criteria: R² ≥ 0.8, under 20%). The protocol\u2019s recovery tolerance is still open; fix it before scoring against it.'};
  }},
  {name:'Resampler keeps vibration out of the playback band (10a)', run:()=>{
    const src=100.4, N=Math.round(src*120), x=new Float32Array(N);
    for(let i=0;i<N;i++){ const t=i/src; x[i]=0.1*Math.sin(2*Math.PI*t)+0.1*Math.sin(2*Math.PI*3*t)+Math.sin(2*Math.PI*42*t); }
    const y=resampleTo60(x, src);
    const pw=f=>{ const r=psdBand(y, PROTOCOL.fs, 60, f-0.05, f+0.05, 0.025); return r?r.P.reduce((a,b)=>a+b,0):NaN; };
    const img=pw(1.6)/pw(1.0), band=pw(3.0)/pw(1.0);
    return {pass: img<1e-4 && Math.abs(band-1)<0.01,
      detail:'A 42 Hz vibration tone at ten times the amplitude of 1 Hz and 3 Hz road components, sampled at 100.4 Hz and resampled to 60 Hz. Linear interpolation images it to |40.4 − 42| = 1.6 Hz; here the 1.6 Hz power is '+img.toExponential(1)+' of the 1 Hz power (criterion under 10⁻⁴; v9\u2019s resampler gave 7.9). In-band, 3 Hz against 1 Hz is '+band.toFixed(4)+' (criterion within 1%).'};
  }},
  {name:'P0 items that live outside this runner', run:()=>({pass:null,
    detail:'Protocol Part 3 also requires validation of the S2.17 reversal-rate, steering-entropy and approximate-entropy implementations, the rule-7 conjunction, the S1.3 acceleration-to-position transfer and the S2.4 ARMAX fit. This runner computes none of them, so it cannot validate them; their P0 entries are run and logged where they are implemented, before they touch real data.'})}
  ];
}
async function p0Run(){ const out=[];
  for(const c of p0Checks()){ let r; try{ r=await c.run(); }catch(e){ r={pass:false, detail:'Check threw: '+(e&&e.message||e)}; } out.push(Object.assign({name:c.name}, r)); }
  return out; }

function variance(a){ let m=0; for(let i=0;i<a.length;i++) m+=a[i]; m/=a.length; let s=0; for(let i=0;i<a.length;i++){ const d=a[i]-m; s+=d*d; } return s/(a.length-1); }
let p0Results=null;
function renderP0View(){
  const host=document.getElementById('otherview');
  const scored=p0Results?p0Results.filter(r=>r.pass!==null):[];
  const rows=p0Results? p0Results.map(r=>{ const st=r.pass===null?'na':(r.pass?'ok':'no'), lab=r.pass===null?'i':(r.pass?'OK':'NO');
      return `<div class="gate"><span class="st ${st}">${lab}</span><div class="gb"><b>${esc(r.name)}</b><span>${esc(r.detail)}</span></div></div>`; }).join('')
    : '<div class="empty">Not run in this browser yet.</div>';
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="z-back">←</button><h2>P0 — computational validation</h2></div>
    <div class="blurb">Confirm the estimators recover values deliberately planted, before any real data can be blamed. Protocol Part 3: all checks pass, or work stops. The checks run one at a time; about twenty seconds on a laptop, longer on a phone.</div>
    <div class="btnrow" style="margin-bottom:14px"><button class="primary" id="z-run">Run P0 checks</button></div>
    ${p0Results?`<div class="note" style="margin:0 0 10px">${scored.filter(r=>r.pass).length} of ${scored.length} scored checks passed; ${p0Results.length-scored.length} reported without a verdict.</div>`:''}
    ${rows}
    <div class="note">Results are written to the session log with the date they were run, which is the part that matters.</div>`;
  document.getElementById('z-back').onclick=goMain;
  document.getElementById('z-run').onclick=()=>{
    const b=document.getElementById('z-run'); b.disabled=true;
    const checks=p0Checks(), res=[]; let k=0;
    const next=()=>{
      if(k<checks.length){
        b.textContent='Running '+(k+1)+' of '+checks.length+'…';
        setTimeout(()=>{ Promise.resolve().then(()=>checks[k].run())
          .catch(e=>({pass:false, detail:'Check threw: '+(e&&e.message||e)}))
          .then(r=>{ res.push(Object.assign({name:checks[k].name}, r)); k++; next(); }); }, 30);
        return;
      }
      p0Results=res; recordP0(res);
      const sc=res.filter(r=>r.pass!==null);
      log('P0 checks run — '+sc.filter(r=>r.pass).length+' of '+sc.length+' scored checks passed, '+(res.length-sc.length)+' reported');
      res.forEach(r=>log('P0 · '+r.name+' — '+(r.pass===null?'reported':(r.pass?'pass':'FAIL'))+' — '+r.detail));
      if(uiView==='p0') renderP0View();
    };
    next();
  };
}

/* 10.1g. The last P0 run on this device, kept with the build it ran under so
   the study gate can ask for it. */
function recordP0(res){
  const sc=res.filter(r=>r.pass!==null);
  try{ localStorage.setItem('sh_v16_p0', JSON.stringify({runner:PROTOCOL.runner, at:nowISO(), scored:sc.length,
    passed:sc.filter(r=>r.pass).length, failed:sc.filter(r=>!r.pass).map(r=>({name:r.name, protocolLevel:!!r.protocolLevel}))})); }catch(e){}
}
function p0Status(){
  let rec=null; try{ rec=JSON.parse(localStorage.getItem('sh_v16_p0')||'null'); }catch(e){}
  if(!rec) return {ran:false, ok:false};
  const runnerFails=(rec.failed||[]).filter(f=>!f.protocolLevel), protocolFails=(rec.failed||[]).filter(f=>f.protocolLevel);
  const current=rec.runner===PROTOCOL.runner;
  return {ran:true, current, rec, runnerFails, protocolFails, ok: current && runnerFails.length===0};
}

/* ══ CALIBRATION (G1) ═════════════════════════════════════════════ */
/* The calibration screen computed this and kept it to itself. Factored out
   so the study gate reads the same numbers the screen shows — one G1, not
   two implementations free to drift apart. */
/* 10.2a. What a calibration row was measured under. G1 compares SDLP-premise
   increases and G5 tau precision, so the question is not which build wrote a
   row but whether its premise mask and, for the road cell, the signal the
   participant heard are the ones this build uses. m10 is the v10 premise mask
   (10d) with the band-limited resampler (10a); v10.1 and v10.2 changed
   neither. Rows re-scored from a saved session file are measured under m10
   whatever build recorded them; a road cell recorded before v10 still played
   the folded signal, and no re-scoring changes what a participant heard. */
const MEASUREMENT_BY_RUNNER={'session-runner v10.0':'m10','session-runner v10.1':'m10','session-runner v10.2':'m10'};
function rowMeasurement(r){ return r.measurement || MEASUREMENT_BY_RUNNER[r.runner] || 'pre-m10'; }
function rowStimulus(r){ return r.cell!=='road' ? 'none' : (r.stimulus || (MEASUREMENT_BY_RUNNER[r.runner] ? 'band-limited' : 'linear interpolation')); }
function rowEligibility(r){
  if(rowMeasurement(r)!==PROTOCOL.measurementVersion)
    return {ok:false, why:'measured under the earlier premise definition — re-score its saved session file'};
  if(r.cell==='road' && rowStimulus(r)!=='band-limited')
    return {ok:false, why:'played through the pre-v10 resampler, a different stimulus — re-run the road cell on this build'};
  return {ok:true, why:''};
}
function calibStore(){ let s=[]; try{ s=JSON.parse(localStorage.getItem('sh_v16_calib')||'[]'); }catch(e){} return Array.isArray(s)?s:[]; }
function saveCalibStore(s){ try{ localStorage.setItem('sh_v16_calib', JSON.stringify(s)); return true; }
  catch(e){ deviation('storage','The calibration record could not be written to local storage'); return false; } }
/* One row per participant per cell. An eligible row is never replaced by an
   ineligible one: re-scoring an old file must not erase a v10 road cell. */
function upsertCalib(rows){
  const st=calibStore(); let kept=0;
  rows.forEach(rec=>{ const k=st.findIndex(x=>x.code===rec.code && x.cell===rec.cell);
    if(k<0){ st.push(rec); return; }
    if(rowEligibility(st[k]).ok && !rowEligibility(rec).ok){ kept++; return; }
    st[k]=rec; });
  saveCalibStore(st); return {kept};
}
function g1Status(){
  const all=calibStore(), store=all.filter(r=>rowEligibility(r).ok), excluded=all.filter(r=>!rowEligibility(r).ok);
  const cells=['road','load','fatigue'], agg={}, nCell={};
  cells.forEach(c=>{ const rs=store.filter(r=>r.cell===c);
    agg[c]=rs.length? rs.reduce((a,b)=>a+b.increasePct,0)/rs.length : null;
    nCell[c]=new Set(rs.map(r=>r.code)).size; });
  const pairs=[['road','load'],['road','fatigue'],['load','fatigue']].map(([a,b])=>{
    if(agg[a]==null||agg[b]==null) return {a,b,ok:null};
    const d=Math.abs(agg[a]-agg[b]), sm=Math.min(Math.abs(agg[a]),Math.abs(agg[b]));
    return {a,b,d:+d.toFixed(1), tol:+(0.15*sm).toFixed(1), ok:d<0.15*sm}; });
  const short=store.filter(r=>r.premiseS<PROTOCOL.premiseFloorS).length;
  /* n ≈ 6 is read per cell: each cell's mean has to rest on about six
     participants, which also holds when cells come from different sources. */
  const n=Math.min(nCell.road, nCell.load, nCell.fatigue);
  const exWhy=[...new Set(excluded.map(r=>r.cell+': '+rowEligibility(r).why))];
  return {store, all, excluded, exWhy, agg, nCell, pairs, short, n, cells:store.length,
    passes: n>=6 && short===0 && pairs.every(p=>p.ok===true)};
}
function decodeI16(b64, scale){
  const bin=atob(b64), n=bin.length>>1, out=new Float32Array(n);
  for(let i=0;i<n;i++){ let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8); if(v&0x8000) v-=0x10000; out[i]=v/scale; }
  return out;
}
/* 10.2b. A saved pilot session holds every block's error series and its
   schedule, so G1 and G5 can be re-scored from it under this build's
   definitions instead of being re-run. What re-scoring cannot change is what
   the participant heard: road cells recorded before v10 are carried with
   their numbers and excluded, and the file's played amplitude is compared
   with the distRms it recorded, because before v10.1 a changed distRms was
   never applied to an installed trace. */
function rescoreSessionFile(rec, fileName){
  const out={file:fileName, rows:[], notes:[]};
  if(!rec || !rec.schedule || !Array.isArray(rec.schedule.steps) || !rec.series){ out.notes.push('not a Study 2 session file with stored series'); return out; }
  if(rec.mode!=='pilot'){ out.notes.push('recorded in '+(rec.mode||'unknown')+' mode; G1 is a pilot gate, so only pilot sessions are re-scored'); return out; }
  const code=(rec.participant&&rec.participant.code)||'—';
  const srcRunner=(rec.protocol&&rec.protocol.runner)||'unknown build';
  const bandLimited=!!MEASUREMENT_BY_RUNNER[srcRunner];
  const blockOf=cond=>{ const s=rec.schedule.steps.find(x=>x.kind==='track' && x.condition===cond);
    if(!s) return null; const p=rec.series[s.index]||rec.series[String(s.index)]; return p&&p.error?{s,p}:null; };
  const score=b=>{ const sc=(b.p.codec&&b.p.codec.scale)||1000, err=decodeI16(b.p.error, sc), ons=(b.p.schedule&&b.p.schedule.onsets)||[];
    return {premise:sdlpPremise(err, ons), deployment:sdlpDeployment(err), fitWindow:fitWindowStats(err, ons), recovery:recoveryStats(err, ons),
      playedRms: b.p.disturbance ? rms(decodeI16(b.p.disturbance, sc)) : null}; };
  const base=blockOf('base');
  if(!base){ out.notes.push('no stored baseline block'); return out; }
  const B=score(base);
  if(B.premise.sdlp==null){ out.notes.push('baseline SDLP-premise could not be computed'); return out; }
  [['road','road'],['load','load'],['fatigue','fatBase']].forEach(([cell,cond])=>{
    const b=blockOf(cond); if(!b){ out.notes.push(cell+': no stored block'); return; }
    const V=score(b); if(V.premise.sdlp==null){ out.notes.push(cell+': SDLP-premise could not be computed'); return; }
    const row={at:nowISO(), code, cell, runner:PROTOCOL.runner, measurement:PROTOCOL.measurementVersion,
      stimulus: cell==='road' ? (bandLimited?'band-limited':'linear interpolation') : 'none',
      source:'rescored', sourceFile:fileName, sourceBuild:srcRunner, sourceExportedAt:rec.exportedAt||null,
      increasePct:((V.premise.sdlp-B.premise.sdlp)/B.premise.sdlp)*100,
      deploymentIncreasePct:(V.deployment.mean!=null&&B.deployment.mean)?((V.deployment.mean-B.deployment.mean)/B.deployment.mean)*100:null,
      fitWindowShare:V.fitWindow.shareOfBlockVariance,
      tauRseWorst:V.recovery.g5.worstRse!=null?+V.recovery.g5.worstRse.toFixed(4):null,
      tauQuiet:V.recovery.quiet.tau, tauRecent:V.recovery.recent.tau, premiseS:V.premise.durationS};
    if(cell==='road'){
      /* distRms is the RMS of the whole band-limited trace; one 300 s stretch
         runs a few percent either side of it, so the exact test is the RMS the
         trace was scaled to at install against the distRms the file records.
         Only when neither record exists is the stretch RMS used, with a
         tolerance wider than stretch-to-stretch variation. */
      const recorded=rec.parameters&&rec.parameters.distRms?rec.parameters.distRms.value:null;
      const bd=(b.s.value&&b.s.value.disturbance)||{};
      const installed = bd.targetRms!=null ? bd.targetRms : (rec.disturbanceTrace&&rec.disturbanceTrace.targetRms!=null ? rec.disturbanceTrace.targetRms : null);
      row.playedStretchRms=V.playedRms!=null?+V.playedRms.toFixed(5):null; row.recordedDistRms=recorded; row.installedTargetRms=installed;
      if(recorded!=null && installed!=null){
        if(Math.abs(installed-recorded)>1e-12)
          out.notes.push('road: the trace was scaled to '+installed+' when it was installed, but the file records distRms '+recorded+
            ' — the participant heard '+installed+', not the recorded value');
      } else if(recorded && V.playedRms!=null){
        const ratio=V.playedRms/recorded;
        if(ratio<0.7 || ratio>1.4)
          out.notes.push('road: the played stretch has RMS '+V.playedRms.toFixed(4)+' against a recorded distRms of '+recorded+' ('+ratio.toFixed(2)+
            'x), far outside how much one stretch varies around the trace RMS, so the recorded amplitude is unlikely to be the one heard');
      }
      if(!bandLimited) out.notes.push('road: recorded by '+srcRunner+', before the resampler fix, so it is carried but excluded from G1 and G5');
    }
    out.rows.push(row);
  });
  return out;
}
function finishRescore(reports){
  const rows=[].concat(...reports.map(r=>r.rows));
  const up=rows.length ? upsertCalib(rows) : {kept:0};
  const ok=rows.filter(r=>rowEligibility(r).ok).length;
  log('Calibration record: '+rows.length+' cell(s) re-scored from '+reports.length+' file(s) under '+PROTOCOL.measurementVersion+
      ', '+ok+' eligible'+(up.kept?'; '+up.kept+' eligible row(s) kept rather than replaced by ineligible ones':''));
  reports.forEach(r=>r.notes.forEach(n=>log('Re-score · '+r.file+' — '+n)));
  const lines=reports.map(r=>'<div class="sumrow"><span>'+esc(r.file)+'</span><span>'+r.rows.length+' cell(s), '+
    r.rows.filter(x=>rowEligibility(x).ok).length+' eligible</span></div>'+
    r.notes.map(n=>'<div class="note" style="margin:2px 4px 8px">'+esc(n)+'</div>').join('')).join('');
  openModal('<h3>Pilot sessions re-scored</h3><p>'+ok+' of '+rows.length+' cell(s) are eligible for G1 and G5 under this build. The details are in the session log.</p>'+lines+
    '<div class="btnrow" style="margin-top:12px"><button class="ghost" id="m-close">Close</button></div>');
  document.getElementById('m-close').onclick=closeModal;
  if(uiView==='calib') renderCalibView();
}
/* 10.2c. The study configuration: dated parameters, the study's ethics,
   pre-registration and power references, the calibration record and the
   last P0 run, in one file, so a study device carries the pilot device's
   dates rather than stamping its own. Checked by FNV-1a on import. */
function studyConfig(){
  let p0=null; try{ p0=JSON.parse(localStorage.getItem('sh_v16_p0')||'null'); }catch(e){}
  const body={kind:'steadyhands-study-config', version:1, runner:PROTOCOL.runner, measurement:PROTOCOL.measurementVersion,
    exportedAt:nowISO(), parameters:paramSnapshot(), study:studySettingsStored(), calibration:calibStore(), p0};
  return Object.assign(body, {fnv1a:hashStr(JSON.stringify(body)).toString(16)});
}
function exportStudyConfig(){
  const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  return saveFile('steadyhands_study_config_'+stamp+'.json', JSON.stringify(studyConfig(),null,1), 'application/json')
    .then(res=>{ log(res.ok ? 'Study configuration saved — parameters, study references, calibration record and P0 status' : 'Study configuration not saved — '+res.reason); return res.ok; });
}
function parseStudyConfig(text){
  let rec; try{ rec=JSON.parse(text); }catch(e){ return {error:'The file is not JSON'}; }
  if(!rec || rec.kind!=='steadyhands-study-config') return {error:'That is not a Steady Hands study configuration file'};
  const {fnv1a, ...body}=rec, h=hashStr(JSON.stringify(body)).toString(16);
  if(h!==fnv1a) return {error:'The configuration failed its integrity check (FNV-1a '+h+', expected '+fnv1a+') — it has been edited since it was saved'};
  return {rec, hash:h};
}
function applyStudyConfig(rec, hash, name){
  let nP=0;
  Object.keys(rec.parameters||{}).forEach(k=>{ if(!PARAMS[k]) return; const x=rec.parameters[k];
    if(typeof x.value!=='number') return; PARAMS[k].v=x.value; PARAMS[k].fixedOn=x.fixedOn||null; nP++;
    S.calibration.push({at:nowISO(), param:k, value:x.value, fixedOn:x.fixedOn||null, importedFrom:name}); });
  saveParams();
  const st=rec.study||{}; STUDY_KEYS.forEach(k=>{ if(typeof st[k]==='string'){ saveStudySetting(k, st[k]); if(!S.startedAt) S.setup[k]=st[k]; } });
  const up=upsertCalib(Array.isArray(rec.calibration)?rec.calibration:[]);
  const p0ok=!!(rec.p0 && rec.p0.runner===PROTOCOL.runner);
  if(p0ok){ try{ localStorage.setItem('sh_v16_p0', JSON.stringify(rec.p0)); }catch(e){} }
  ensureTraceMatchesParams();
  save();
  log('Study configuration imported — '+name+' (FNV-1a '+hash+', saved '+String(rec.exportedAt||'').slice(0,10)+' by '+(rec.runner||'unknown build')+'): '+
      nP+' parameter(s) with their fixed-on dates, study references, '+(rec.calibration||[]).length+' calibration row(s)'+
      (up.kept?' ('+up.kept+' kept)':'')+(p0ok?', P0 status':', P0 status not carried (recorded under another build)'));
}
function importStudyConfig(text, name){
  if(S.mode==='study' && S.startedAt && !S.finalized){
    openModal('<h3>Not during a study session</h3><p>Importing a configuration changes parameters, and a study session is running.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
    document.getElementById('m-close').onclick=closeModal; return; }
  const c=parseStudyConfig(text);
  if(c.error){ deviation('configuration', c.error+' ('+name+')');
    openModal('<h3>Could not load the configuration</h3><p>'+esc(c.error)+'</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
    document.getElementById('m-close').onclick=closeModal; return; }
  const r=c.rec, cal=Array.isArray(r.calibration)?r.calibration:[], el=cal.filter(x=>rowEligibility(x).ok).length;
  const dated=Object.values(r.parameters||{}).filter(x=>x&&x.fixedOn).length;
  openModal('<h3>Load this study configuration?</h3><p>Saved '+esc(String(r.exportedAt||'').slice(0,10))+' by '+esc(r.runner||'unknown build')+'. It replaces this device\u2019s parameters and study references and merges the calibration record.</p>'+
    '<div class="sumrow"><span>Parameters</span><span>'+Object.keys(r.parameters||{}).length+' ('+dated+' dated)</span></div>'+
    '<div class="sumrow"><span>Ethics / pre-registration</span><span>'+esc((r.study&&r.study.ethicsRef)||'—')+' / '+esc((r.study&&r.study.preregRef)||'—')+'</span></div>'+
    '<div class="sumrow"><span>Calibration rows</span><span>'+cal.length+' ('+el+' eligible under this build)</span></div>'+
    '<div class="sumrow"><span>P0</span><span>'+(r.p0?(r.p0.runner===PROTOCOL.runner?'carried':'not carried — other build'):'none')+'</span></div>'+
    '<div class="btnrow" style="margin-top:14px"><button class="primary" id="m-yes">Load</button><button class="ghost" id="m-no">Cancel</button></div>');
  document.getElementById('m-no').onclick=closeModal;
  document.getElementById('m-yes').onclick=()=>{ applyStudyConfig(r, c.hash, name); closeModal(); renderApp(); };
}
function renderCalibView(){
  const host=document.getElementById('otherview');
  const g=g1Status(), g5=g5Status(), cells=['road','load','fatigue'], aggDep={}, aggShare={};
  cells.forEach(c=>{ const rs=g.store.filter(r=>r.cell===c);
    const m=k=>{ const v=rs.map(r=>r[k]).filter(x=>typeof x==='number'); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
    aggDep[c]=m('deploymentIncreasePct'); aggShare[c]=m('fitWindowShare'); });
  const prows=g.pairs.map(p=>`<div class="gate"><span class="st ${p.ok===null?'na':(p.ok?'ok':'no')}">${p.ok===null?'—':(p.ok?'OK':'NO')}</span>
    <div class="gb"><b>${p.a} vs ${p.b} — SDLP-premise</b><span>${p.ok===null?'not enough eligible pilot data':('difference '+p.d+' pp against a tolerance of '+p.tol+' pp')}</span></div></div>`).join('');
  const depRows=cells.map(c=>`<div class="sumrow"><span>${c} — premise / deployment increase (n=${g.nCell[c]})</span><span>${g.agg[c]!=null?g.agg[c].toFixed(1)+'%':'—'} / ${aggDep[c]!=null?aggDep[c].toFixed(1)+'%':'—'}</span></div>
    <div class="sumrow"><span>${c} — residual after premise matching · fit-window variance share</span><span>${(g.agg[c]!=null&&aggDep[c]!=null)?(aggDep[c]-g.agg[c]).toFixed(1)+' pp':'—'} · ${aggShare[c]!=null?aggShare[c].toFixed(3):'—'}</span></div>`).join('');
  const rows=g.all.slice().reverse().slice(0,40).map(r=>{ const el=rowEligibility(r);
    return `<tr><td>${esc(String(r.at||'').slice(0,10))}</td><td>${esc(r.code)}</td><td>${esc(r.cell)}</td><td class="mono">${typeof r.increasePct==='number'?r.increasePct.toFixed(1)+'%':'—'}</td><td class="mono">${r.premiseS!=null?r.premiseS+'s':'—'}</td><td class="mono">${typeof r.tauRseWorst==='number'?r.tauRseWorst.toFixed(2):'—'}</td><td>${el.ok?(r.source==='rescored'?'re-scored':'recorded'):'<span style="color:var(--warn)">excluded</span>'}</td></tr>`; }).join('');
  const short=g.store.filter(r=>r.premiseS<PROTOCOL.premiseFloorS);
  const pilotOnly = S.mode!=='study';
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="cb-back">←</button><h2>G1 — calibration</h2></div>
    <div class="blurb">Can road disturbance, cognitive load and fatigue each be tuned to produce statistically indistinguishable SDLP-premise increases? Scored on the perturbation-free measure, because the probe adds variance to the quantity being matched. Criterion: pairwise difference under 15% of the smaller effect, about six participants per cell, realised SDLP-premise duration ≥ 150 s per block, SDLP-deployment reported alongside and its residual quantified (S2.1b).</div>
    <div class="gate"><span class="st ${g.n>=6?'ok':'na'}">${g.n>=6?'OK':'n='+g.n}</span><div class="gb"><b>Pilot participants per cell</b><span>road ${g.nCell.road}, load ${g.nCell.load}, fatigue ${g.nCell.fatigue} — about six each, eligible rows only</span></div></div>
    ${prows}
    <div class="gate"><span class="st ${g.store.length?(short.length?'no':'ok'):'na'}">${g.store.length?(short.length?'NO':'OK'):'—'}</span>
      <div class="gb"><b>Realised premise duration ≥ ${PROTOCOL.premiseFloorS} s per block</b>
      <span>${g.store.length?(short.length? short.length+' of '+g.store.length+' eligible cells fall below the floor' : 'All '+g.store.length+' eligible cells meet the floor'):'No eligible cells'}</span></div></div>
    <div class="gate"><span class="st ${g5.passes?'ok':(g5.rows?'no':'na')}">G5</span><div class="gb"><b>τ̂ precision, relative SE ≤ 0.45</b><span>${g5.rows?('worst '+g5.worst.toFixed(2)+' over '+g5.rows+' eligible cell(s), n='+g5.n+(g5.failing?'; '+g5.failing+' above 0.45':'')):'No eligible precision records'}</span></div></div>
    <div class="barcard" style="margin-top:14px"><h3>SDLP-deployment alongside, and the residual</h3>${g.store.length?depRows:'<div class="empty">No eligible cells.</div>'}
      <div class="note">The residual is the deployment offset that survives premise matching. Expected positive in the fatigued cell — the probe assists the statistic under criticism, so any advantage the corrected rules show in S3 is a lower bound.</div></div>
    <div class="barcard"><h3>Pilot record</h3>
      ${g.all.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Code</th><th>Cell</th><th class="mono">Premise</th><th class="mono">Dur</th><th class="mono">RSE</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No pilot sessions recorded on this device.</div>'}
      ${g.excluded.length?`<div class="note" style="color:var(--warn)">${g.excluded.length} row(s) excluded — ${esc(g.exWhy.join('; '))}.</div>`:''}
      <div class="btnrow" style="margin-top:10px"><button class="small" id="cb-add" ${pilotOnly?'':'disabled'}>Add this session\u2019s cells</button><button class="small" id="cb-rescore">Re-score saved pilot session files</button></div>
      <div class="btnrow" style="margin-top:8px"><button class="small warn" id="cb-clear">Clear the record</button></div>
      ${pilotOnly?'':'<div class="note">G1 is a pilot gate. A study session cannot be added to the calibration record.</div>'}
      <div class="note">Re-scoring reads the error series and schedule stored in each pilot session file and computes its cells under this build\u2019s definitions. Load and fatigue carry over from any build. A road cell carries over only from v10 onward, because before that the participant heard a different signal.</div></div>
    <div class="note">The stopping rule and the iteration cap are pre-registered, not decided here. This screen records what happened; it does not decide when to stop.</div>`;
  document.getElementById('cb-back').onclick=goMain;
  document.getElementById('cb-rescore').onclick=()=>document.getElementById('rescore-file').click();
  document.getElementById('cb-clear').onclick=()=>{
    openModal('<h3>Clear the calibration record?</h3><p>It holds the evidence G1 and G5 are scored on. Save the study configuration first if you may need it.</p><div class="btnrow"><button class="warn" id="m-yes">Clear</button><button class="ghost" id="m-no">Cancel</button></div>');
    document.getElementById('m-no').onclick=closeModal;
    document.getElementById('m-yes').onclick=()=>{ try{ localStorage.removeItem('sh_v16_calib'); }catch(e){} log('Calibration record cleared'); closeModal(); renderCalibView(); }; };
  const addBtn=document.getElementById('cb-add');
  if(addBtn && pilotOnly) addBtn.onclick=()=>{
    const get=c=>{ const i=STEPS.findIndex(s=>s.k==='track'&&s.cond===c); return i>=0?S.steps[i].value:null; };
    const b=get('base'), r=get('road'), l=get('load'), f=get('fatBase');
    if(!b||!b.premise||b.premise.sdlp==null){ openModal('<h3>Nothing to add</h3><p>The baseline block has not produced an SDLP-premise value yet.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>'); document.getElementById('m-close').onclick=closeModal; return; }
    const add=(cell,v)=>{ if(!v||!v.premise||v.premise.sdlp==null) return null;
      const dep=(v.deployment&&v.deployment.mean!=null&&b.deployment&&b.deployment.mean)?((v.deployment.mean-b.deployment.mean)/b.deployment.mean)*100:null;
      return {at:nowISO(), code:S.code||'—', cell, runner:PROTOCOL.runner, measurement:PROTOCOL.measurementVersion,
        stimulus: cell==='road'?'band-limited':'none', source:'recorded',
        increasePct:((v.premise.sdlp-b.premise.sdlp)/b.premise.sdlp)*100, deploymentIncreasePct:dep,
        fitWindowShare:v.fitWindow?v.fitWindow.shareOfBlockVariance:null,
        tauRseWorst:(v.recovery&&v.recovery.g5.worstRse!=null)?+v.recovery.g5.worstRse.toFixed(4):null,
        tauQuiet:(v.recovery&&v.recovery.quiet)?v.recovery.quiet.tau:null, tauRecent:(v.recovery&&v.recovery.recent)?v.recovery.recent.tau:null,
        premiseS:v.premise.durationS,
        installedTargetRms: (cell==='road'&&v.disturbance&&v.disturbance.targetRms!=null)?v.disturbance.targetRms:null}; };
    const recs=[add('road',r), add('load',l), add('fatigue',f)].filter(Boolean);
    upsertCalib(recs);
    log('Calibration record updated — '+recs.length+' cell(s) for '+(S.code||'—'));
    renderCalibView();
  };
}

/* ══ TRACE VIEWER ═════════════════════════════════════════════════ */
let traceRows=[], traceInduction=[];
function renderAnalyze(){
  const host=document.getElementById('otherview');
  const conds=['base','road','load','removal','fatBase','fatRoad','persist'];
  const summary=conds.map(c=>{
    const rs=traceRows.filter(r=>r.cond===c);
    const avg=k=>rs.length?rs.reduce((a,b)=>a+(b[k]||0),0)/rs.length:null;
    return {c, premise:avg('premise'), deploy:avg('deploy'), n:rs.length};
  }).filter(s=>s.n>0);
  const maxV=Math.max(0.01, ...summary.flatMap(s=>[s.premise,s.deploy]).filter(v=>v!=null));
  const bars=summary.map(s=>`
    <div class="barrow"><div class="lbl"><span>${esc(CONDITIONS[s.c]?CONDITIONS[s.c].title:s.c)} · premise (${s.n})</span><span>${s.premise!=null?s.premise.toFixed(4):'—'}</span></div>
      <div class="bartrack"><div class="barfill" style="width:${s.premise!=null?(s.premise/maxV*100):0}%; background:var(--c-block)"></div></div></div>
    <div class="barrow"><div class="lbl"><span>${esc(CONDITIONS[s.c]?CONDITIONS[s.c].title:s.c)} · deployment</span><span>${s.deploy!=null?s.deploy.toFixed(4):'—'}</span></div>
      <div class="bartrack"><div class="barfill" style="width:${s.deploy!=null?(s.deploy/maxV*100):0}%; background:var(--c-probe); opacity:.7"></div></div></div>`).join('');
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="a-back">←</button><h2>Trace</h2></div>
    <div class="blurb">Load session .json files to see SDLP both ways and the induction's 1-minute trajectory. This is a look, not an analysis — the analysis runs on the deposited files.</div>
    <div class="btnrow" style="margin-bottom:16px"><button class="primary" id="a-load">Load files</button><button class="ghost" id="a-clear">Clear</button></div>
    ${traceInduction.length?`<div class="barcard"><h3>Induction SDLP, 1-minute windows</h3>
      <div class="trackwrap" style="padding:8px"><canvas id="trace-canvas" height="150"></canvas></div>
      <div class="figlegend">${traceInduction.map((s,i)=>`<span><i style="background:${cssvar(['--c-block','--c-probe','--c-assess','--c-break','--c-flow'][i%5])}"></i>${esc(s.code)}</span>`).join('')}</div>
      <div class="caption">Never averaged across participants (Standing Rule 16).</div></div>`:''}
    <div class="barcard"><h3>SDLP by condition</h3>${summary.length?bars:'<div class="empty">No sessions loaded.</div>'}</div>`;
  document.getElementById('a-back').onclick=goMain;
  document.getElementById('a-clear').onclick=()=>{ traceRows=[]; traceInduction=[]; renderAnalyze(); };
  document.getElementById('a-load').onclick=()=>document.getElementById('analyze-file').click();
  if(traceInduction.length) drawTrace(document.getElementById('trace-canvas'), traceInduction);
}
function ingestSession(rec){
  if(!rec || !rec.schedule || !Array.isArray(rec.schedule.steps)) return 0;
  const code=(rec.participant&&rec.participant.code)||'—';
  let n=0;
  rec.schedule.steps.forEach(s=>{
    const v=s.value;
    if(v && v.premise && v.premise.sdlp!=null){
      traceRows.push({code, cond:s.condition||v.cond, premise:v.premise.sdlp, deploy:v.deployment?v.deployment.mean:null});
      n++;
    }
    if(v && v.inductionWindows && v.inductionWindows.oneMin)
      traceInduction.push({code, points:v.inductionWindows.oneMin.map(w=>({t:w.tStartS, sdlp:w.sdlpPremise!=null?w.sdlpPremise:w.sdlpDeployment}))});
  });
  return n;
}
function drawTrace(canvas, series){
  if(!canvas) return;
  const w=canvas.clientWidth||300, h=150;
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const all=series.flatMap(s=>s.points).filter(p=>p.sdlp!=null);
  if(!all.length) return;
  const maxT=Math.max(...all.map(p=>p.t))||1, maxV=Math.max(0.01,...all.map(p=>p.sdlp));
  const pal=['--c-block','--c-probe','--c-assess','--c-break','--c-flow'];
  ctx.strokeStyle=cssvar('--card3'); ctx.beginPath(); ctx.moveTo(0,h-10); ctx.lineTo(w,h-10); ctx.stroke();
  series.forEach((s,si)=>{
    const pts=s.points.filter(p=>p.sdlp!=null);
    if(!pts.length) return;
    ctx.beginPath(); ctx.strokeStyle=cssvar(pal[si%pal.length]); ctx.lineWidth=2;
    pts.forEach((p,i)=>{ const x=(p.t/maxT)*w, y=(h-14)-(p.sdlp/maxV)*(h-24); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
  });
}

/* ══ MODAL / MENU ═════════════════════════════════════════════════ */
function openModal(html){ document.getElementById('modal-card').innerHTML=html; document.getElementById('modal').hidden=false; }
function closeModal(){ document.getElementById('modal').hidden=true; }
function showDoneModal(){
  const ok=S.completedSuccessfully;
  const mc=manipulationCheck();
  openModal('<h3>'+(ok?'Session complete':'Session incomplete')+'</h3><p>'
    +(ok?'All steps finished.':'The session ended before all steps were completed'+(S.withdrawn?' — withdrawn at '+esc(S.withdrawnAtPhase||'unknown phase')+'.':'.'))
    +' G2: '+esc(mc.result)+'.</p><p>'+esc(saveStatusText())+'</p>'
    +'<div class="btnrow"><button class="primary" id="m-ok">Close</button></div>');
  document.getElementById('m-ok').onclick=closeModal;
}
function openMenu(){
  const active=!!S.startedAt && S.current<STEPS.length-1 && !S.finalized;
  openModal(`<h3>Menu</h3><div class="sheetlist">
    ${active?`<button class="warn" id="mn-withdraw">✕ Participant stops here</button>`:''}
    <button id="mn-protocol">✓ Protocol conformance</button>
    <button id="mn-params">⚙ Pilot parameters</button>
    <button id="mn-p0">∿ P0 computational validation</button>
    <button id="mn-calib">◎ G1 calibration record</button>
    <button id="mn-cfg-save">⬇ Save study configuration</button>
    <button id="mn-cfg-load">⬆ Load study configuration</button>
    <button id="mn-dist">⬆ Load disturbance trace</button>
    <button id="mn-bundled">⬆ Reinstall the bundled NH trace (r4)</button>
    <button id="mn-surrogate">⚠ Install pilot surrogate disturbance</button>
    <button id="mn-export">⬇ Save session file</button>
    <button id="mn-import">⬆ Load session file</button>
    <button id="mn-analyze">▤ Trace viewer</button>
    <button id="mn-testmode">🧪 Testing mode — skip steps: ${testMode?'ON':'OFF'}</button>
    <button class="warn" id="mn-reset">↺ Reset session</button>
  </div>`);
  const on=(id,fn)=>{ const b=document.getElementById(id); if(b) b.onclick=fn; };
  if(active) on('mn-withdraw',()=>{ closeModal(); confirmWithdraw(); });
  on('mn-protocol',()=>{ closeModal(); uiView='protocol'; renderApp(); });
  on('mn-params',()=>{ closeModal(); uiView='params'; renderApp(); });
  on('mn-p0',()=>{ closeModal(); uiView='p0'; renderApp(); });
  on('mn-calib',()=>{ closeModal(); uiView='calib'; renderApp(); });
  on('mn-cfg-save',()=>{ closeModal(); exportStudyConfig(); });
  on('mn-cfg-load',()=>{ closeModal(); document.getElementById('config-file').click(); });
  on('mn-dist',()=>{ closeModal(); document.getElementById('dist-file').click(); });
  on('mn-bundled',()=>{ closeModal(); installBundledTrace('reinstalled from the menu'); renderApp(); });
  on('mn-surrogate',()=>{ closeModal(); installSurrogate(); renderApp(); });
  on('mn-export',()=>{ closeModal(); exportSession(); });
  on('mn-import',()=>{ closeModal(); document.getElementById('import-file').click(); });
  on('mn-analyze',()=>{ closeModal(); uiView='analyze'; renderApp(); });
  on('mn-testmode',()=>{ testMode=!testMode; try{ localStorage.setItem('sh_v16_testmode', testMode?'1':'0'); }catch(e){}
    log('Testing mode '+(testMode?'enabled':'disabled')); closeModal(); renderApp(); });
  on('mn-reset',()=>{ closeModal(); confirmReset(); });
}
function confirmReset(){
  /* A completed session holds the only copy of every block on this device.
     v7 offered "Save first" and then reset regardless, on a save path that
     cannot tell a written file from a click that silently did nothing. */
  const risky = S.startedAt && !S.saved.fileConfirmed && !S.saved.driveConfirmed;
  if(risky){
    openModal('<h3>Nothing confirmed saved</h3>'+
      '<p>This session has run and no copy is confirmed. Reset clears every stored block on this device and '+
      (S.saved.fileWritten?'a download was attempted at '+esc(String(S.saved.at||'').slice(11,19))+' but the browser cannot confirm the file was written.'
                          :'no file has been written yet.')+'</p>'+
      '<p>Save it, open the file, and confirm it is readable.</p>'+
      '<div class="btnrow"><button class="primary" id="m-save">Save session file</button></div>'+
      '<div class="btnrow" style="margin-top:8px"><button class="small" id="m-confirm">I have opened the file and it is complete</button></div>'+
      '<div class="btnrow" style="margin-top:8px"><button class="ghost" id="m-cancel">Cancel</button></div>');
    document.getElementById('m-save').onclick=()=>exportSession();
    document.getElementById('m-cancel').onclick=closeModal;
    document.getElementById('m-confirm').onclick=()=>{
      S.saved.fileConfirmed=true; save();
      log('Operator confirmed the session file is readable — reset unlocked');
      closeModal(); confirmReset(); };
    return;
  }
  openModal('<h3>Reset session?</h3><p>Clears this session and every stored block on this device.'+
    (S.startedAt?' A copy is confirmed saved.':'')+'</p><div class="btnrow"><button class="ghost" id="m-save">Save again</button><button class="warn" id="m-yes">Reset</button></div>');
  document.getElementById('m-save').onclick=()=>exportSession();
  document.getElementById('m-yes').onclick=()=>{ resetAll(); closeModal(); renderApp(); };
}

/* ── file inputs ────────────────────────────────────────────────── */
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
document.getElementById('menu-btn').onclick=openMenu;
document.getElementById('import-file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rec=JSON.parse(r.result);
      const src=rec.schedule?rec:null;
      if(!src) throw new Error('shape');
      openModal('<h3>Loaded for viewing</h3><p>Session files are read-only here. Use the trace viewer to inspect them; a finished session is not resumed from a file.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
      traceRows=[]; traceInduction=[]; ingestSession(rec); uiView='analyze'; renderApp();
    }catch(err){
      openModal('<h3>Could not load</h3><p>That does not look like a Steady Hands Study 2 session file.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
    }
  };
  r.readAsText(f); e.target.value='';
};
document.getElementById('rescore-file').onchange=e=>{
  const files=Array.from(e.target.files||[]); if(!files.length) return;
  const reports=[]; let done=0;
  files.forEach(f=>{ const r=new FileReader();
    r.onload=()=>{ let rep; try{ rep=rescoreSessionFile(JSON.parse(r.result), f.name); }
      catch(err){ rep={file:f.name, rows:[], notes:['could not be read as a session file']}; }
      reports.push(rep); if(++done===files.length) finishRescore(reports); };
    r.readAsText(f); });
  e.target.value='';
};
document.getElementById('config-file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>importStudyConfig(String(r.result), f.name); r.readAsText(f); e.target.value='';
};
document.getElementById('analyze-file').onchange=e=>{
  const files=Array.from(e.target.files||[]); if(!files.length) return;
  let done=0;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ try{ ingestSession(JSON.parse(r.result)); }catch(err){}
      if(++done===files.length) renderAnalyze(); };
    r.readAsText(f);
  });
  e.target.value='';
};
document.getElementById('dist-file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let samples=null, hz=100, meta={name:f.name};
      if(/\.json$/i.test(f.name)){
        const t=traceFromRecord(JSON.parse(r.result), f.name);
        samples=t.samples; hz=t.hz; meta=t.meta;
      } else {
        const lines=String(r.result).replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
        const head=lines[0].split(',');
        let col=0, start=0;
        if(head.some(h=>isNaN(parseFloat(h)))){
          start=1;
          const idx=head.findIndex(h=>/lat|ay|accel|y/i.test(h.trim()));
          col=idx>=0?idx:0;
        }
        samples=lines.slice(start).map(l=>parseFloat(l.split(',')[col])).filter(v=>isFinite(v));
        /* 10m. Read the rate from a seconds column when there is one; a
           Sensor Logger export runs at about 100.4 Hz, not 100. */
        const tIdx=start ? head.findIndex(h=>/^(seconds_elapsed|time_s|t_s)$/i.test(h.trim())) : -1;
        if(tIdx>=0){
          const ts=lines.slice(start).map(l=>parseFloat(l.split(',')[tIdx])).filter(v=>isFinite(v));
          const dd=[]; for(let k=1;k<ts.length;k++) dd.push(ts[k]-ts[k-1]); dd.sort((a,b)=>a-b);
          const med=dd.length?dd[Math.floor(dd.length/2)]:0;
          if(med>0){ hz=+(1/med).toFixed(2); meta.sourceHzFrom=head[tIdx].trim(); }
        } else { meta.sourceHzFrom='assumed 100 Hz — no seconds column'; }
      }
      if(!samples || !(hz>0) || samples.length/hz<10) throw new Error('too short');
      installDisturbance(Float32Array.from(samples), hz, meta);
      openModal('<h3>Trace installed</h3><p>'+esc(f.name)+' — '+samples.length+' samples at '+hz+' Hz, resampled to 60 Hz, band-limited '
        +P('distBandLowHz')+'–'+P('distBandHighHz')+' Hz and scaled to an RMS of '+P('distRms')+'. Measured correlation time '
        +(DIST.meta.correlationTimeS||'—')+' s (from the '+PROTOCOL.tauBandHz.join('–')+' Hz spectrum; lag-1 is '
        +(DIST.meta.lag1CorrelationTimeS||'—')+' s and is a diagnostic, not the gate)'
        +(DIST.meta.inS12Range?' — inside the S1.2 measured range.':' — OUTSIDE the S1.2 measured range of 0.121–0.443 s.')
        +'</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
      renderApp();
    }catch(err){
      openModal('<h3>Could not read that trace</h3><p>Expected a JSON file with a <code>samples</code> array and an <code>hz</code> field, or a CSV with one column of lateral acceleration. At least 10 seconds of data.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
    }
  };
  r.readAsText(f); e.target.value='';
};

/* ── display refresh measurement, once, at load ─────────────────── */
let measuredHz=null;
(function measureHz(){
  const ts=[]; let k=0;
  const f=(t)=>{ ts.push(t); if(++k<40) requestAnimationFrame(f);
    else{ const d=[]; for(let i=1;i<ts.length;i++) d.push(ts[i]-ts[i-1]);
      d.sort((a,b)=>a-b); const med=d[Math.floor(d.length/2)];
      measuredHz=med>0?+(1000/med).toFixed(1):null;
      if(S.env) { S.env.displayHz=measuredHz; save(); } } };
  requestAnimationFrame(f);
})();

/* ── boot ───────────────────────────────────────────────────────── */
loadParams();
loadDistFromStore();
loadSession();
if(!S.steps.length){ S.seed=(Date.now()^hashStr(String(Math.random())))>>>0; initSteps(); }
else STEPS=buildSteps(S.orderIndex);
if(S.steps[S.current] && S.steps[S.current].status==='locked') S.steps[S.current].status='current';
/* 10.1a/b. A study-ready file carries its own trace: installed when nothing
   is, or when the stored series came from an earlier build's resampler; a
   trace installed under this build is left alone. Then the stored series is
   brought into line with the current parameters. */
if(!DIST || !distResampledOK(DIST))
  installBundledTrace(!DIST ? 'no trace was installed' : 'the stored trace ('+(DIST.meta.name||'unnamed')+') was resampled by an earlier build');
ensureTraceMatchesParams();
if(S.startedAt) startTicker();
renderApp();
</script>
