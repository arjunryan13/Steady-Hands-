/* S2.1b at session level — the residual between cells after SDLP-premise
   matching, which is a cross-condition quantity a single block cannot
   supply. Baseline is the early-phase baseline block. */
function residualS21b(){
  const cells={};
  STEPS.forEach((s,i)=>{ const v=S.steps[i].value;
    if(s.k==='track' && v && v.premise && v.premise.sdlp!=null)
      cells[s.cond]={premise:v.premise.sdlp, premiseDurationS:v.premise.durationS,
        deployment:v.deployment?v.deployment.mean:null,
        fitWindowShare:v.fitWindow?v.fitWindow.shareOfBlockVariance:null}; });
  const b=cells.base;
  const rows=Object.keys(cells).map(c=>{
    const x=cells[c];
    return {cond:c, sdlpPremise:x.premise, sdlpDeployment:x.deployment,
      premiseDurationS:x.premiseDurationS, fitWindowVarianceShare:x.fitWindowShare,
      premiseDeltaFromBaseline: (b&&b.premise)? +((x.premise-b.premise)).toFixed(4) : null,
      deploymentDeltaFromBaseline: (b&&b.deployment!=null&&x.deployment!=null)? +((x.deployment-b.deployment)).toFixed(4) : null,
      residualAfterPremiseMatching: (b&&b.premise&&b.deployment!=null&&x.deployment!=null)
        ? +((x.deployment-b.deployment)-(x.premise-b.premise)).toFixed(4) : null};
  });
  return {baselineCell:'base', rows,
    note:'S2.1b. Residual is the SDLP-deployment offset that survives SDLP-premise matching. Expected positive in the fatigued cell: the probe assists the statistic under criticism, so any advantage the corrected rules show in S3 is a lower bound.'};
}
/* Schedule density, checked rather than asserted. §1.2 requires the pair
   schedule to continue through the induction "at constant density"; the
   quantity that must match is the density inside the sequence, since a
   block is diluted by its lead-in and lead-out. */
/* §1.2: "The same pair schedule continues through the 22-min induction at
   constant density." The quantity actually held constant is the inter-group
   onset cycle and the pair proportion, so that is what is compared. A
   pairs-per-minute ratio computed over each sequence span is NOT comparable
   between them: a 10-group block spans nine inter-group intervals and so
   reads about 5% high, while the induction's many intervals converge on the
   true rate. Comparing those two numbers would fail a schedule that is in
   fact identical. Both are reported; the gate runs on the cycle. */
function meanGroupCycle(sch){
  if(!sch.groups || sch.groups.length<2) return null;
  const f=sch.groups[0].tS, l=sch.groups[sch.groups.length-1].tS;
  return (l-f)/(sch.groups.length-1);
}
function densityCheck(){
  const base=(S.seed^hashStr('densitycheck'))>>>0;
  /* A single 300 s block holds nine jitter draws, so its realised cycle has
     a standard error near 2%. Average across seeds for a stable comparator. */
  let cyc=0, pp=0, ppm=0, reps=200;
  for(let k=0;k<reps;k++){
    const b=buildSchedule(PROTOCOL.blockS, (base+k)>>>0, {maxGroups:PROTOCOL.groupsPerBlock});
    cyc+=meanGroupCycle(b); pp+=b.pairs/b.groups.length; ppm+=b.sequencePairsPerMin;
  }
  const blockCycle=cyc/reps, blockPairProp=pp/reps, blockPPM=ppm/reps;
  const ind=buildSchedule(PROTOCOL.inductionS, base, {});
  const indCycle=meanGroupCycle(ind), indPairProp=ind.pairs/ind.groups.length;
  const relC=Math.abs(indCycle-blockCycle)/blockCycle;
  const relP=Math.abs(indPairProp-blockPairProp)/blockPairProp;
  return {
    blockMeanGroupCycleS:+blockCycle.toFixed(3), inductionMeanGroupCycleS:+indCycle.toFixed(3),
    blockPairProportion:+blockPairProp.toFixed(3), inductionPairProportion:+indPairProp.toFixed(3),
    cycleRelativeDifference:+relC.toFixed(4), pairProportionRelativeDifference:+relP.toFixed(4),
    withinFivePercent: relC<=0.05 && relP<=0.05,
    blockPairsPerMin:+blockPPM.toFixed(3), inductionPairsPerMin:ind.sequencePairsPerMin,
    blockPairsPerGapWindow:+(blockPairProp*(60/blockCycle)*(PROTOCOL.gapWindowS/60)).toFixed(2),
    inductionPairsPerGapWindow:ind.pairsPerGapWindow,
    jitterS:[PROTOCOL.jitterMinS,PROTOCOL.jitterMaxS], pairIntervalS:PROTOCOL.pairIntervalS,
    note:'Gate is on the inter-group cycle and pair proportion. The pairs-per-minute figures are descriptive only: a block reads about 5% high because ten groups span nine intervals, which is an artefact of the measure rather than of the schedule. Pairs per 3-minute window is reported because §8.6 sized that window on an assumed nine.'};
}
function buildExport(){
  const blocks={};
  STEPS.forEach((s,i)=>{ if(s.k==='track'||s.k==='practice'){ const b=getBlock(i); if(b) blocks[i]=b; } });
  const arith=sessionArithmetic(STEPS);
  return {
    protocol:Object.assign({}, PROTOCOL, {conformance:'Study 2 session runner v4.0, built to Analysis Protocol v16 §1.2 and Proposal v16 §8.2–8.2b'}),
    exportedAt:nowISO(),
    mode:S.mode,
    /* Appendix C: "No identifiable data." There is no identifiers block,
       because no identifier is collected. The participant code is a
       function of the participant number and nothing else. */
    identifiability:{containsIdentifiers:false,
      note:'No name, no free-text participant field, no video, audio or biometric identifier is collected at any point. The participant code is derived from the participant number only.'},
    participant:{code:S.code, participantNo:S.setup.participantNo, orderIndex:S.orderIndex, order:ORDERS[S.orderIndex%6]},
    setup:{ethicsRef:S.setup.ethicsRef, ethicsApprovalDate:S.setup.ethicsDate,
           preregistrationRef:S.setup.preregRef, preregistrationDate:S.setup.preregDate,
           operator:S.setup.operator, seed:S.seed,
           gapPowerRederivationRef:S.setup.gapPowerRef, gapPowerRederivationDate:S.setup.gapPowerDate},
    parameters:paramSnapshot(),
    disturbanceTrace:S.dist||null,
    environment:S.env||null,

      index:i, kind:s.k, title:s.title, nominalDurationS:s.dur||0, phase:s.phase||null,
      condition:s.cond||null, boundary:s.boundary||null, point:s.point||null,

      restarts:S.steps[i].restarts||0,
      realisedBreakS:S.steps[i].realisedBreakS!=null?S.steps[i].realisedBreakS:null,
      value:S.steps[i].value}))},
    series:blocks,

    residual:residualS21b(),
    breaksOffered:S.breaks,
    completion:{completedSuccessfully:S.completedSuccessfully, withdrawn:S.withdrawn,
                withdrawnAtPhase:S.withdrawnAtPhase, startedAt:S.startedAt},
    logbook:{log:S.log, deviations:S.deviations, abandonedAnalyses:S.abandoned, calibrationIterations:S.calibration}

}
function exportSession(){
  const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const filename='steadyhands_s2_'+(S.code||'session')+'_'+stamp+'.json';
  return saveFile(filename, JSON.stringify(buildExport(),null,1), 'application/json').then(res=>{
    if(res.ok) log('Session file saved');
    else{
      log('Save failed — '+res.reason);
      openModal('<h3>Could not save</h3><p>'+esc(res.reason)+'</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      const b=document.getElementById('m-close'); if(b) b.onclick=closeModal;
    }
    return res.ok;
  });
}
async function saveToDrive(){
  const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const filename='steadyhands_s2_'+(S.code||'session')+'_'+stamp+'.json';
  const rec=buildExport();
  /* Belt and braces. Nothing leaves this device over the network if an
     identifier block has reappeared — Appendix C is categorical, and an
     upload is the one operation that cannot be undone. */
  if(rec.identifiers || (rec.identifiability && rec.identifiability.containsIdentifiers)){
    deviation('privacy','Upload blocked — the export carried an identifier block');
    log('Upload blocked — saved to this device instead'); exportSession(); return false;
  }
  const content=JSON.stringify(rec,null,1);
  if(!DRIVE_ENDPOINT){ log('Drive endpoint not configured — saved to this device instead'); exportSession(); return false; }
  try{
    const res=await fetch(DRIVE_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({filename,content})});
    const data=await res.json().catch(()=>null);
    if(data && data.ok){ log('Saved to Drive — '+filename); return true; }
    log('Drive save did not confirm — saved to this device as a backup'); exportSession(); return false;
  }catch(err){
    log('Could not reach Drive — saved to this device as a backup'); exportSession(); return false;
  }
}

/* ══ MANIPULATION CHECK (G2) ══════════════════════════════════════
   §1.2: fatigue confirmed by KSS and PVT, never assumed from clock
   time. Computed here so the operator sees it before leaving. ════ */
function manipulationCheck(){
  const kss=[], pvt=[];
  STEPS.forEach((s,i)=>{ const st=S.steps[i];
    if(s.k==='kss' && st.value && st.value.kss!=null) kss.push({boundary:s.boundary, value:st.value.kss, at:st.endedAt});
    if(s.k==='pvt' && st.value) pvt.push({point:s.point, medianRT:st.value.medianRT, lapses:st.value.lapses});
  });
  const first=kss.length?kss[0].value:null;
  const postInduction=(kss.find(k=>k.boundary==='induction-end')||{}).value;
  const kssRise=(first!=null&&postInduction!=null)?postInduction-first:null;
  const p0=pvt.find(p=>p.point==='early-phase-end'), p1=pvt.find(p=>p.point==='session-end');
  const rtDelta=(p0&&p1&&p0.medianRT!=null&&p1.medianRT!=null)?p1.medianRT-p0.medianRT:null;
  const lapseDelta=(p0&&p1)?(p1.lapses-p0.lapses):null;
  const pass = kssRise!=null && kssRise>=2 && rtDelta!=null && (rtDelta>0 || (lapseDelta!=null && lapseDelta>0));

  /* G2 is read four ways, not one. The other three readings turn on what
     disturbance and load did to KSS, which the early-phase ratings already
     hold. PVT is sampled only at the two points §1.2 specifies, so the
     early-phase PVT is a single shared post-condition reading and the
     limitation is stated rather than papered over. */
  const kssAfter=(cond)=>{
    const i=STEPS.findIndex(s=>s.k==='track'&&s.cond===cond);
    if(i<0) return null;
    for(let j=i+1;j<STEPS.length;j++){
      if(STEPS[j].k==='kss'){ const v=S.steps[j].value; return v&&v.kss!=null?v.kss:null; }
      if(STEPS[j].k==='track'&&STEPS[j].cond!=='removal') return null;
    }
    return null;
  };
  const conditionReads=['road','load'].map(c=>{
    const after=kssAfter(c), d=(after!=null&&first!=null)?after-first:null;
    return {condition:c, kssAfterBlock:after, kssDeltaFromStart:d,
      reading: d==null ? 'incomplete'
        : (d>=2 ? 'raises KSS — read against the early-phase PVT: if PVT is also degraded this manipulation is genuinely fatiguing and impure; if PVT is intact this is misattribution and a result (S2.9), not a failure'
                : 'KSS not materially raised by this manipulation')};
  });
  const lateUnmoved = (kssRise!=null && kssRise<2 && rtDelta!=null && rtDelta<=0);

  return {gate:'G2', kssSeries:kss, pvt:pvt, kssRise, pvtMedianRtDeltaMs:rtDelta, pvtLapseDelta:lapseDelta,
    criterion:'Fatigue: KSS rises ≥2 points and PVT degrades',
    result: (kssRise==null||rtDelta==null) ? 'incomplete' : (pass?'induction confirmed':'not confirmed — read four ways, §G2'),
    reads:{
      fatigue:{kssRise, pvtMedianRtDeltaMs:rtDelta, pvtLapseDelta:lapseDelta, meetsCriterion:pass},
      disturbanceAndLoad:conditionReads,
      misattribution:'Raised KSS with an intact PVT is misattribution and a result (S2.9), not a failed manipulation.',
      compensation: lateUnmoved
        ? 'Late blocks unmoved on KSS and PVT. Do NOT score this as a failed induction until the history gap has been read — it may be a compensation stage (S2.15, Standing Rule 15).'
        : 'Not applicable on this session.'
    },
    pvtCoverage:'PVT is sampled at end of early phase and session end only (§1.2), so no per-condition PVT exists by design. The early-phase PVT is the shared post-condition reading for both disturbance and load.',
    note:'Read four ways, never pass/fail. Ground truth is KSS/PVT, never the condition label (Standing Rule 6).'};
}

function studyGate(){
  const n=parseInt(S.setup.participantNo,10);
  const td=today();
  const eDate=S.setup.ethicsDate, pDate=S.setup.preregDate;
  const ethicsOK = !!(S.setup.ethicsRef && eDate && eDate<=td);
  const preregOK = !!(S.setup.preregRef && pDate && pDate<=td);
  const numOK = n>=1 && n<=PROTOCOL.participantMax;
  /* Standing Rule 3: a threshold chosen after seeing the number is not a
     threshold. Fixing a parameter on the day of a study session, or after
     the pre-registration was filed, defeats the date. */
  const lateParams = pDate ? Object.keys(PARAMS).filter(k=>PARAMS[k].fixedOn && PARAMS[k].fixedOn>pDate) : [];
  const arith=sessionArithmetic(buildSteps(0));
  const dens=densityCheck();
  const checks=[
    {name:'Ethics approval recorded and not retroactive',
     ok:ethicsOK,
     detail: !S.setup.ethicsRef||!eDate ? 'Reference and date required (Appendix C)'
       : (eDate>td ? 'Approval date '+eDate+' is in the future — approval cannot be granted retroactively'
                   : 'Approved '+eDate+', before this session and before any recruitment contact')},
    {name:'Pre-registration filed before collection',
     ok:preregOK,
     detail: !S.setup.preregRef||!pDate ? 'Reference and timestamp required (Appendix D)'
       : (pDate>td ? 'Filing date '+pDate+' is in the future — Standing Rule 24 requires a public timestamp before collection'
                   : 'Filed '+pDate+', before collection and before any empirical analysis')},
    {name:'Participant number within the recruitment frame', ok:numOK,
     detail: numOK ? ('Order '+(((n-1)%6)+1)+' of 6 assigned; code '+participantCode(n))
       : ('A number from 1 to '+PROTOCOL.participantMax+' is required — it assigns the counterbalance order and is the participant code')},
    {name:'Parameters fixed and dated before pre-registration', ok:paramsLocked() && lateParams.length===0,
     detail: !paramsLocked() ? 'Some parameters have no fixed-on date (Standing Rules 1 and 3)'
       : (lateParams.length ? ('Fixed after the pre-registration was filed: '+lateParams.join(', '))
                            : 'All '+PARAM_SPEC.length+' carry a logbook date on or before '+pDate)},
    {name:'Disturbance trace installed', ok:!!(DIST && !DIST.meta.surrogate && DIST.meta.inS12Range!==false),
     detail:DIST?(DIST.meta.surrogate?'A surrogate is installed — not permitted in a study session'
       :(DIST.meta.name+' · τ='+DIST.meta.correlationTimeS+' s'+(DIST.meta.inS12Range?' (within the S1.2 range)':' — OUTSIDE the S1.2 measured range'))):'Study 1 lateral-acceleration trace required (§1.2)'},
    {name:'Session arithmetic closes', ok:arith.closes,
     detail:arith.nominalS+' s nominal against '+arith.requiredS+' s required (Standing Rules 12 and 20)'},
    /* §8.6 sized the 3-minute history-gap window on "≈9 pairs per window".
       The realised schedule delivers about 7.5. That is a 17% shortfall on
       the count the window length and the power derivation both rest on, so
       it blocks a study session until a re-derivation exists and is
       referenced. A note in an export is not a re-derivation. */
    {name:'History-gap power re-derived at the realised pair count',
     ok: !!(S.setup.gapPowerRef && S.setup.gapPowerDate && S.setup.gapPowerDate<=td
            && (!pDate || S.setup.gapPowerDate<=pDate)),
     detail: !S.setup.gapPowerRef||!S.setup.gapPowerDate
       ? ('§8.6 assumed '+PROTOCOL.gapPairsAssumed+' pairs per 3-min window; this schedule delivers '+
          dens.inductionPairsPerGapWindow+'. A logbook reference for the re-derivation at the realised count is required before collection (Standing Rule 19)')
       : (S.setup.gapPowerDate>td ? 'Re-derivation date '+S.setup.gapPowerDate+' is in the future'
          : (pDate && S.setup.gapPowerDate>pDate
             ? 'Re-derived '+S.setup.gapPowerDate+', after the pre-registration was filed on '+pDate
             : 'Re-derived at '+dens.inductionPairsPerGapWindow+' pairs per window — '+S.setup.gapPowerRef+', '+S.setup.gapPowerDate))},

/* Practice is familiarisation and an audibility check. It is NOT a G1 test
   and does not render a G1 verdict. G1 requires a realised SDLP-premise
   duration of at least 150 s per block; a 60 s practice segment yields
   roughly 30–35 s once fit windows are excluded, so a 15%-of-the-smaller-
   effect tolerance applied to it would be a verdict on noise. The numbers
   are shown; the judgement is not made here. */
function practiceReviewMarkup(v){
  const seg=v.segments||[];
  const base=seg.find(s=>s.cond==='base'), road=seg.find(s=>s.cond==='road'), load=seg.find(s=>s.cond==='load');
  const inc=(x)=> (x&&base&&base.premise.sdlp) ? +(((x.premise.sdlp-base.premise.sdlp)/base.premise.sdlp)*100).toFixed(1) : null;
  const rows=seg.map(s=>`<div class="sumrow"><span>${esc(CONDITIONS[s.cond].title)}</span><span>SDLP-premise ${s.premise.sdlp} · ${s.premise.durationS} s premise-free</span></div>`).join('');
  const ri=inc(road), li=inc(load);
  const minDur=Math.min.apply(null, seg.map(s=>s.premise.durationS));
  const heard = v.nback && v.nback.stimuli>0;
  return `${rows}
  <div class="sumrow"><span>Change from baseline — road / load</span><span>${ri!=null?ri+'%':'—'} / ${li!=null?li+'%':'—'}</span></div>
  ${v.nback?`<div class="sumrow"><span>2-back stimuli heard · hits</span><span>${v.nback.stimuli} · ${v.nback.hits}/${v.nback.targets}</span></div>`:''}
  ${v.practiceConfirmation ? v.practiceConfirmation.checks.map(c=>`<div class="gate"><span class="st ${c.within?'ok':'no'}">${c.within?'OK':'!'}</span><div class="gb"><b>${esc(CONDITIONS[c.cond].title)} confirmed against the pilot target</b>
  <span>${c.increasePct!=null?c.increasePct+'% against a target of '+v.practiceConfirmation.targetIncreasePct+'% (band ±'+v.practiceConfirmation.bandPct+'%). ':'No comparable increase. '}${c.within?'Within band.':'Outside band — logged as a deviation. Nothing is tuned; the session continues as specified.'}</span></div></div>`).join('') : ''}

  <span>G1 is scored across about six pilot participants on full 300 s blocks with a realised SDLP-premise duration of at least 150 s. The shortest segment here gives ${minDur} s. These figures are familiarisation only and carry no pairwise tolerance; they are recorded, not judged. Parameters are never changed inside a session.</span></div></div>

}

function kssPanel(step){

/* §8.2b "Breaks are offered at phase boundaries." Offered AFTER the rating,

   just rested is not rating the induction. v4 put the offer beside the

function finishPanel(){
  const rows=STEPS.map((s,k)=>{
    const st=S.steps[k];
    const dur=st.startedAt&&st.endedAt?fmtClock((new Date(st.endedAt)-new Date(st.startedAt))/1000):'—';
    return `<div class="sumrow"><span>${esc(s.title)}</span><span>${dur}</span></div>`;

    +(ok?'✓ Session completed':'⚠ Session ended incomplete'+(S.withdrawn?' — withdrawn at '+(S.withdrawnAtPhase||'unknown phase'):''))+`</div>`;
  const g2=`<div class="gate"><span class="st ${mc.result==='induction confirmed'?'ok':(mc.result==='incomplete'?'na':'no')}">G2</span>

  const who=S.code?`<div class="blurb" style="margin-top:0">${esc(S.code)} · order ${S.orderIndex+1} of 6</div>`:'';

/* ── wiring ─────────────────────────────────────────────────────── */
function wirePanel(step, st, i){
  if(step.k==='setup'){
    const bind=(id,key)=>{ const el=document.getElementById(id); if(el) el.oninput=()=>{ S.setup[key]=el.value.trim(); 
      if(key==='participantNo'){ const n=parseInt(el.value,10);
        if(n>=1 && n<=PROTOCOL.participantMax){ S.orderIndex=(n-1)%6; S.code=participantCode(n); STEPS=buildSteps(S.orderIndex); }
        else { S.code=''; } }
      save(); renderNow(); }; };
    bind('su-eref','ethicsRef'); bind('su-edate','ethicsDate'); bind('su-pref','preregRef');
    bind('su-pdate','preregDate'); bind('su-pno','participantNo'); bind('su-op','operator');
    bind('su-gpref','gapPowerRef'); bind('su-gpdate','gapPowerDate');
    document.getElementById('su-dist').onclick=()=>document.getElementById('dist-file').click();
    document.getElementById('su-params').onclick=()=>{ uiView='params'; renderApp(); };
    document.getElementById('su-pilot').onclick=()=>{ S.mode='pilot'; log('Pilot / calibration session started — not data of record'); beginSession(i); };
    const b=document.getElementById('su-start');
    if(b) b.onclick=()=>{ if(!studyGate().ok) return; S.mode='study'; log('Study session started — ethics '+S.setup.ethicsRef+', prereg '+S.setup.preregRef); beginSession(i); };
    skipFn=()=>{ S.mode='test'; beginSession(i); };
  }
  if(step.k==='consent'){
    const boxes=['c1','c2','c3','c4','c5','c6'].map(id=>document.getElementById(id));
    const cont=document.getElementById('b-continue'), cv=document.getElementById('cv');
    const upd=()=>{ cont.disabled=!(boxes.every(x=>x.checked) && cv.value.trim()); };
    boxes.forEach(b=>b.onchange=upd); cv.oninput=upd;
    cont.onclick=()=>{ S.steps[i].value={consentFormVersion:cv.value.trim(), recordedAt:nowISO()};
      log('Consent recorded — form '+cv.value.trim()); completeStep(i); };
    document.getElementById('b-withdraw').onclick=()=>confirmWithdraw('consent');
    skipFn=()=>{ log('Consent skipped (test mode)'); completeStep(i); };
  }
  if(step.k==='practice'){
    if(st.value){ document.getElementById('pr-ok').onclick=()=>{
        log('Practice confirmation recorded'); completeStep(i); }; skipFn=()=>completeStep(i); return; }
    if(!st.started){
      const au=document.getElementById('au-test'), go=document.getElementById('pr-start');
      au.onclick=()=>{ ensureAudio(); sayLetter('K'); setTimeout(()=>sayLetter('R'),900); go.disabled=false;
        S.steps[i].audioChecked=true; save(); };
      go.onclick=()=>{ st.started=true; st.startedAt=nowISO(); save(); renderNow();
        engStart(i, step, ()=>{ save(); renderNow(); }); };
      skipFn=()=>{ log('Practice skipped (test mode)'); completeStep(i); };
      return;
    }
    wireTrackControls(CONDITIONS.load.load);
    skipFn=()=>{ engStop(); log('Practice cut short (test mode)'); completeStep(i); };
  }
  if(step.k==='track'){
    if(!st.startedAt){ st.startedAt=nowISO(); st.status='current'; log(step.title+' started'); save(); }
    else if(!st.value && !Eng.active){
      /* The page was reloaded or the app was reopened part-way through this
         block. v3 restarted it silently and the interrupted run vanished.
         The restart is a deviation and is logged where it happens. */
      st.restarts=(st.restarts||0)+1;
      st.startedAt=nowISO();
      deviation('interruption','"'+step.title+'" restarted from the beginning (attempt '+(st.restarts+1)+
        ') after an interruption — the partial run was not retained and is not in the record');
    }
    wireTrackControls(CONDITIONS[step.cond].load);
    if(!Eng.active) engStart(i, step, null);
    skipFn=()=>{ engStop(); deviation('operator','Block '+step.title+' ended early in testing mode'); completeStep(i); };
  }
  if(step.k==='kss'){
    /* The break, if this boundary offers one, is a second panel shown after
       the rating is in — never a control sitting next to the slider. */
    const finBreak=(taken, startedAt)=>{
      S.breaks.push({boundary:step.boundary, offeredAt:nowISO(), taken:!!taken,
        durationS: startedAt ? +((Date.now()-startedAt)/1000).toFixed(1) : null, timed:!!startedAt,
        afterRating:true});
      st.acknowledged=true;
      log('Break at '+step.boundary+' — '+(taken?('taken, '+((Date.now()-startedAt)/1000).toFixed(1)+' s'):'declined'));
      completeStep(i);
    };
    if(st.value && step.offerBreak && !st.acknowledged){
      const sk=document.getElementById('kb-skip'), tk=document.getElementById('kb-take');
      if(sk) sk.onclick=()=>finBreak(false, null);
      if(tk) tk.onclick=()=>{
        const t0=Date.now(); tk.disabled=true;
        const note=document.getElementById('kb-note');
        const iv=setInterval(()=>{ if(note) note.textContent='Break running — '+fmtClock((Date.now()-t0)/1000)+'. Press continue when the participant is ready.'; },1000);
        if(sk){ sk.textContent='Break over — continue'; sk.onclick=()=>{ clearInterval(iv); finBreak(true, t0); }; }
      };
      skipFn=()=>finBreak(false, null);
      return;
    }
    const sl=document.getElementById('kss-slider'), num=document.getElementById('kss-num'),
      desc=document.getElementById('kss-desc'), ok=document.getElementById('b-kss-confirm');
    let touched=false;
    const record=(v, skipped)=>{
      S.steps[i].value={kss:v, label:KSS_LABELS[v-1], boundary:step.boundary, at:nowISO(),
        touched:!!touched && !skipped, skipped:!!skipped};
      log('KSS '+v+' at '+step.boundary+(skipped?' (skipped, test mode)':''));
      /* Hold the step open so the break panel can render. completeStep would
         advance past the offer. */
      if(step.offerBreak && !st.acknowledged){ save(); renderApp(); return; }
      completeStep(i);
    };
    sl.oninput=()=>{ touched=true; const v=+sl.value; num.textContent=v; desc.textContent=KSS_LABELS[v-1]; ok.disabled=false; };
    ok.onclick=()=>record(+sl.value, false);
    skipFn=()=>record(+sl.value, true);
  }
  if(step.k==='pvt'){
    if(st.value && step.offerBreakAfter && !st.acknowledged){
      const fin=(taken, startedAt)=>{
        S.breaks.push({boundary:step.offerBreakAfter, offeredAt:nowISO(), taken:!!taken,
          durationS: startedAt? +((Date.now()-startedAt)/1000).toFixed(1) : null, timed:!!startedAt});
        st.acknowledged=true; log('Break at '+step.offerBreakAfter+' — '+(taken?'taken':'declined')); completeStep(i);
      };
      const sk=document.getElementById('pb-skip'), tk=document.getElementById('pb-take');
      if(sk) sk.onclick=()=>fin(false, null);
      if(tk) tk.onclick=()=>{
        const t0=Date.now(); tk.disabled=true;
        const note=document.getElementById('pb-note');
        const iv=setInterval(()=>{ if(note) note.textContent='Break running — '+fmtClock((Date.now()-t0)/1000)+'. Press continue when the participant is ready.'; },1000);
        if(sk){ sk.textContent='Break over — continue'; sk.onclick=()=>{ clearInterval(iv); fin(true, t0); }; }
      };
      skipFn=()=>fin(false, null);
    } else wirePVT(i, st, step);
  }
  if(step.k==='break'){
    if(!st.startedAt){ st.startedAt=nowISO(); st.remaining=step.dur; log('Break started'); save(); }
    skipFn=()=>{ log('Break cut short (test mode)'); completeStep(i); };
  }
  if(step.k==='finish') finalizeSessionOnce(i);
}
function wireTrackControls(withLoad){
  const L=document.getElementById('imp-left'), R=document.getElementById('imp-right');
  if(L) ['pointerdown'].forEach(ev=>L.addEventListener(ev, e=>{ e.preventDefault(); engInput(-1, e.pointerType||'touch'); }, {passive:false}));
  if(R) ['pointerdown'].forEach(ev=>R.addEventListener(ev, e=>{ e.preventDefault(); engInput(1, e.pointerType||'touch'); }, {passive:false}));
  if(withLoad){
    const M=document.getElementById('nb-match');
    if(M) M.addEventListener('pointerdown', e=>{ e.preventDefault(); nbackRespond();
      M.classList.add('fired'); setTimeout(()=>M.classList.remove('fired'),70); }, {passive:false});
  }
}
/* Keyboard, for desktop runs. Auto-repeat is ignored: one keypress is one
   corrective event, so the input stream stays unambiguous. */
document.addEventListener('keydown', e=>{
  if(!Eng.active || e.repeat) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); engInput(-1,'key'); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); engInput(1,'key'); }
  else if(e.code==='Space' && Eng.nback){ e.preventDefault(); nbackRespond(); }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && Eng.active) deviation('attention','Page hidden during '+(Eng.step?Eng.step.title:'a block'));
});

function beginSession(i){
  S.startedAt=S.startedAt||nowISO();
  S.seed=S.seed||((Date.now()^hashStr(String(Math.random())))>>>0);
  S.env=captureEnv();
  const n=parseInt(S.setup.participantNo,10);
  if(n>=1) S.orderIndex=(n-1)%6;
  STEPS=buildSteps(S.orderIndex);
  const a=sessionArithmetic(STEPS);
  log('Session arithmetic '+(a.closes?'closes':'DOES NOT CLOSE')+' — '+a.nominalS+' s of a required '+a.requiredS+' s');
  if(!a.closes) deviation('arithmetic','Nominal session length '+a.nominalS+' s ≠ 3600 s');
  log('Early-phase order '+(S.orderIndex+1)+' of 6 — '+ORDERS[S.orderIndex%6].join(', '));
  /* The load block and the removal probe share one rating, because §1.2
     fixes the probe "immediately after the load block" and a rating is both
     a delay and a cognitive task. That is the right call and it has a
     price: §8.3 predicts KSS/PVT "recovers" for the row "Load, 60 s after
     removal", and one number spanning both boundaries cannot show a change
     between them. v4 left this reasoning in a source comment. It is a
     departure from "KSS at every block boundary" and it retires a
     pre-specified prediction, so it is registered in both places the
     protocol provides. */
  registerCombinedRatingDeviation();
  save(); startTicker(); completeStep(i);
}
/* Standing Rule 1 (log it where it happens) and Standing Rule 7 (an
   analysis that cannot be run is recorded as abandoned, with its reason,
   not dropped). Idempotent — a resumed session does not log it twice. */
function registerCombinedRatingDeviation(){
  if(S.log.some(e=>e.combinedRating)) return;
  const d={at:nowISO(), step:S.current, kind:'design',
    detail:'Single KSS rating spans the load-block and removal-probe boundaries. §1.2 fixes the probe immediately after the load block and nothing may come between them, so the two boundary ratings are taken together after the probe and the record carries both labels. This departs from §1.2 "KSS at every block boundary" and must be carried in the pre-registration before it is run.'};
  S.deviations.push(d);
  S.log.push({at:d.at, msg:'DEVIATION — '+d.kind+': '+d.detail, dev:true, combinedRating:true});
  S.abandoned.push({at:nowISO(), text:
    'S2.16 / §8.3, row "Load, 60 s after removal — KSS/PVT recovers": the KSS half is not testable in this design. A single rating spanning the load block and the removal probe cannot show recovery between them, and a retrospective rating is not a KSS, which asks how the person feels right now. The PVT half is unaffected and is unchanged. Recorded under Standing Rule 7 as an analysis this design cannot run, with its reason, rather than omitted from the write-up.'});
  save();
}
function captureEnv(){
  const scr=window.screen||{};
  return {userAgentPlatform:(navigator.platform||''), languages:(navigator.languages||[]).slice(0,2),
    screen:{w:scr.width||null, h:scr.height||null, dpr:window.devicePixelRatio||1},
    displayHz:measuredHz, nominalSampleHz:PROTOCOL.fs,
    speechSynthesis:speechAvailable(), vibrationAvailable:(typeof navigator.vibrate==='function'),
    touchPoints:navigator.maxTouchPoints||0, pointerEvents:(typeof window.PointerEvent!=='undefined'), at:nowISO()};
}

function sessionCompletedSuccessfully(){
  if(S.withdrawn) return false;
  return S.steps.slice(0, STEPS.length-1).every(s=>s.status==='done');
}
function confirmWithdraw(phase){
  openModal('<h3>Stop the session?</h3><p>The participant may stop at any point, without giving a reason. Everything collected so far is kept and the phase is recorded.</p><div class="btnrow"><button class="warn" id="m-yes">Stop now</button><button class="ghost" id="m-no">Cancel</button></div>');
  document.getElementById('m-no').onclick=closeModal;
  document.getElementById('m-yes').onclick=()=>{
    S.withdrawn=true; S.withdrawnAtPhase=phase||(STEPS[S.current]?(STEPS[S.current].phase||STEPS[S.current].k):'unknown');
    engStop();
    log('Withdrew at '+S.withdrawnAtPhase+' — session ending');
    closeModal(); jumpToFinish();
  };
}
function jumpToFinish(){
  stopTicker(); engStop();
  const f=STEPS.length-1;
  S.current=f; S.steps[f].status='current';
  save(); renderApp();
}
function completeStep(i){
  const st=S.steps[i];
  st.status='done'; st.endedAt=nowISO(); if(!st.startedAt) st.startedAt=st.endedAt;
  if(i+1<S.steps.length){ S.current=i+1; S.steps[i+1].status='current'; }
  else { S.current=S.steps.length; stopTicker(); }
  save(); renderApp();
}
function finalizeSessionOnce(i){
  if(S.finalized) return;
  S.finalized=true;
  S.completedSuccessfully=sessionCompletedSuccessfully();
  const mc=manipulationCheck();
  log('Session '+(S.completedSuccessfully?'completed':'ended incomplete')+(S.code?' — '+S.code:'')+'; G2 '+mc.result);
  completeStep(i);
  saveToDrive(); showDoneModal();
}
/* The break is timed against the wall clock, not by decrementing a counter.
   setInterval is throttled hard in a backgrounded tab — on mobile to as
   little as once a minute — so v3's counter could report 2:00 elapsed after
   a far longer rest, and the panel's own claim that "the persistence probe
   is only interpretable against a known break length" would be false. The
   realised length is recorded and a deviation is logged if it drifts. */
function startTicker(){
  if(tickHandle) return;
  tickHandle=setInterval(()=>{
    updateElapsed();
    const i=S.current, step=STEPS[i], st=S.steps[i];
    if(step && step.k==='break' && st.status==='current' && st.startedAt){
      const elapsed=(Date.now()-new Date(st.startedAt).getTime())/1000;
      st.remaining=Math.max(0, step.dur-elapsed);
      const d=document.getElementById('t-display'); if(d) d.textContent=fmtClock(st.remaining);
      if(st.remaining<=0){
        st.realisedBreakS=+elapsed.toFixed(1);
        if(Math.abs(elapsed-step.dur)>PROTOCOL.breakToleranceS)
          deviation('break','Break ran '+st.realisedBreakS+' s against a nominal '+step.dur+
            ' s — the persistence probe must be read against the realised length');
        buzz(200); log('Break complete — '+st.realisedBreakS+' s realised'); completeStep(i);
      } else save();
    }
  },1000);
}
function stopTicker(){ if(tickHandle){ clearInterval(tickHandle); tickHandle=null; } }

/* ── PVT (Dinges & Powell 1985), 3 min ──────────────────────────── */
function wirePVT(i, st, step){
  if(st.status==='done') return;
  if(st.wired) return; st.wired=true;
  const state={running:true, trials:[], armed:false, waitingSince:0, timeoutId:null, deadline:0, endCheck:null, isi:null};
  const flash=document.getElementById('pvt-flash'), disp=document.getElementById('t-display');
  const t0=performance.now();
  /* Seeded from the session seed, like every other schedule in this file, so
     the ISI sequence is reproducible from the exported record. v3 used
     Math.random(), which quietly broke the file's own reproducibility claim. */
  const prnd=mulberry32((S.seed ^ hashStr('pvt:'+step.point))>>>0);
  if(!st.startedAt){ st.startedAt=nowISO(); log(step.title+' started'); save(); }
  function stats(){
    const rts=state.trials.filter(t=>t.rt!=null).map(t=>t.rt).sort((a,b)=>a-b);
    const med=rts.length?rts[Math.floor(rts.length/2)]:null;
    const lapses=state.trials.filter(t=>t.rt!=null&&t.rt>PROTOCOL.pvtLapseMs).length;
    const fs=state.trials.filter(t=>t.falseStart).length;
    document.getElementById('pvt-n').textContent=state.trials.length;
    document.getElementById('pvt-med').textContent=med!=null?med+' ms':'—';
    document.getElementById('pvt-lap').textContent=lapses;
    document.getElementById('pvt-fs').textContent=fs;
    const mean=rts.length?rts.reduce((a,b)=>a+b,0)/rts.length:null;
    return {point:step.point, medianRT:med, meanRT:mean!=null?Math.round(mean):null, lapses, lapseThresholdMs:PROTOCOL.pvtLapseMs,
      falseStarts:fs, n:state.trials.length, durationS:step.dur,
      isiRangeMs:[PROTOCOL.pvtIsiMinMs,PROTOCOL.pvtIsiMaxMs], timingEvent:'pointerdown', seeded:true,
      trials:state.trials.slice()};
  }
  function schedule(){
    flash.className='flash'; flash.textContent='Wait…';
    const isi=PROTOCOL.pvtIsiMinMs + prnd()*(PROTOCOL.pvtIsiMaxMs-PROTOCOL.pvtIsiMinMs);
    state.isi=Math.round(isi);
    state.timeoutId=setTimeout(()=>{ flash.className='flash go'; flash.textContent='TAP';
      state.waitingSince=performance.now(); state.armed=true; }, isi);
  }
  /* pointerdown, not click. click fires on release, so v3's reaction times
     carried the press duration — tens of milliseconds, on a measure whose
     entire signal is tens of milliseconds. */
  const respond=(e)=>{
    if(e && e.preventDefault) e.preventDefault();
    if(!state.running) return;
    if(state.armed){
      const rt=Math.round(performance.now()-state.waitingSince);
      state.trials.push({rt, isiMs:state.isi, tS:+((performance.now()-t0)/1000).toFixed(2)}); state.armed=false;
      flash.className='flash'; flash.textContent=rt+' ms'; stats();
      if(performance.now()<state.deadline) setTimeout(schedule,400);
    } else {
      state.trials.push({rt:null, falseStart:true, isiMs:state.isi, tS:+((performance.now()-t0)/1000).toFixed(2)});
      flash.className='flash early'; flash.textContent='Too early'; stats();
      clearTimeout(state.timeoutId);
      if(performance.now()<state.deadline) setTimeout(schedule,600);
    }
  };
  flash.addEventListener('pointerdown', respond, {passive:false});
  function finish(){
    state.running=false; clearTimeout(state.timeoutId); clearInterval(state.endCheck);
    const s=stats(); S.steps[i].value=s;
    log('PVT complete — median '+(s.medianRT!=null?s.medianRT+' ms':'—')+', '+s.lapses+' lapse(s)');
    if(step.offerBreakAfter && !S.steps[i].acknowledged){ save(); renderApp(); return; }
    completeStep(i);
  }
  state.deadline=performance.now()+step.dur*1000;
  schedule();
  state.endCheck=setInterval(()=>{
    const remain=Math.max(0,(state.deadline-performance.now())/1000);
    if(disp) disp.textContent=fmtClock(remain);
    if(remain<=0){ flash.className='flash'; flash.textContent='Done'; finish(); }
  },250);
  skipFn=()=>{ finish(); };
}

function renderDoneList(){

    if(v && v.premise) extra=dur+' · premise '+v.premise.sdlp;

/* ══ P0 — COMPUTATIONAL VALIDATION ════════════════════════════════
   Protocol Part 3, P0. Estimators are validated against planted values
   before any real data can be blamed. Run from the menu; results are
   written to the log so the date they were run is on the record. ══ */
function ouSim(lambda, sigma, n, rnd){
  const dt=PROTOCOL.dt, phi=Math.exp(-lambda*dt), out=new Float64Array(n);
  let x=0;
  for(let i=0;i<n;i++){ x=phi*x+sigma*Math.sqrt(dt)*gaussFrom(rnd); out[i]=x; }
  return out;
}
/* Same driving noise, different parameters. Sharing the noise across the
   sigma values is not a shortcut: scaling sigma scales the trajectory
   linearly, so this isolates the sigma → variance mapping from sampling
   error instead of leaving the check at the mercy of it. */
function ouSimOn(lambda, sigma, noise){
  const dt=PROTOCOL.dt, phi=Math.exp(-lambda*dt), out=new Float64Array(noise.length);
  let x=0;
  for(let i=0;i<noise.length;i++){ x=phi*x+sigma*Math.sqrt(dt)*noise[i]; out[i]=x; }
  return out;
}
/* Exponential decay constant fitted to the mean post-displacement
   trajectory, bounded and censored at the analysis window. Part 4:
   unbounded exponential fitting diverges on slow decays — constrain and
   censor, and report the censoring rate. Amplitude is profiled out, so
   only tau is searched. */
function fitTau(mean, dt, winS){
  const n=Math.min(mean.length, Math.round(winS/dt));
  const lo=0.05, hi=winS;
  const sse=(tau)=>{
    let sxy=0, sxx=0;
    for(let i=0;i<n;i++){ const b=Math.exp(-i*dt/tau); sxy+=b*mean[i]; sxx+=b*b; }
    const A=sxx>0?sxy/sxx:0;
    let s=0;
    for(let i=0;i<n;i++){ const r=mean[i]-A*Math.exp(-i*dt/tau); s+=r*r; }
    return s;
  };
  let a=Math.log(lo), b=Math.log(hi);
  const gr=(Math.sqrt(5)-1)/2;
  let c=b-gr*(b-a), d=a+gr*(b-a), fc=sse(Math.exp(c)), fd=sse(Math.exp(d));
  for(let k=0;k<90;k++){
    if(fc<fd){ b=d; d=c; fd=fc; c=b-gr*(b-a); fc=sse(Math.exp(c)); }
    else { a=c; c=d; fc=fd; d=a+gr*(b-a); fd=sse(Math.exp(d)); }
  }
  const tau=Math.exp((a+b)/2);
  return {tau, lambda:1/tau, censored: tau>=hi*0.995 || tau<=lo*1.005};
}
/* The naive estimator, kept solely so P0 can show what it does to a
   truncated window. Not used anywhere else. */
function fitTauLogLinear(mean, dt, winS){
  const N=Math.min(mean.length, Math.round(winS/dt));
  const xs=[], ys=[];
  for(let i=0;i<N;i++){ if(mean[i]>1e-4){ xs.push(i*dt); ys.push(Math.log(mean[i])); } }
  if(xs.length<10) return null;
  const n=xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
  let sxx=0, sxy=0;
  for(let i=0;i<n;i++){ sxx+=xs[i]*xs[i]; sxy+=xs[i]*ys[i]; }
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  return slope<0 ? -1/slope : null;
}
function p0Run(){
  const rnd=mulberry32(20260924), dt=PROTOCOL.dt, out=[];

  /* Mean post-displacement trajectory: the quantity the decay constant is
     actually fitted to. Displacement and residual noise are the study's
     own, so the fit meets the noise floor where it really does. */
  const meanResponse=(tau, nObs, noiseSD, winS, amp)=>{
    const n=Math.round(winS/dt), m=new Float64Array(n);
    for(let t=0;t<nObs;t++){
      let x=amp;
      for(let i=0;i<n;i++){ m[i]+=x+noiseSD*gaussFrom(rnd); x*=Math.exp(-dt/tau); }
    }
    for(let i=0;i<n;i++) m[i]/=nObs;
    return m;
  };

  /* 1. Recover a planted lambda from a simulated first-order system */
  const trueTau=0.5556, trials=3000;
  const fit1=fitTau(meanResponse(trueTau, trials, 0.06, 3.0, P('pertAmp')), dt, 3.0);
  const err=Math.abs(fit1.lambda-1/trueTau)/(1/trueTau)*100;
  out.push({name:'Planted λ recovered', pass:err<2,
    detail:'true λ '+(1/trueTau).toFixed(3)+' → '+fit1.lambda.toFixed(4)+' ('+err.toFixed(2)+'% error; criterion <2%)'+(fit1.censored?' — CENSORED at the window':'')});

  /* 2. Standing Rule 25 — a k-fold variance ratio is a k-fold apparent
        stability loss. The squaring applies only to a sigma ratio. The
        exchange rate is checked on both sides: sigma up and lambda down. */
  const LS=60*7200;
  const noise=new Float64Array(LS);
  for(let i=0;i<LS;i++) noise[i]=gaussFrom(rnd);
  const v1=variance(ouSimOn(1.0,1.0,noise)), v2=variance(ouSimOn(1.0,2.0,noise)), v3=variance(ouSimOn(1.0,3.0,noise));
  const vL=variance(ouSimOn(0.25,1.0,noise));
  const r2=v2/v1, r3v=v3/v1, rL=vL/v1;
  out.push({name:'Variance exchange rate (Rule 25)',
    pass:Math.abs(r2-4)<0.4 && Math.abs(r3v-9)<0.9 && Math.abs(rL-4)<0.4,
    detail:'σ×2 → Var×'+r2.toFixed(2)+' (theory 4); σ×3 → Var×'+r3v.toFixed(2)+' (theory 9); λ÷4 → Var×'+rL.toFixed(2)+' (theory 4). A 2× disturbance increase reproduces the variance signal of a 4× stability loss. A k-fold variance ratio is a k-fold apparent stability loss — the squaring applies only to a σ ratio.'});

  /* 3. Coloured forcing drives the autocorrelation-implied lambda down */
  const white=ouSim(1.0,1.0,60*600,rnd);
  const col=bandLimit(Float32Array.from(ouSim(1.0,1.0,60*600,rnd)), 0.1, 1.0);
  const lamAC=a=>{ const ac=lag1(a); return ac>0&&ac<1 ? -Math.log(ac)/dt : null; };
  const lw=lamAC(white), lc=lamAC(col);
  out.push({name:'Coloured-forcing failure reproduced', pass: lc!=null&&lw!=null&&lw/lc>=10,
    detail:'AC(1)-implied λ: white '+ (lw!=null?lw.toFixed(3):'—') +' → band-limited '+(lc!=null?lc.toFixed(3):'—')+' (ratio '+((lw&&lc)?(lw/lc).toFixed(1):'—')+'×; criterion ≥10×)'});

  /* 4. History gap and the cost of the common 3.0 s window (S2.14).
        Run at the study's own observation counts — 10 quiet-history and 8
        recent-history per condition — so the shrinkage factor is the one
        the power re-derivation actually needs. */
  const gapAt=(win)=>{
    const quietTau=1.06, recentTau=2.01, noise=0.06, reps=200;
    let acc=0, n=0, cens=0;
    for(let r=0;r<reps;r++){
      const q=fitTau(meanResponse(quietTau, 10, noise, win, P('pertAmp')), dt, win);
      const c=fitTau(meanResponse(recentTau, 8, noise, win, P('pertAmp')), dt, win);
      if(q.censored||c.censored) cens++;
      acc += (c.tau-q.tau)/q.tau; n++;
    }
    return {gap:acc/n, censoredRate:cens/reps};
  };
  const gFull=gapAt(8.0), g3=gapAt(3.0);
  const shrink=(gFull.gap&&g3.gap)? g3.gap/gFull.gap : null;
  out.push({name:'History gap recovered; 3.0 s censoring quantified (S2.14)',
    pass: g3.gap>0 && shrink!=null && shrink<=1.05,
    detail:'planted +90%: unrestricted window '+(gFull.gap*100).toFixed(0)+'%, common 3.0 s window '+(g3.gap*100).toFixed(0)
      +'%; shrinkage factor '+(shrink!=null?shrink.toFixed(2):'—')+'; censoring rate '+(g3.censoredRate*100).toFixed(0)
      +'% at 3 s, '+(gFull.censoredRate*100).toFixed(0)+'% unrestricted. Re-derive power at this window before collection; if power at n = 40 falls below 0.80 the perturbation count is raised.'});

  /* 4b. §8.2a-i — the reason the window is common. Plant NO gap, then fit
     each history over the window that would be available to it: P1 three
     seconds, P2 six. Any gap that appears was manufactured by the schedule.
     Run with two estimators, because which one is used turns out to matter
     more than the window does, and that is worth knowing before collection. */
  const unequal=(()=>{
    const tau=1.06, noise=0.06, reps=200;
    let nB=0, cB=0, nL=0, cL=0;
    for(let r=0;r<reps;r++){
      const m_q3=meanResponse(tau, 10, noise, 3.0, P('pertAmp'));
      const m_r6=meanResponse(tau, 8, noise, 6.0, P('pertAmp'));
      const m_r3=meanResponse(tau, 8, noise, 3.0, P('pertAmp'));
      const q3=fitTau(m_q3, dt, 3.0).tau, r6=fitTau(m_r6, dt, 6.0).tau, r3=fitTau(m_r3, dt, 3.0).tau;
      nB+=(r6-q3)/q3; cB+=(r3-q3)/q3;
      const lq3=fitTauLogLinear(m_q3, dt, 3.0), lr6=fitTauLogLinear(m_r6, dt, 6.0), lr3=fitTauLogLinear(m_r3, dt, 3.0);
      if(lq3&&lr6&&lr3){ nL+=(lr6-lq3)/lq3; cL+=(lr3-lq3)/lq3; }
    }
    return {naiveBounded:nB/reps, commonBounded:cB/reps, naiveLog:nL/reps, commonLog:cL/reps};
  })();
  out.push({name:'Unequal windows manufacture a gap; the common window does not (§8.2a-i)',
    pass: Math.abs(unequal.commonBounded)<0.05 && Math.abs(unequal.commonLog)<Math.abs(unequal.naiveLog),
    detail:'with NO true gap planted. Naive log-linear fit: unequal windows (P1 3 s, P2 6 s) return '
      +(unequal.naiveLog*100).toFixed(0)+'% — a gap manufactured entirely by the schedule — against '
      +(unequal.commonLog*100).toFixed(0)+'% at the common window. Bounded amplitude-profiled fit: '
      +(unequal.naiveBounded*100).toFixed(1)+'% and '+(unequal.commonBounded*100).toFixed(1)
      +'%. The common window is the protection; the estimator choice is a second one, and both are needed.'});

  /* 5. G7 specificity — p0 of the non-monotonicity classifier on flat noise */
  const W=20, TR=1000, PERM=200;
  let flagged=0;
  for(let t=0;t<TR;t++){
    const s=[]; for(let w=0;w<W;w++) s.push(gaussFrom(rnd));
    const idx=a=>{ let mx=-Infinity; a.forEach(v=>{ if(v>mx) mx=v; }); return mx-a[a.length-1]; };
    const obs=idx(s);
    let ge=0;
    for(let p=0;p<PERM;p++){
      const sh=s.slice();
      for(let i=sh.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const x=sh[i]; sh[i]=sh[j]; sh[j]=x; }
      if(idx(sh)>=obs) ge++;
    }
    if(ge/PERM<0.05) flagged++;
  }
  const p0=flagged/TR;
  out.push({name:'Classifier false-positive rate p₀ (G7a)', pass:true,
    detail:'p₀ = '+p0.toFixed(3)+' on '+TR+' flat noisy trajectories. G7 needs the qualifying proportion to exceed p₀ + 0.10. A sensitivity check is not a specificity check.'});

  /* 5b. The OTHER thing §8.6 records, which has never had a specificity
     check. §8.6 asks for two quantities per measure: the trajectory SHAPE,
     whose false-positive rate G7a computes above, and "the window at which
     each measure first departs baseline by two standard deviations". The
     second has no gate and no null. It is worth one, because the baseline is
     that participant's own windows in minutes two and three — two or three
     windows of a near-stationary series — and an SD estimated from three
     points understates the spread of the twenty windows it is then applied
     to. So the criterion fires on series with nothing in them.

     Run here on flat trajectories with no departure planted, at the study's
     own window and stride, so the number is known before collection rather
     than discovered in the data. This is p0 for the departure criterion and
     it belongs beside G7a's p0 for the shape classifier. */
  const dep=(()=>{
    const winN=Math.floor((PROTOCOL.inductionS-PROTOCOL.inductionWindowS)/PROTOCOL.inductionStrideS)+1;
    const b0=PROTOCOL.gapBaselineRangeS[0], b1=PROTOCOL.gapBaselineRangeS[1];
    const starts=[]; for(let k=0;k<winN;k++) starts.push(k*PROTOCOL.inductionStrideS);
    const baseIdx=starts.map((t,k)=>({t,k})).filter(o=>o.t>=b0 && o.t+PROTOCOL.inductionWindowS<=b1).map(o=>o.k);
    const postIdx=starts.map((t,k)=>({t,k})).filter(o=>o.t>=b1).map(o=>o.k);
    /* Overlapping windows share samples, so the series is autocorrelated.
       Build it that way rather than as independent draws, or the null is
       flattering. */
    const lag=PROTOCOL.inductionStrideS/PROTOCOL.inductionWindowS;  // shared fraction
    const rho=Math.max(0,1-lag);
    let fired=0, sust=0, cross=0;
    const TRIALS=600;
    for(let t=0;t<TRIALS;t++){
      const y=new Float64Array(winN); let prev=gaussFrom(rnd);
      for(let k=0;k<winN;k++){ prev=rho*prev+Math.sqrt(1-rho*rho)*gaussFrom(rnd); y[k]=prev; }
      const bv=baseIdx.map(k=>y[k]);
      const m=bv.reduce((a,b)=>a+b,0)/bv.length;
      const sd=Math.sqrt(bv.reduce((a,b)=>a+(b-m)*(b-m),0)/(bv.length-1));
      if(!(sd>0)) continue;
      const hits=postIdx.filter(k=>Math.abs((y[k]-m)/sd)>=2);
      cross+=hits.length;
      if(hits.length) fired++;
      for(let i=0;i+1<hits.length;i++) if(hits[i+1]===hits[i]+1){ sust++; break; }
    }
    return {p0First:fired/TRIALS, p0Sustained:sust/TRIALS, meanCrossings:cross/TRIALS,
            baselineWindows:baseIdx.length, postWindows:postIdx.length};
  })();
  out.push({name:'Departure-criterion false-positive rate p₀ (§8.6, new)',
    pass: dep.p0First<=0.10,
    detail:'On flat trajectories with NO departure planted, the §8.6 rule "first departs baseline by two standard deviations" fires in '
      +(dep.p0First*100).toFixed(0)+'% of series ('+(dep.p0Sustained*100).toFixed(0)
      +'% for two consecutive windows), with '+dep.meanCrossings.toFixed(1)+' crossings per series. Baseline is '
      +dep.baselineWindows+' window(s) against '+dep.postWindows+' tested. An SD from that few windows of a stationary series '
      +'understates the spread it is applied to, so the criterion is not a test and a departure time read off it is not evidence. '
      +'Calibrate it the way G7b calibrates the shape — against a surrogate null built by block-permuting that participant\u2019s own '
      +'window series — or report the departure as descriptive only. Fixing the stride does not fix this; the criterion is the problem. '
      +'THIS IS A PROTOCOL-LEVEL DEFECT AND IS NOT REPAIRABLE IN THE RUNNER.'});

  /* 6. First-passage inversion */
  const fpt=(lam,sig)=>{ let tot=0,c=0;
    for(let t=0;t<300;t++){ let x=3.0,i=0;
      while(x>1.5 && i<60*60){ x=Math.exp(-lam*dt)*x+sig*Math.sqrt(dt)*gaussFrom(rnd); i++; }
      tot+=i*dt; c++; }
    return tot/c; };
  const f1=fpt(0.08,1.0), f2=fpt(0.08,2.0);
  out.push({name:'First-passage inverts under rising disturbance', pass:f2<f1,
    detail:'σ×1 '+f1.toFixed(1)+' s → σ×2 '+f2.toFixed(1)+' s ('+(((f2-f1)/f1)*100).toFixed(0)+'%). A noisier process crosses any threshold sooner.'});

  return out;
}
function variance(a){ let m=0; for(let i=0;i<a.length;i++) m+=a[i]; m/=a.length; let s=0; for(let i=0;i<a.length;i++){ const d=a[i]-m; s+=d*d; } return s/(a.length-1); }
let p0Results=null;

    : '<div class="empty">Not run in this browser yet.</div>';
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="z-back">←</button><h2>P0 — computational validation</h2></div>
    <div class="blurb">Confirm the estimators recover values deliberately planted, before any real data can be blamed. Takes a few seconds.</div>
    <div class="btnrow" style="margin-bottom:14px"><button class="primary" id="z-run">Run P0 checks</button></div>
    ${rows}
    <div class="note">Results are written to the session log with the date they were run, which is the part that matters.</div>`;
  document.getElementById('z-back').onclick=goMain;
  document.getElementById('z-run').onclick=()=>{

    setTimeout(()=>{

      p0Results.forEach(r=>log('P0 · '+r.name+' — '+(r.pass?'pass':'FAIL')+' — '+r.detail));
      renderP0View();
    },50);
  };
}

/* ══ CALIBRATION (G1) ═════════════════════════════════════════════ */
function renderCalibView(){
  const host=document.getElementById('otherview');
  let store=[];
  try{ store=JSON.parse(localStorage.getItem('sh_v16_calib')||'[]'); }catch(e){}
  const cells=['road','load','fatigue'];
  const agg={}, aggDep={}, aggShare={};
  cells.forEach(c=>{ const rs=store.filter(r=>r.cell===c);
    const m=k=>rs.length? rs.reduce((a,b)=>a+(b[k]||0),0)/rs.length : null;
    agg[c]=rs.length? rs.reduce((a,b)=>a+b.increasePct,0)/rs.length : null;
    aggDep[c]=m('deploymentIncreasePct'); aggShare[c]=m('fitWindowShare'); });
  const pairOK=(a,b)=>{ if(agg[a]==null||agg[b]==null) return null;
    const d=Math.abs(agg[a]-agg[b]), sm=Math.min(Math.abs(agg[a]),Math.abs(agg[b]));
    return {d, sm, ok:d<0.15*sm}; };
  const pairs=[['road','load'],['road','fatigue'],['load','fatigue']];
  const prows=pairs.map(([a,b])=>{ const r=pairOK(a,b);
    return `<div class="gate"><span class="st ${r?(r.ok?'ok':'no'):'na'}">${r?(r.ok?'OK':'NO'):'—'}</span>
      <div class="gb"><b>${a} vs ${b} — SDLP-premise</b><span>${r?('difference '+r.d.toFixed(1)+' pp against a tolerance of '+(0.15*r.sm).toFixed(1)+' pp'):'not enough pilot data'}</span></div></div>`; }).join('');
  /* G1 also requires SDLP-deployment reported alongside with its residual
     quantified (S2.1b), and a realised premise duration of at least 150 s
     per block. v3's screen scored neither. */
  const depRows=cells.map(c=>`<div class="sumrow"><span>${c} — premise / deployment increase</span><span>${agg[c]!=null?agg[c].toFixed(1)+'%':'—'} / ${aggDep[c]!=null?aggDep[c].toFixed(1)+'%':'—'}</span></div>
    <div class="sumrow"><span>${c} — residual after premise matching · fit-window variance share</span><span>${(agg[c]!=null&&aggDep[c]!=null)?(aggDep[c]-agg[c]).toFixed(1)+' pp':'—'} · ${aggShare[c]!=null?aggShare[c].toFixed(3):'—'}</span></div>`).join('');
  const short=store.filter(r=>r.premiseS<PROTOCOL.premiseFloorS);
  const n=new Set(store.map(r=>r.code)).size;
  const rows=store.slice().reverse().slice(0,20).map(r=>`<tr><td>${esc(r.at.slice(0,10))}</td><td>${esc(r.code)}</td><td>${esc(r.cell)}</td><td class="mono">${r.increasePct.toFixed(1)}%</td><td class="mono">${r.deploymentIncreasePct!=null?r.deploymentIncreasePct.toFixed(1)+'%':'—'}</td><td class="mono">${r.premiseS}s</td></tr>`).join('');
  const pilotOnly = S.mode!=='study';
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="cb-back">←</button><h2>G1 — calibration</h2></div>
    <div class="blurb">Can road disturbance, cognitive load and fatigue each be tuned to produce statistically indistinguishable SDLP-premise increases? Scored on the perturbation-free measure, because the probe adds variance to the quantity being matched. Criterion: pairwise difference under 15% of the smaller effect, n ≈ 6, realised SDLP-premise duration ≥ 150 s per block, SDLP-deployment reported alongside and its residual quantified (S2.1b).</div>
    <div class="gate"><span class="st ${n>=6?'ok':'na'}">${n>=6?'OK':'n='+n}</span><div class="gb"><b>Pilot participants</b><span>${n} of about 6</span></div></div>
    ${prows}
    <div class="gate"><span class="st ${store.length?(short.length?'no':'ok'):'na'}">${store.length?(short.length?'NO':'OK'):'—'}</span>
      <div class="gb"><b>Realised premise duration ≥ ${PROTOCOL.premiseFloorS} s per block</b>
      <span>${store.length?(short.length? short.length+' of '+store.length+' recorded cells fall below the floor and are not G1-eligible' : 'All '+store.length+' recorded cells meet the floor'):'No cells recorded'}</span></div></div>
    <div class="barcard" style="margin-top:14px"><h3>SDLP-deployment alongside, and the residual</h3>${store.length?depRows:'<div class="empty">No cells recorded.</div>'}
      <div class="note">The residual is the deployment offset that survives premise matching. Expected positive in the fatigued cell — the probe assists the statistic under criticism, so any advantage the corrected rules show in S3 is a lower bound.</div></div>
    <div class="barcard"><h3>Pilot record</h3>
      ${store.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Code</th><th>Cell</th><th class="mono">Premise</th><th class="mono">Deploy</th><th class="mono">Dur</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No pilot sessions recorded on this device.</div>'}
      <div class="btnrow" style="margin-top:10px"><button class="small" id="cb-add" ${pilotOnly?'':'disabled'}>Add this session's cells</button><button class="small warn" id="cb-clear">Clear</button></div>
      ${pilotOnly?'':'<div class="note">G1 is a pilot gate. A study session cannot be added to the calibration record.</div>'}</div>
    <div class="note">The stopping rule and the iteration cap are pre-registered, not decided here. This screen records what happened; it does not decide when to stop.</div>`;
  document.getElementById('cb-back').onclick=goMain;
  document.getElementById('cb-clear').onclick=()=>{ try{ localStorage.removeItem('sh_v16_calib'); }catch(e){} renderCalibView(); };
  const addBtn=document.getElementById('cb-add');
  if(addBtn && pilotOnly) addBtn.onclick=()=>{
    const get=c=>{ const i=STEPS.findIndex(s=>s.k==='track'&&s.cond===c); return i>=0?S.steps[i].value:null; };
    const b=get('base'), r=get('road'), l=get('load'), f=get('fatBase');
    if(!b||!b.premise||b.premise.sdlp==null){ openModal('<h3>Nothing to add</h3><p>The baseline block has not produced an SDLP-premise value yet.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>'); document.getElementById('m-close').onclick=closeModal; return; }
    const add=(cell,v)=>{ if(!v||!v.premise||v.premise.sdlp==null) return null;
      const dep=(v.deployment&&v.deployment.mean!=null&&b.deployment&&b.deployment.mean)?((v.deployment.mean-b.deployment.mean)/b.deployment.mean)*100:null;
      return {at:nowISO(), code:S.code||'—', cell,
        increasePct:((v.premise.sdlp-b.premise.sdlp)/b.premise.sdlp)*100,
        deploymentIncreasePct:dep,
        fitWindowShare:v.fitWindow?v.fitWindow.shareOfBlockVariance:null,
        premiseS:v.premise.durationS}; };
    const recs=[add('road',r), add('load',l), add('fatigue',f)].filter(Boolean);
    let st2=[]; try{ st2=JSON.parse(localStorage.getItem('sh_v16_calib')||'[]'); }catch(e){}
    /* One row per participant per cell. v3 appended on every press, so a
       second click doubled that participant's weight in the mean. */
    recs.forEach(rec=>{ const k=st2.findIndex(x=>x.code===rec.code && x.cell===rec.cell);
      if(k>=0) st2[k]=rec; else st2.push(rec); });
    try{ localStorage.setItem('sh_v16_calib', JSON.stringify(st2)); }catch(e){}
    log('Calibration record updated — '+recs.length+' cell(s) for '+(S.code||'—'));
    renderCalibView();
  };
}

let traceRows=[], traceInduction=[];
function renderAnalyze(){

    const rs=traceRows.filter(r=>r.cond===c);
    const avg=k=>rs.length?rs.reduce((a,b)=>a+(b[k]||0),0)/rs.length:null;

  }).filter(s=>s.n>0);

    <div class="barrow"><div class="lbl"><span>${esc(CONDITIONS[s.c]?CONDITIONS[s.c].title:s.c)} · premise (${s.n})</span><span>${s.premise!=null?s.premise.toFixed(4):'—'}</span></div>
      <div class="bartrack"><div class="barfill" style="width:${s.premise!=null?(s.premise/maxV*100):0}%; background:var(--c-block)"></div></div></div>
    <div class="barrow"><div class="lbl"><span>${esc(CONDITIONS[s.c]?CONDITIONS[s.c].title:s.c)} · deployment</span><span>${s.deploy!=null?s.deploy.toFixed(4):'—'}</span></div>
      <div class="bartrack"><div class="barfill" style="width:${s.deploy!=null?(s.deploy/maxV*100):0}%; background:var(--c-probe); opacity:.7"></div></div></div>`).join('');
  host.innerHTML=`<div class="screenhead"><button class="iconbtn" id="a-back">←</button><h2>Trace</h2></div>
    <div class="blurb">Load session .json files to see SDLP both ways and the induction's 1-minute trajectory. This is a look, not an analysis — the analysis runs on the deposited files.</div>
    <div class="btnrow" style="margin-bottom:16px"><button class="primary" id="a-load">Load files</button><button class="ghost" id="a-clear">Clear</button></div>
    ${traceInduction.length?`<div class="barcard"><h3>Induction SDLP, 1-minute windows</h3>
      <div class="trackwrap" style="padding:8px"><canvas id="trace-canvas" height="150"></canvas></div>
      <div class="figlegend">${traceInduction.map((s,i)=>`<span><i style="background:${cssvar(['--c-block','--c-probe','--c-assess','--c-break','--c-flow'][i%5])}"></i>${esc(s.code)}</span>`).join('')}</div>
      <div class="caption">Never averaged across participants (Standing Rule 16).</div></div>`:''}
    <div class="barcard"><h3>SDLP by condition</h3>${summary.length?bars:'<div class="empty">No sessions loaded.</div>'}</div>`;
  document.getElementById('a-back').onclick=goMain;
  document.getElementById('a-clear').onclick=()=>{ traceRows=[]; traceInduction=[]; renderAnalyze(); };
  document.getElementById('a-load').onclick=()=>document.getElementById('analyze-file').click();
  if(traceInduction.length) drawTrace(document.getElementById('trace-canvas'), traceInduction);
}
function ingestSession(rec){
  if(!rec || !rec.schedule || !Array.isArray(rec.schedule.steps)) return 0;
  const code=(rec.participant&&rec.participant.code)||'—';
  let n=0;
  rec.schedule.steps.forEach(s=>{
    const v=s.value;
    if(v && v.premise && v.premise.sdlp!=null){
      traceRows.push({code, cond:s.condition||v.cond, premise:v.premise.sdlp, deploy:v.deployment?v.deployment.mean:null});
      n++;
    }
    if(v && v.inductionWindows && v.inductionWindows.oneMin)
      traceInduction.push({code, points:v.inductionWindows.oneMin.map(w=>({t:w.tStartS, sdlp:w.sdlpPremise!=null?w.sdlpPremise:w.sdlpDeployment}))});
  });
  return n;
}
function drawTrace(canvas, series){
  if(!canvas) return;
  const w=canvas.clientWidth||300, h=150;
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const all=series.flatMap(s=>s.points).filter(p=>p.sdlp!=null);
  if(!all.length) return;
  const maxT=Math.max(...all.map(p=>p.t))||1, maxV=Math.max(0.01,...all.map(p=>p.sdlp));
  const pal=['--c-block','--c-probe','--c-assess','--c-break','--c-flow'];
  ctx.strokeStyle=cssvar('--card3'); ctx.beginPath(); ctx.moveTo(0,h-10); ctx.lineTo(w,h-10); ctx.stroke();
  series.forEach((s,si)=>{
    const pts=s.points.filter(p=>p.sdlp!=null);
    if(!pts.length) return;
    ctx.beginPath(); ctx.strokeStyle=cssvar(pal[si%pal.length]); ctx.lineWidth=2;
    pts.forEach((p,i)=>{ const x=(p.t/maxT)*w, y=(h-14)-(p.sdlp/maxV)*(h-24); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
  });
}

/* ══ MODAL / MENU ═════════════════════════════════════════════════ */
function openModal(html){ document.getElementById('modal-card').innerHTML=html; document.getElementById('modal').hidden=false; }
function closeModal(){ document.getElementById('modal').hidden=true; }
function showDoneModal(){
  const ok=S.completedSuccessfully;
  const mc=manipulationCheck();
  openModal('<h3>'+(ok?'Session complete':'Session incomplete')+'</h3><p>'
    +(ok?'All steps finished.':'The session ended before all steps were completed'+(S.withdrawn?' — withdrawn at '+esc(S.withdrawnAtPhase||'unknown phase')+'.':'.'))
    +' G2: '+esc(mc.result)+'. The file has been saved automatically.</p>'
    +'<div class="btnrow"><button class="primary" id="m-ok">Close</button></div>');
  document.getElementById('m-ok').onclick=closeModal;
}
function openMenu(){
  const active=!!S.startedAt && S.current<STEPS.length-1 && !S.finalized;
  openModal(`<h3>Menu</h3><div class="sheetlist">
    ${active?`<button class="warn" id="mn-withdraw">✕ Participant stops here</button>`:''}
    <button id="mn-protocol">✓ Protocol conformance</button>
    <button id="mn-params">⚙ Pilot parameters</button>
    <button id="mn-p0">∿ P0 computational validation</button>
    <button id="mn-calib">◎ G1 calibration record</button>
    <button id="mn-dist">⬆ Load disturbance trace</button>
    <button id="mn-surrogate">⚠ Install pilot surrogate disturbance</button>
    <button id="mn-export">⬇ Save session file</button>
    <button id="mn-import">⬆ Load session file</button>
    <button id="mn-analyze">▤ Trace viewer</button>
    <button id="mn-testmode">🧪 Testing mode — skip steps: ${testMode?'ON':'OFF'}</button>
    <button class="warn" id="mn-reset">↺ Reset session</button>
  </div>`);
  const on=(id,fn)=>{ const b=document.getElementById(id); if(b) b.onclick=fn; };
  if(active) on('mn-withdraw',()=>{ closeModal(); confirmWithdraw(); });
  on('mn-protocol',()=>{ closeModal(); uiView='protocol'; renderApp(); });
  on('mn-params',()=>{ closeModal(); uiView='params'; renderApp(); });
  on('mn-p0',()=>{ closeModal(); uiView='p0'; renderApp(); });
  on('mn-calib',()=>{ closeModal(); uiView='calib'; renderApp(); });
  on('mn-dist',()=>{ closeModal(); document.getElementById('dist-file').click(); });
  on('mn-surrogate',()=>{ closeModal(); installSurrogate(); renderApp(); });
  on('mn-export',()=>{ closeModal(); exportSession(); });
  on('mn-import',()=>{ closeModal(); document.getElementById('import-file').click(); });
  on('mn-analyze',()=>{ closeModal(); uiView='analyze'; renderApp(); });
  on('mn-testmode',()=>{ testMode=!testMode; try{ localStorage.setItem('sh_v16_testmode', testMode?'1':'0'); }catch(e){}
    log('Testing mode '+(testMode?'enabled':'disabled')); closeModal(); renderApp(); });
  on('mn-reset',()=>{ closeModal(); confirmReset(); });
}
function confirmReset(){
  openModal('<h3>Reset session?</h3><p>Clears this session and every stored block on this device. Save a copy first if you need it.</p><div class="btnrow"><button class="ghost" id="m-save">Save first</button><button class="warn" id="m-yes">Reset</button></div>');
  document.getElementById('m-save').onclick=()=>exportSession();
  document.getElementById('m-yes').onclick=()=>{ resetAll(); closeModal(); renderApp(); };
}

/* ── file inputs ────────────────────────────────────────────────── */
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
document.getElementById('menu-btn').onclick=openMenu;
document.getElementById('import-file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rec=JSON.parse(r.result);
      const src=rec.schedule?rec:null;
      if(!src) throw new Error('shape');
      openModal('<h3>Loaded for viewing</h3><p>Session files are read-only here. Use the trace viewer to inspect them; a finished session is not resumed from a file.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
      traceRows=[]; traceInduction=[]; ingestSession(rec); uiView='analyze'; renderApp();
    }catch(err){
      openModal('<h3>Could not load</h3><p>That does not look like a Steady Hands Study 2 session file.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
    }
  };
  r.readAsText(f); e.target.value='';
};
document.getElementById('analyze-file').onchange=e=>{
  const files=Array.from(e.target.files||[]); if(!files.length) return;
  let done=0;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ try{ ingestSession(JSON.parse(r.result)); }catch(err){}
      if(++done===files.length) renderAnalyze(); };
    r.readAsText(f);
  });
  e.target.value='';
};
document.getElementById('dist-file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let samples=null, hz=100, meta={name:f.name};
      if(/\.json$/i.test(f.name)){
        const rec=JSON.parse(r.result);
        samples=rec.samples||rec.data||rec.lateral||rec.values;
        hz=rec.hz||rec.sampleRate||rec.fs||100;
        meta=Object.assign(meta,{class:rec.class||rec.surfaceClass||null, journey:rec.journey||rec.source||null,
          note:rec.note||null, providedCorrelationTimeS:rec.correlationTimeS||null});
      } else {
        const lines=String(r.result).replace(/\r/g,'').split('\n').filter(l=>l.trim().length);
        const head=lines[0].split(',');
        let col=0, start=0;
        if(head.some(h=>isNaN(parseFloat(h)))){
          start=1;
          const idx=head.findIndex(h=>/lat|ay|accel|y/i.test(h.trim()));
          col=idx>=0?idx:0;
        }
        samples=lines.slice(start).map(l=>parseFloat(l.split(',')[col])).filter(v=>isFinite(v));
      }
      if(!samples || samples.length<600) throw new Error('too short');
      installDisturbance(Float32Array.from(samples), hz, meta);
      openModal('<h3>Trace installed</h3><p>'+esc(f.name)+' — '+samples.length+' samples at '+hz+' Hz, resampled to 60 Hz, band-limited '
        +P('distBandLowHz')+'–'+P('distBandHighHz')+' Hz and scaled to an RMS of '+P('distRms')+'. Measured correlation time '
        +(DIST.meta.correlationTimeS||'—')+' s'+(DIST.meta.inS12Range?' — inside the S1.2 measured range.':' — OUTSIDE the S1.2 measured range of 0.121–0.443 s.')
        +'</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
      renderApp();
    }catch(err){
      openModal('<h3>Could not read that trace</h3><p>Expected a JSON file with a <code>samples</code> array and an <code>hz</code> field, or a CSV with one column of lateral acceleration. At least 10 seconds of data.</p><div class="btnrow"><button class="ghost" id="m-close">Close</button></div>');
      document.getElementById('m-close').onclick=closeModal;
    }
  };
  r.readAsText(f); e.target.value='';
};

/* ── display refresh measurement, once, at load ─────────────────── */
let measuredHz=null;
(function measureHz(){
  const ts=[]; let k=0;
  const f=(t)=>{ ts.push(t); if(++k<40) requestAnimationFrame(f);
    else{ const d=[]; for(let i=1;i<ts.length;i++) d.push(ts[i]-ts[i-1]);
      d.sort((a,b)=>a-b); const med=d[Math.floor(d.length/2)];
      measuredHz=med>0?+(1000/med).toFixed(1):null;
      if(S.env) { S.env.displayHz=measuredHz; save(); } } };
  requestAnimationFrame(f);
})();

/* ── boot ───────────────────────────────────────────────────────── */
loadParams();
loadDistFromStore();
loadSession();
if(!S.steps.length){ S.seed=(Date.now()^hashStr(String(Math.random())))>>>0; initSteps(); }
else STEPS=buildSteps(S.orderIndex);
if(S.steps[S.current] && S.steps[S.current].status==='locked') S.steps[S.current].status='current';
if(S.startedAt) startTicker();
renderApp();
</script>
